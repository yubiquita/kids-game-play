        if (d.moved) { app.cam.x = d.cam.x - dx / app.T; app.cam.y = d.cam.y - dy / app.T; }
      }
    });
    const up = (e) => {
      if (input.joy && e.pointerId === input.joy.id) input.joy = null;
      const d = input.drag;
      if (d && e.pointerId === d.id) {
        if (!d.moved && e.type === 'pointerup') app.onTap(G.render.screenToTile(app, e.clientX, e.clientY));
        input.drag = null;
      }
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    addEventListener('keydown', (e) => { keys.add(e.key); });
    addEventListener('keyup', (e) => { keys.delete(e.key); });
    addEventListener('blur', () => keys.clear());
  }

  // 歩く向き（長さ1まで）
  function dir() {
    let vx = 0, vy = 0;
    if (keys.has('ArrowLeft') || keys.has('a')) vx -= 1;
    if (keys.has('ArrowRight') || keys.has('d')) vx += 1;
    if (keys.has('ArrowUp') || keys.has('w')) vy -= 1;
    if (keys.has('ArrowDown') || keys.has('s')) vy += 1;
    if (vx || vy) { const l = Math.hypot(vx, vy); return { vx: vx / l, vy: vy / l }; }
    const j = input.joy;
    if (!j) return { vx: 0, vy: 0 };
    let dx = (j.cx - j.ox) / RADIUS, dy = (j.cy - j.oy) / RADIUS;
    const l = Math.hypot(dx, dy);
    if (l < DEAD) return { vx: 0, vy: 0 };
    if (l > 1) { dx /= l; dy /= l; }
    return { vx: dx, vy: dy };
  }

  function reset() { input.joy = null; input.drag = null; }

  Object.assign(input, { init, dir, reset, RADIUS });
  G.input = input;
})(window.Game = window.Game || {});
</script>
<script>
// Canvas への描画。マス (x, y) の中心は整数の座標
(function (G) {
  function resize(app) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    app.W = innerWidth; app.H = innerHeight; app.dpr = dpr;
    app.canvas.width = app.W * dpr; app.canvas.height = app.H * dpr;
    app.canvas.style.width = app.W + 'px'; app.canvas.style.height = app.H + 'px';
    app.T = Math.max(36, Math.min(72, Math.round(Math.min(app.W, app.H) / 8)));
  }

  const toScreen = (app, x, y) => ({ x: (x - app.cam.x) * app.T + app.W / 2, y: (y - app.cam.y) * app.T + app.H / 2 });
  const screenToTile = (app, sx, sy) => ({
    x: Math.round((sx - app.W / 2) / app.T + app.cam.x), y: Math.round((sy - app.H / 2) / app.T + app.cam.y) });

  function emoji(ctx, ch, x, y, size) {
    ctx.fillStyle = "#000";
    ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.fillText(ch, x, y);
  }

  function tileRect(ctx, sx, sy, T, sp) {
    ctx.fillStyle = sp.color;
    ctx.fillRect(Math.floor(sx - T / 2), Math.floor(sy - T / 2), T + 1, T + 1); // +1 はすき間の線を消すため
    if (sp.line) { ctx.strokeStyle = sp.line; ctx.lineWidth = 2; ctx.strokeRect(sx - T / 2 + 1, sy - T / 2 + 1, T - 2, T - 2); }
  }

  function drawWall(ctx, sx, sy, T, sp) {
    tileRect(ctx, sx, sy, T, sp);
    ctx.strokeStyle = sp.line; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx - T / 2, sy); ctx.lineTo(sx + T / 2, sy);
    ctx.moveTo(sx, sy - T / 2); ctx.lineTo(sx, sy);
    ctx.moveTo(sx - T / 4, sy); ctx.lineTo(sx - T / 4, sy + T / 2);
    ctx.moveTo(sx + T / 4, sy); ctx.lineTo(sx + T / 4, sy + T / 2);
    ctx.stroke();
  }

  // クレーン台: ガラスの中に景品が小さく並び、下に 🕹️
  function drawCrane(ctx, sx, sy, T, rec) {
    const sp = G.sprites.crane;
    tileRect(ctx, sx, sy, T, sp);
    ctx.fillStyle = sp.glass;
    ctx.fillRect(sx - T * 0.4, sy - T * 0.42, T * 0.8, T * 0.42);
    if (rec) rec.slots.forEach((id, i) => {
      if (id) emoji(ctx, G.sprites.furniture[id].emoji, sx - T * 0.32 + i * T * 0.16, sy - T * 0.16, T * 0.17);
    });
    emoji(ctx, sp.emoji, sx, sy + T * 0.22, T * 0.36);
  }

  // ミニフィギュア: 台座（トロフィーは金色）の上に絵
  function drawFigure(ctx, id, x, y, size) {
    const S = G.sprites, k = G.gachaLogic.kindOf(id);
    ctx.fillStyle = k && k.trophy ? S.pedestalGold : S.pedestal;
    ctx.beginPath(); ctx.ellipse(x, y + size * 0.45, size * 0.45, size * 0.14, 0, 0, Math.PI * 2); ctx.fill();
    emoji(ctx, S.figures[id].emoji, x, y, size);
  }

  // ガシャ台: 色の台、丸いガラスにカプセルの点、下にシリーズの絵
  function drawGacha(ctx, sx, sy, T, type) {
    const S = G.sprites, sp = S[type], cap = S.capsule;
    tileRect(ctx, sx, sy, T, sp);
    ctx.fillStyle = S.gachaGlass;
    ctx.beginPath(); ctx.arc(sx, sy - T * 0.12, T * 0.3, 0, Math.PI * 2); ctx.fill();
    const dots = [[-0.12, -0.05, cap.top], [0.1, -0.02, '#42a5f5'], [-0.02, -0.18, '#ffca28'], [0.13, -0.2, '#66bb6a'], [-0.15, -0.22, '#ab47bc']];
    for (const [dx, dy, col] of dots) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(sx + dx * T, sy + dy * T, T * 0.07, 0, Math.PI * 2); ctx.fill(); }
    emoji(ctx, sp.emoji, sx, sy + T * 0.3, T * 0.28);
  }

  // かざりだな: 木の台に、飾ったフィギュアが3つ並ぶ
  function drawShelf(ctx, sx, sy, T, slots) {
    const sp = G.sprites.figureShelf;
    tileRect(ctx, sx, sy, T, sp);
    ctx.fillStyle = sp.board;
    ctx.fillRect(sx - T * 0.44, sy + T * 0.12, T * 0.88, T * 0.08);
    (slots || []).forEach((id, i) => { if (id) drawFigure(ctx, id, sx + (i - 1) * T * 0.3, sy - T * 0.08, T * 0.32); });
  }

  // 空のカプセル: 上下で色が違う小さい丸
  function drawCapsule(ctx, sx, sy, T) {
    const cap = G.sprites.capsule, r = T * 0.14, y = sy + T * 0.15;
    ctx.fillStyle = cap.bottom; ctx.beginPath(); ctx.arc(sx, y, r, 0, Math.PI); ctx.fill();
    ctx.fillStyle = cap.top; ctx.beginPath(); ctx.arc(sx, y, r, Math.PI, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = cap.line; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(sx, y, r, 0, Math.PI * 2); ctx.stroke();
  }

  // ペット: 動き方ごとのゆれ、芸、おなかが空の吹き出し、となりにいるときはハート
  function drawPet(app, pet, sx, sy, now, near) {
    const { ctx, T } = app, S = G.sprites, sp = S.pets[pet.kind], c = G.config;
    const move = G.pets.kindOf(pet.kind).move, size = T * sp.size;
    let lift = 0, angle = 0;
    if (move === 'hop' && pet.moving) lift = Math.abs(Math.sin(now * 10 + pet.id)) * T * 0.18;
    if (move === 'float') lift = T * 0.15 + Math.sin(now * 3 + pet.id) * T * 0.05;
    if (pet.trick) {
      const k = 1 - Math.max(0, pet.trick.until - app.s.time) / c.trickTime; // 0 → 1
      if (pet.trick.id === 'spin') angle = k * Math.PI * 2;
      if (pet.trick.id === 'jump') lift += Math.sin(k * Math.PI) * T * 0.5;
    }
    ctx.fillStyle = '#0003';
    ctx.beginPath(); ctx.ellipse(sx, sy + T * 0.25, size * 0.4, T * 0.08, 0, 0, Math.PI * 2); ctx.fill();
    const py = sy + T * 0.1 - lift;
    ctx.save(); ctx.translate(sx, py); ctx.rotate(angle);
    emoji(ctx, sp.emoji, 0, 0, size);
    ctx.restore();
    let top = py - size * 0.6;
    if (near) {
      const h = G.petCare.hearts(pet.love);
      ctx.font = `bold ${Math.round(T * 0.22)}px sans-serif`;
      ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#333';
      ctx.strokeText(pet.name, sx, top); ctx.fillText(pet.name, sx, top);
      top -= T * 0.22;
      if (h) { emoji(ctx, S.heart.emoji.repeat(h), sx, top, T * 0.2); top -= T * 0.2; }
    }
    if (pet.state === 'toy' && pet.toyKey) {
      const toy = G.pets.toyAt(app.s, pet.toyKey, pet);
      if (toy) emoji(ctx, toy.emoji, sx - size * 0.5, py - size * 0.6 - Math.abs(Math.sin(now * 6)) * T * 0.1, T * 0.25);
      if (toy && toy.shelf) emoji(ctx, S.heart.emoji, sx - size * 0.5, py - size * 0.95, T * 0.18);
    }
    if (pet.hunger <= 0) {
      emoji(ctx, '💭', sx + size * 0.5, py - size * 0.6, T * 0.4);
      emoji(ctx, S.petHungry.emoji, sx + size * 0.5, py - size * 0.62, T * 0.2);
    }
  }

  // 住人の吹き出し: おなか（お店へ向かう・お店に行けず待っている）＞ かなった ✨ ＞ 景品 🎁 ＞ ほしいもの 💭
  // 使っている家具の絵・遊んでいるクレーンの絵。となりならハート
  function drawResidentExtras(app, r, sx, sy, near) {
    const { ctx, T } = app, S = G.sprites;
    const wishBubble = (mark) => {
      const sp = S.furniture[r.wish];
      emoji(ctx, mark, sx + T * 0.35, sy - T * 0.5, T * 0.45);
      if (sp.emoji) emoji(ctx, sp.emoji, sx + T * 0.35, sy - T * 0.52, T * 0.22);
      else { ctx.fillStyle = sp.color; ctx.fillRect(sx + T * 0.27, sy - T * 0.6, T * 0.16, T * 0.16); }
    };
    if (G.residents.wantsBurger(r)) {
      emoji(ctx, '💭', sx + T * 0.35, sy - T * 0.5, T * 0.45);
      emoji(ctx, S.burger.emoji, sx + T * 0.35, sy - T * 0.52, T * 0.22);
    } else if (r.wish && G.wishes.granted(app.s, r)) wishBubble(S.sparkle.emoji);
    else if (r.gift) emoji(ctx, S.gift.emoji, sx + T * 0.35, sy - T * 0.5, T * 0.4);
    else if (r.wish) wishBubble('💭');
    if (r.state === 'using' && r.useKey) {
      const { x, y } = G.world.parseKey(r.useKey), o = G.world.objAt(app.s.world, x, y);
      if (o && S.furniture[o.type]) emoji(ctx, S.furniture[o.type].react, sx - T * 0.35, sy - T * 0.45, T * 0.3);
    }
    if (r.state === 'playingMachine') {
      const { x, y } = G.world.parseKey(r.machineKey), o = G.world.objAt(app.s.world, x, y);
      const ch = o && o.type === 'crane' ? S.crane.emoji : o && S[o.type] ? S[o.type].emoji : '';
      if (ch) emoji(ctx, ch, sx - T * 0.35, sy - T * 0.45, T * 0.3);
    }
    if (near && r.happiness) emoji(ctx, S.heart.emoji.repeat(r.happiness), sx, sy - T * 0.62, T * 0.18);
  }

  function draw(app) {
    const { ctx, T, W, H } = app, s = app.s, S = G.sprites, wd = s.world;
    ctx.setTransform(app.dpr, 0, 0, app.dpr, 0, 0);
    ctx.fillStyle = '#5d8a2f'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    const x0 = Math.max(0, Math.floor(app.cam.x - W / 2 / T) - 1), x1 = Math.min(wd.w - 1, Math.ceil(app.cam.x + W / 2 / T) + 1);
    const y0 = Math.max(0, Math.floor(app.cam.y - H / 2 / T) - 1), y1 = Math.min(wd.h - 1, Math.ceil(app.cam.y + H / 2 / T) + 1);

    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const { x: sx, y: sy } = toScreen(app, x, y);
      tileRect(ctx, sx, sy, T, G.world.hasFloor(wd, x, y) ? S.floor : S.grass);
      const o = G.world.objAt(wd, x, y);
      if (!o) continue;
      if (o.type === 'wall') drawWall(ctx, sx, sy, T, S.wall);
      else if (o.type === 'counter') {
        tileRect(ctx, sx, sy, T, S.counter);
        emoji(ctx, S.burger.emoji, sx, sy + T * 0.1, T * 0.45);
        const working = s.job.active && s.job.counter === G.world.key(x, y);
        if (!working) emoji(ctx, S.clerk.emoji, sx, sy - T * 0.35, T * 0.6);
      } else if (o.type === 'petCounter') {
        tileRect(ctx, sx, sy, T, S.petCounter);
        emoji(ctx, S.paw.emoji, sx, sy + T * 0.1, T * 0.45);
        emoji(ctx, S.petClerk.emoji, sx, sy - T * 0.35, T * 0.6);
      } else if (o.type === 'furnitureCounter') {
        tileRect(ctx, sx, sy, T, S.furnitureCounter);
        emoji(ctx, S.furnitureIcon.emoji, sx, sy + T * 0.1, T * 0.45);
        emoji(ctx, S.furnitureClerk.emoji, sx, sy - T * 0.35, T * 0.6);
      } else if (o.type === 'crane') drawCrane(ctx, sx, sy, T, s.cranes[G.world.key(x, y)]);
      else if (G.gachaLogic.isMachine(o.type)) drawGacha(ctx, sx, sy, T, o.type);
      else if (o.type === 'figureShelf') drawShelf(ctx, sx, sy, T, s.shelves[G.world.key(x, y)]);
      else if (S.furniture[o.type]) {
        const sp = S.furniture[o.type];
        if (sp.color) tileRect(ctx, sx, sy, T, sp);
        if (o.type === 'tv' && app.tvGlow && app.tvGlow.key === G.world.key(x, y) && s.time < app.tvGlow.until) {
          ctx.fillStyle = '#fff59d'; ctx.beginPath(); ctx.arc(sx, sy, T * 0.5, 0, Math.PI * 2); ctx.fill();
        }
        if (sp.emoji) emoji(ctx, sp.emoji, sx, sy, T * (sp.color ? 0.55 : 0.8));
      } else emoji(ctx, S[o.type].emoji, sx, sy, T * 0.8);
      if (o.own) emoji(ctx, '⭐', sx + T * 0.3, sy - T * 0.3, T * 0.3);
    }

    // 住人のベッドのはしに、その住人のフィギュア（新しいもの3つ）
    for (const r of s.residents) {
      if (!r.figures || !r.figures.length || r.bed.x < x0 || r.bed.x > x1 || r.bed.y < y0 || r.bed.y > y1) continue;
      const { x: sx, y: sy } = toScreen(app, r.bed.x, r.bed.y);
      r.figures.slice(-3).forEach((id, i) => drawFigure(ctx, id, sx - T * 0.3 + i * T * 0.3, sy + T * 0.3, T * 0.2));
    }
    for (const k of s.capsules) {
      const { x, y } = G.world.parseKey(k);
      if (x < x0 || x > x1 || y < y0 || y > y1) continue;
      const p = toScreen(app, x, y);
      drawCapsule(ctx, p.x, p.y, T);
    }

    if (app.mode === 'build') {
      ctx.strokeStyle = '#0002'; ctx.lineWidth = 1;
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const { x: sx, y: sy } = toScreen(app, x, y);
        ctx.strokeRect(sx - T / 2, sy - T / 2, T, T);
      }
    }

    // 人（奥から順に）
    const people = s.residents.map(r => ({ x: r.x, y: r.y, ch: r.look, r }));
    people.push({ x: s.player.x, y: s.player.y, ch: S.player.emoji, me: true });
    const nearPet = G.pets.near(s), nearRes = G.residents.near(s);
    for (const pet of s.pets) people.push({ x: pet.x, y: pet.y, pet, near: pet === nearPet });
    people.sort((a, b) => a.y - b.y);
    const now = performance.now() / 1000;
    for (const p of people) {
      const { x: sx, y: sy } = toScreen(app, p.x, p.y);
      if (sx < -T || sy < -T || sx > W + T || sy > H + T) continue;
      if (p.pet) { drawPet(app, p.pet, sx, sy, now, p.near); continue; }
      ctx.fillStyle = '#0003';
      ctx.beginPath(); ctx.ellipse(sx, sy + T * 0.32, T * 0.28, T * 0.1, 0, 0, Math.PI * 2); ctx.fill();
      emoji(ctx, p.ch, sx, sy - T * 0.05, T * 0.8);
      if (p.me) {
        ctx.fillStyle = '#ff5722';
        ctx.beginPath(); ctx.moveTo(sx, sy - T * 0.5); ctx.lineTo(sx - 7, sy - T * 0.62); ctx.lineTo(sx + 7, sy - T * 0.62); ctx.fill();
      } else drawResidentExtras(app, p.r, sx, sy, p.r === nearRes);
    }

    // ぷにコン
    const j = G.input.joy;
    if (j && app.mode === 'walk') {
      const R = G.input.RADIUS;
      let dx = j.cx - j.ox, dy = j.cy - j.oy; const l = Math.hypot(dx, dy);
      if (l > R) { dx = dx / l * R; dy = dy / l * R; }
      ctx.fillStyle = '#fff5'; ctx.beginPath(); ctx.arc(j.ox, j.oy, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fffc'; ctx.beginPath(); ctx.arc(j.ox + dx, j.oy + dy, R * 0.45, 0, Math.PI * 2); ctx.fill();
    }
  }

  G.render = { resize, draw, toScreen, screenToTile, drawFigure };
})(window.Game = window.Game || {});
</script>
<script>
// 画面の上に重ねる表示（DOM）: 上の表示・ボタン・つくるパレット・アルバイト画面・メニュー・ペットやさん・かぐやさん
// ・クレーンゲームの画面・ならべるの画面・ガシャの画面・かざる・あげる・ずかん
(function (G) {
  const S = () => G.sprites;
  let root, els = {}, last = {}, app, tab = 'parts'; // tab: パレットの列 'parts' | 'furniture' | 'gacha'
  const CAPSULE = '<span class="capsule"></span>';
  const figEmoji = (id) => S().figures[id].emoji;
  const figLabel = (id) => G.gachaLogic.kindOf(id).label;

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'class') e.className = v;
      else e.setAttribute(k, v);
    }
    for (const c of kids) e.append(c);
    return e;
  }
  // pointerdown で押す（タッチで反応を速く・ぷにコンと取り合わない）
  function btn(label, fn, attrs = {}) {
    const b = h('button', attrs);
    b.innerHTML = label;
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); if (!b.disabled) fn(); });
    return b;
  }

  const TOOLS = [
    { id: 'floor', icon: () => `<span class="swatch" style="background:${S().floor.color}"></span>`, label: 'ゆか' },
    { id: 'wall', icon: () => `<span class="swatch" style="background:${S().wall.color}"></span>`, label: 'かべ' },
    { id: 'door', icon: () => S().door.emoji, label: 'ドア' },
    { id: 'bed', icon: () => S().bed.emoji, label: 'ベッド' },
    { id: 'counter', icon: () => S().burger.emoji, label: 'カウンター' },
    { id: 'petCounter', icon: () => S().paw.emoji, label: 'ペットやさん' },
    { id: 'furnitureCounter', icon: () => S().furnitureIcon.emoji, label: 'かぐやさん' },
  ];
  const ERASE = { id: 'erase', icon: () => '🧽', label: 'けす' };

  // 家具の絵（絵文字がなければ色の四角）
  function furnIcon(id) {
    const sp = S().furniture[id];
    return sp.emoji || `<span class="swatch" style="background:${sp.color}"></span>`;
  }

  function init(a) {
    app = a;
    root = document.getElementById('ui');
    els.money = h('span', { class: 'pill', 'data-t': 'money' });
    els.bar = h('div', { class: 'bar' }, h('i'));
    els.hunger = h('span', { class: 'pill hunger' }, 'おなか', els.bar);
    els.food = h('span', { class: 'pill', 'data-t': 'food' });
    els.hand = h('span', { class: 'pill', 'data-t': 'hand' });
    els.build = btn('', () => app.toggleBuild(), { 'data-t': 'build' });
    els.menu = btn('≡', () => openMenu());
    root.append(h('div', { class: 'hud' }, els.money, els.food, els.hand, els.hunger, h('span', { class: 'spacer' }), els.build, els.menu));

    els.actions = h('div', { class: 'actions' });
    els.talk = btn('💬 はなす', () => app.talk(), { 'data-t': 'talk' });
    els.buy = btn('', () => app.buy(), { 'data-t': 'buy' });
    els.work = btn('🧑‍🍳 アルバイト', () => app.startJob(), { 'data-t': 'work' });
    els.petShop = btn(`${S().paw.emoji} かう`, () => openShelf(), { 'data-t': 'petshop' });
    els.pat = btn('🖐️ なでる', () => app.pat(), { 'data-t': 'pat' });
    els.feed = btn(`${S().food.emoji} えさ`, () => app.feed(), { 'data-t': 'feed' });
    els.follow = btn('', () => app.toggleFollow(), { 'data-t': 'follow' });
    els.toGo = btn('', () => app.toGo(), { 'data-t': 'togo' });
    els.eat = btn(`${S().burger.emoji} たべる`, () => app.eatHand(), { 'data-t': 'eat' });
    els.furnShop = btn(`${S().furnitureIcon.emoji} かう`, () => openFurnitureShelf(), { 'data-t': 'furnshop' });
    els.furnAct = btn('', () => app.furnitureAct(), { 'data-t': 'furnact' });
    els.stash = btn('🧊 しまう', () => app.stash(), { 'data-t': 'stash' });
    els.takeOut = btn('', () => app.takeOut(), { 'data-t': 'takeout' });
    els.cranePlay = btn('', () => app.cranePlay(), { 'data-t': 'craneplay' });
    els.craneStock = btn(`${S().furniture.bigBear.emoji} ならべる`, () => app.craneStock(), { 'data-t': 'cranestock' });
    els.giveFig = btn('🎁 あげる', () => openGive(), { 'data-t': 'give-fig' });
    els.gachaSpin = btn(`${CAPSULE} まわす`, () => app.gachaOpen(), { 'data-t': 'gachaspin' });
    els.decorate = btn('🖼️ かざる', () => openDecorate(), { 'data-t': 'decorate' });
    els.actions.append(els.talk, els.giveFig, els.buy, els.toGo, els.work, els.eat, els.petShop, els.pat, els.feed, els.follow,
      els.furnShop, els.furnAct, els.stash, els.takeOut, els.cranePlay, els.craneStock, els.gachaSpin, els.decorate);
    root.append(els.actions);

    els.palette = h('div', { class: 'palette' });
    root.append(els.palette);
    buildPalette();

    buildJob();
    buildCrane();
    buildStock();
    buildGacha();
    els.toast = h('div', { class: 'toast', style: 'display:none' });
    root.append(els.toast);
    root.append(h('div', { class: 'rotate' }, 'スマホを よこに してね 📱↻'));
  }

  const toolBtn = (id, icon, label) => btn(`${icon}<small>${label}</small>`, () => { app.tool = id; }, { 'data-tool': id });

  // パレットを今の列で作り直す。家具の列は、買った家具だけ
  function buildPalette() {
    els.palette.replaceChildren();
    if (tab === 'parts') {
      for (const t of TOOLS) els.palette.append(toolBtn(t.id, t.icon(), t.label));
      // クレーン台は建てるのにお金がかかる（足りないときは薄く）
      els.craneTool = btn(`${S().crane.emoji}<small>クレーン</small><small>${S().coin.emoji}${G.config.craneCost}</small>`,
        () => { app.tool = 'crane'; }, { 'data-tool': 'crane' });
      els.palette.append(els.craneTool);
      last.craneAfford = undefined;
      els.palette.append(btn(`${S().furniture.chair.emoji}<small>かぐ</small>`, () => openFurnitureTab(), { 'data-t': 'furntab' }));
      els.palette.append(btn(`${CAPSULE}<small>ガシャ</small>`, () => { tab = 'gacha'; buildPalette(); }, { 'data-t': 'gachatab' }));
    } else if (tab === 'gacha') {
      els.palette.append(btn('↩️<small>もどる</small>', () => { tab = 'parts'; buildPalette(); }, { 'data-t': 'partstab' }));
      // ガシャ台は建てるのにお金がかかる（足りないときは薄く）
      els.gachaTools = G.config.gachaSeries.map(g => {
        const sp = S()[g.machine];
        const b = btn(`<span class="swatch" style="background:${sp.color}">${sp.emoji}</span><small>${g.label}</small><small>${S().coin.emoji}${G.config.gachaCost}</small>`,
          () => { app.tool = g.machine; }, { 'data-tool': g.machine });
        els.palette.append(b);
        return b;
      });
      last.gachaAfford = undefined;
      const sh = S().figureShelf;
      els.palette.append(toolBtn('figureShelf', `<span class="swatch" style="background:${sh.color}">🖼️</span>`, 'かざりだな'));
    } else {
      els.palette.append(btn('↩️<small>もどる</small>', () => { tab = 'parts'; buildPalette(); }, { 'data-t': 'partstab' }));
      for (const k of G.config.furnitureKinds)
        if (G.furniture.isUnlocked(app.s, k.id)) els.palette.append(toolBtn(k.id, furnIcon(k.id), k.label));
    }
    els.palette.append(toolBtn(ERASE.id, ERASE.icon(), ERASE.label));
    last.tool = undefined; // 選んでいる部品の印を付け直す
  }

  function openFurnitureTab() {
    if (!app.s.unlocked.length) { toast('かぐやさんで かうと おけるよ'); return; }
    tab = 'furniture';
    buildPalette();
  }

  function buildJob() {
    const J = S().ingredients;
    els.order = h('div', { class: 'stack', 'data-t': 'order' });
    els.customer = h('div', { class: 'customer' });
    els.mine = h('div', { class: 'stack', 'data-t': 'mine' });
    els.wait = h('div', { class: 'wait' });
    els.give = btn('✋ わたす', () => app.deliver(), { class: 'give', 'data-t': 'give' });
    const controls = h('div', { class: 'controls' });
    for (const id of G.burgerJob.FILLINGS.concat(['bun']).reverse())
      controls.append(btn(`${J[id].emoji}`, () => app.addLayer(id), { 'data-ing': id, title: J[id].label }));
    controls.append(btn('↩️ 1つとる', () => app.removeLayer(), { 'data-t': 'undo' }), els.give,
      btn('おわる', () => app.endJob(), { class: 'end', 'data-t': 'endjob' }));
    els.job = h('div', { class: 'job' },
      h('div', { class: 'col' }, h('div', { class: 'title' }, 'ちゅうもん'), els.wait, els.order, els.customer),
      h('div', { class: 'col' }, h('div', { class: 'title' }, 'つくってる ハンバーガー'), els.mine),
      controls);
    root.append(els.job);
  }

  // クレーンの画面: 6列（左はしが取り出し口、そのあと場所0〜4）。アームは armX から位置を決める
  function buildCrane() {
    els.cMeter = h('div', { class: 'meter', 'data-t': 'cranemeter' });
    els.cSlots = [];
    const slots = h('div', { class: 'cslots' }, h('div', { class: 'chute' }, '⬇️'));
    for (let i = 0; i < G.config.craneSlots; i++) { const c = h('div', { class: 'cslot', 'data-slot': i }); els.cSlots.push(c); slots.append(c); }
    els.cRope = h('div', { class: 'rope' });
    els.cClaw = h('div', { class: 'claw' });
    els.cArm = h('div', { class: 'arm' }, els.cRope, els.cClaw);
    els.cMsg = h('div', { class: 'cmsg' });
    const field = h('div', { class: 'cfield' }, els.cArm, slots, els.cMsg);
    els.cGo = h('button', { class: 'go', 'data-t': 'cranego' });
    els.cGo.innerHTML = '➡️';
    const up = () => app.craneHold(false);
    els.cGo.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      if (els.cGo.disabled) return;
      try { els.cGo.setPointerCapture(e.pointerId); } catch (_) { /* 取れなくても動く */ }
      app.craneHold(true);
    });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) els.cGo.addEventListener(ev, up);
    els.cQuit = btn('やめる', () => app.craneQuit(), { class: 'end', 'data-t': 'cranequit' });
    els.crane = h('div', { class: 'crane', style: 'display:none' },
      h('div', { class: 'ctop' }, h('div', { class: 'title' }, `${S().crane.emoji} クレーンゲーム`), els.cMeter),
      field,
      h('div', { class: 'controls' }, els.cGo, els.cQuit));
    root.append(els.crane);
  }

  function updateCrane(s) {
    const cp = s.cranePlay, rec = s.cranes[cp.key], c = G.config;
    if (!rec) return;
    const caught = cp.phase === 'result' && cp.result && cp.result.caught;
    rec.slots.forEach((id, i) => set('cslot' + i, id || '', v => { els.cSlots[i].textContent = v ? S().furniture[v].emoji : ''; }));
    // アーム: 結果で取れたときは取り出し口へ戻る
    let x = cp.armX, down = 0;
    if (cp.phase === 'dropping') { const k = cp.t / c.craneDropTime; down = k < 0.5 ? k * 2 : (1 - k) * 2; }
    if (caught) x = cp.armX + (G.craneGame.ARM_START - cp.armX) * Math.min(1, cp.t / (c.craneResultTime * 0.6));
    const cols = c.craneSlots + 1;
    els.cArm.style.left = `${(x + 1.5) / cols * 100}%`;
    els.cRope.style.height = `${8 + down * 55}%`;
    set('claw', caught ? cp.result.id : '', v => { els.cClaw.innerHTML = '🪝' + (v ? `<span>${S().furniture[v].emoji}</span>` : ''); });
    // あとちょっとメーター: アームにいちばん近い景品の「かならず取れる回数」まで
    const ni = G.craneGame.nearestSlot(rec.slots, cp.armX);
    const need = ni >= 0 ? G.craneGame.triesOf(rec.slots[ni]) - 1 : 0;
    set('cmeter', `${rec.meter},${need}`, () => {
      const n = Math.min(rec.meter, need);
      els.cMeter.innerHTML = need ? `あとちょっと ${'🔴'.repeat(n)}${'⚪'.repeat(need - n)}` : '';
      if (need && rec.meter >= need) els.cMeter.innerHTML = 'つぎは かならず とれる！';
    });
    let msg = '';
    if (cp.phase === 'ready') msg = '➡️ を おしてる あいだ うごくよ';
    else if (cp.phase === 'result') msg = cp.result.caught ? 'とれた！' : 'あとちょっと！';
    set('cmsg', msg, v => { els.cMsg.textContent = v; });
    set('cgo', cp.phase === 'ready' || cp.phase === 'moving', v => { els.cGo.disabled = !v; });
    set('cquit', cp.phase === 'ready', v => { els.cQuit.disabled = !v; });
  }

  // ならべるの画面: 見本（うすい絵）の上に、光っている場所から左から順に置く
  function buildStock() {
    els.sCells = [];
    const row = h('div', { class: 'srow' });
    for (let i = 0; i < G.config.craneSlots; i++) { const c = h('div', { class: 'scell', 'data-cell': i }); els.sCells.push(c); row.append(c); }
    const pick = h('div', { class: 'spick' });
    for (const id of G.craneGame.prizeIds()) {
      const b = btn(S().furniture[id].emoji, () => {
        if (app.stockPick(id).ok) return;
        b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      }, { 'data-prize': id });
      pick.append(b);
    }
    els.stock = h('div', { class: 'stock', style: 'display:none' },
      h('div', { class: 'title' }, `${S().furniture.bigBear.emoji} みほんと おなじに ならべてね`), row, pick,
      h('div', { class: 'controls' }, btn('やめる', () => app.stockQuit(), { class: 'end', 'data-t': 'stockquit' })));
    root.append(els.stock);
  }

  function updateStock(s) {
    const cp = s.cranePlay;
    set('stock', `${cp.key},${cp.done},${cp.target.join()}`, () => {
      const placed = new Set(cp.todo.slice(0, cp.done)), cur = cp.todo[cp.done];
      cp.target.forEach((id, i) => {
        const cell = els.sCells[i], todo = cp.todo.indexOf(i) >= 0;
        cell.textContent = id ? S().furniture[id].emoji : '';
        cell.className = 'scell' + (todo && !placed.has(i) ? ' mihon' : '') + (i === cur ? ' now' : '');
      });
    });
  }

  // ガシャの画面: 台の絵 → ぐるっ → カプセル（タップで開く）→ 出たもの
  function buildGacha() {
    els.gTitle = h('div', { class: 'title' });
    els.gCount = h('div', { class: 'meter', 'data-t': 'gachacount' });
    els.gMachine = h('div', { class: 'gmachine' }, h('div', { class: 'gglass' }, h('i'), h('i'), h('i'), h('i'), h('i')),
      h('div', { class: 'ghandle' }, '⚙️'));
    els.gCapsule = btn('<span class="capsule big"></span>', () => app.gachaCrack(), { class: 'gcap', 'data-t': 'gachacap' });
    els.gResult = h('div', { class: 'gresult', 'data-t': 'gacharesult' });
    els.gMsg = h('div', { class: 'gmsg' });
    const field = h('div', { class: 'gfield' }, els.gMachine, h('div', { class: 'gout' }, els.gMsg, els.gCapsule, els.gResult));
    els.gTurn = btn('', () => app.gachaTurn(), { class: 'go', 'data-t': 'gachaturn' });
    els.gClose = btn('とじる', () => app.gachaClose(), { class: 'end', 'data-t': 'gachaclose' });
    els.gacha = h('div', { class: 'gacha', style: 'display:none' },
      h('div', { class: 'ctop' }, els.gTitle, els.gCount), field, h('div', { class: 'controls' }, els.gTurn, els.gClose));
    root.append(els.gacha);
  }

  function updateGacha(s) {
    const gp = s.gachaPlay, series = G.gacha.seriesAt(s, gp.key);
    if (!series) return;
    const g = G.gachaLogic.seriesInfo(series), sp = S()[g.machine];
    set('gtitle', series, () => {
      els.gTitle.innerHTML = `${sp.emoji} ${g.label}`;
      els.gMachine.style.background = sp.color;
      els.gMachine.style.borderColor = sp.line;
    });
    const figs = G.gachaLogic.seriesFigures(series), have = figs.filter(id => G.figures.count(s, id)).length;
    set('gcount', `${have}/${figs.length}`, v => { els.gCount.textContent = `あつめた ${v}${G.figures.count(s, g.trophy) ? ' 🏆' : ''}`; });
    set('gphase', gp.phase + (gp.result ? gp.result.id : ''), () => {
      els.gMachine.classList.toggle('turning', gp.phase === 'turning');
      show(els.gCapsule, gp.phase === 'capsule');
      show(els.gResult, gp.phase === 'open');
      if (gp.phase === 'open') {
        const r = gp.result;
        els.gResult.innerHTML = `<span class="fig">${figEmoji(r.id)}</span><b>${figLabel(r.id)}</b>` +
          (r.isNew ? `<em>${S().newMark}</em>` : '<small>あげられるよ</small>');
      }
      const msg = { ready: 'ぐるっ と まわしてね', turning: 'がちゃ がちゃ…', capsule: 'カプセルを タップ！', open: '' }[gp.phase];
      els.gMsg.textContent = msg;
      els.gTurn.innerHTML = `${gp.phase === 'open' ? 'もういっかい' : 'ぐるっ'}（${G.config.gachaPlayPrice}${S().coin.emoji}）`;
      show(els.gTurn, gp.phase === 'ready' || gp.phase === 'open');
    });
    set('gafford', s.player.money >= G.config.gachaPlayPrice, v => els.gTurn.classList.toggle('dim', !v));
  }

  // フィギュアのボタン（台座つき）
  function figBtn(id, extra, fn, attrs = {}) {
    const trophy = G.gachaLogic.kindOf(id).trophy;
    return btn(`<span class="fig${trophy ? ' gold' : ''}">${figEmoji(id)}</span>${extra}`, fn, Object.assign({ 'data-fig': id }, attrs));
  }

  // かざる画面: 上にたなの3つの場所、下に持っているフィギュア（シリーズごと）
  function openDecorate() {
    const s = app.s, k = G.figures.nearShelf(s);
    if (!k) return;
    const sh = G.figures.shelfAt(s, k);
    let cur = Math.max(0, sh.indexOf(null));
    const row = h('div', { class: 'srow' });
    const cells = sh.map((_, i) => { const c = btn('', () => { cur = i; refresh(); }, { class: 'scell', 'data-cell': i }); row.append(c); return c; });
    const list = h('div', { class: 'figlist' });
    let any = false;
    for (const g of G.config.gachaSeries) {
      const ids = G.config.figureKinds.filter(f => f.series === g.id && G.figures.count(s, f.id)).map(f => f.id);
      if (!ids.length) continue;
      any = true;
      const line = h('div', { class: 'figrow' });
      for (const id of ids) line.append(figBtn(id, '', () => {
        app.decorate(k, cur, id);
        const next = sh.indexOf(null, cur + 1);
        cur = next >= 0 ? next : (sh.indexOf(null) >= 0 ? sh.indexOf(null) : cur);
        refresh();
      }));
      list.append(line);
    }
    if (!any) list.append(h('div', { class: 'note' }, 'ガシャを まわすと かざれるよ'));
    const refresh = () => sh.forEach((id, i) => {
      cells[i].innerHTML = id ? `<span class="fig${G.gachaLogic.kindOf(id).trophy ? ' gold' : ''}">${figEmoji(id)}</span>` : '';
      cells[i].classList.toggle('now', i === cur);
    });
    const { close } = modal(h('div', { class: 'title' }, '🖼️ かざりだな'), row, list,
      h('div', { class: 'names' }, btn('はずす', () => { app.decorate(k, cur, null); refresh(); }, { 'data-t': 'unset' }),
        btn('とじる', () => close(), { 'data-t': 'closedecorate' })));
    refresh();
  }

  // あげる画面: 2体目からのフィギュア
  function openGive() {
    const r = G.residents.near(app.s);
    if (!r) return;
    const list = h('div', { class: 'figrow wrap' });
    for (const id of G.figures.giftable(app.s))
      list.append(figBtn(id, `<small>×${G.figures.count(app.s, id) - 1}</small>`, () => { close(); app.give(r, id); }));
    const { close } = modal(h('div', { class: 'title' }, `${r.look} ${r.name}に なにを あげる？`), list,
      btn('やめる', () => close(), { 'data-t': 'closegive' }));
  }

  // ずかん: シリーズごとに1行。持っていないものは「？」
  function openZukan() {
    const s = app.s, rows = [];
    for (const g of G.config.gachaSeries) {
      const figs = G.gachaLogic.seriesFigures(g.id), have = figs.filter(id => G.figures.count(s, id)).length;
      const line = h('div', { class: 'figrow' });
      for (const id of figs) {
        const n = G.figures.count(s, id);
        line.append(h('div', { class: 'zcell' + (n ? '' : ' unknown'), 'data-zukan': id },
          ...(n ? [h('span', { class: 'fig' }, figEmoji(id)), h('small', {}, figLabel(id))] : [h('span', { class: 'fig' }, '？'), h('small', {}, '　')]),
          ...(n >= 2 ? [h('b', { class: 'badge' }, `×${n}`)] : [])));
      }
      rows.push(h('div', { class: 'zhead' }, `${S()[g.machine].emoji} ${g.label}　${have}/${figs.length}`,
        h('span', { class: G.figures.count(s, g.trophy) ? '' : 'dim' }, '🏆')), line);
    }
    const { close } = modal(h('div', { class: 'title' }, '📖 ずかん'), h('div', { class: 'zukan' }, ...rows),
      btn('とじる', () => close(), { 'data-t': 'closezukan' }));
  }

  function stackHTML(list) {
    const J = S().ingredients;
    return list.map(id => `<span style="background:${J[id].color}">${J[id].emoji}</span>`).join('');
  }

  // 変わったときだけ DOM を書き換える
  function set(name, value, fn) { if (last[name] !== value) { last[name] = value; fn(value); } }
  const show = (el, on) => { el.style.display = on ? '' : 'none'; };

  function update() {
    const s = app.s, p = s.player, mode = app.mode;
    set('money', p.money, v => { els.money.textContent = `${S().coin.emoji} ${v}`; });
    set('food', p.food, v => { els.food.textContent = `${S().food.emoji} ${v}`; els.feed.disabled = v <= 0; });
    set('hand', p.hand, v => {
      els.hand.textContent = `${S().burger.emoji} ${v}`;
      els.toGo.disabled = v >= G.config.handMax;
      els.stash.disabled = v <= 0;
    });
    set('fridge', `${s.fridge},${p.hand}`, () => {
      els.takeOut.innerHTML = `🧊 とりだす（のこり ${s.fridge}）`;
      els.takeOut.disabled = s.fridge <= 0 || p.hand >= G.config.handMax;
    });
    set('unlocked', s.unlocked.join(), () => { if (tab === 'furniture') buildPalette(); });
    set('hunger', Math.ceil(p.hunger), v => {
      els.bar.firstChild.style.width = (v / G.config.hungerMax * 100) + '%';
      els.bar.classList.toggle('empty', v <= 0);
    });
    set('mode', mode, m => {
      els.build.innerHTML = m === 'build' ? '✅ もどる' : '🔨 つくる';
      show(els.build, m === 'walk' || m === 'build');
      show(els.palette, m === 'build');
      show(els.job, m === 'job');
      show(els.crane, m === 'crane');
      show(els.stock, m === 'stock');
      show(els.gacha, m === 'gacha');
      show(els.actions, m === 'walk');
    });
    if (els.craneTool) set('craneAfford', p.money >= G.config.craneCost, v => els.craneTool.classList.toggle('dim', !v));
    if (tab === 'gacha' && els.gachaTools) set('gachaAfford', p.money >= G.config.gachaCost, v => els.gachaTools.forEach(b => b.classList.toggle('dim', !v)));
    set('tool', app.tool, t => {
      for (const b of els.palette.children) b.classList.toggle('on', b.dataset.tool === t);
    });

    if (mode === 'walk') {
      const near = G.residents.near(s), counter = G.shop.nearCounter(s);
      set('near', !!near, v => show(els.talk, v));
      set('counter', !!counter, v => { show(els.buy, v); show(els.work, v); show(els.toGo, v); });
      set('price', G.config.burgerPrice, v => {
        els.buy.innerHTML = `🍔 かう（${v}）`;
        els.toGo.innerHTML = `${S().toGo.emoji} もちかえる（${v}）`;
      });
      set('eat', p.hand > 0, v => show(els.eat, v));
      set('furnShop', !!G.furnitureShop.nearShop(s), v => show(els.furnShop, v));
      const f = G.furniture.near(s), kind = f && G.furniture.kindOf(f.kind);
      set('furnAct', kind && kind.action ? f.kind : '', v => {
        show(els.furnAct, !!v);
        if (v) els.furnAct.innerHTML = `${S().furniture[v].react} ${kind.action}`;
      });
      set('nearFridge', !!f && f.kind === 'fridge', v => { show(els.stash, v); show(els.takeOut, v); });
      const pet = G.pets.near(s);
      set('petShop', !!G.petShop.nearPetShop(s), v => show(els.petShop, v));
      set('pet', !!pet, v => { show(els.pat, v); show(els.feed, v); show(els.follow, v); });
      set('follow', pet ? pet.follow : null, v => { els.follow.innerHTML = v ? '🏠 おうちにいて' : '🐾 ついてきて'; });
      const ck = G.crane.near(s);
      set('craneNear', !!ck, v => show(els.cranePlay, v));
      set('cranePrice', G.config.cranePlayPrice, v => { els.cranePlay.innerHTML = `${S().crane.emoji} あそぶ（${v}）`; });
      set('cranePlayDim', ck ? !!G.crane.playBlock(s, ck) : false, v => els.cranePlay.classList.toggle('dim', v));
      const sb = ck ? G.crane.stockBlock(s, ck) : 'full';
      set('craneStock', sb !== 'full', v => show(els.craneStock, v));
      set('craneStockDim', sb === 'busy', v => els.craneStock.classList.toggle('dim', v));
      set('giveFig', !!near && G.figures.giftable(s).length > 0, v => show(els.giveFig, v));
      const gk = G.gacha.near(s);
      set('gachaNear', !!gk, v => show(els.gachaSpin, v));
      set('gachaDim', gk ? !!G.gacha.openBlock(s, gk) : false, v => els.gachaSpin.classList.toggle('dim', v));
      set('shelfNear', !!G.figures.nearShelf(s), v => show(els.decorate, v));
    }

    if (mode === 'crane' && s.cranePlay && s.cranePlay.mode === 'play') updateCrane(s);
    if (mode === 'stock' && s.cranePlay && s.cranePlay.mode === 'stock') updateStock(s);
    if (mode === 'gacha' && s.gachaPlay) updateGacha(s);

    if (mode === 'job') {
      const j = s.job, cust = s.residents.find(r => r.id === j.customerId);
      const waitMsg = j.order ? '' : (s.residents.length ? 'おきゃくさんを まってるよ…' : 'ベッドを おくと<br>おきゃくさんが くるよ');
      set('wait', waitMsg, v => { els.wait.innerHTML = v; show(els.wait, !!v); });
      set('order', j.order ? j.order.join() : '', () => { els.order.innerHTML = j.order ? stackHTML(j.order) : ''; });
      set('cust', cust ? cust.look + cust.name : '', () => { els.customer.innerHTML = cust ? `${cust.look}<div style="font-size:16px">${cust.name}</div>` : ''; });
      set('mine', j.stack.join(), () => { els.mine.innerHTML = stackHTML(j.stack); });
      set('give', G.burgerJob.canDeliver(j.stack, j.order), v => { els.give.disabled = !v; });
    }

    if (app.toastUntil && performance.now() > app.toastUntil) { app.toastUntil = 0; show(els.toast, false); }
  }

  function toast(text, ms = 2500) {
    els.toast.textContent = text;
    show(els.toast, true);
    app.toastUntil = performance.now() + ms;
  }

  function pop(text) {
    const e = h('div', { class: 'pop' }, text);
    root.append(e);
    setTimeout(() => e.remove(), 1000);
  }

  // 画面の上に重ねる箱。戻り値の close で閉じる
  function modal(...kids) {
    const box = h('div', { class: 'box' }, ...kids);
    const m = h('div', { class: 'modal' }, box);
    root.append(m);
    return { box, close: () => m.remove() };
  }

  function openMenu() {
    const file = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
    const fs = app.canFullscreen
      ? [btn(app.isFullscreen() ? '⛶ ぜんがめんを やめる' : '⛶ ぜんがめんに する', () => { close(); app.toggleFullscreen(); }, { 'data-t': 'fullscreen' })]
      : [];
    const { close } = modal(...fs,
      btn('📖 ずかん', () => { close(); openZukan(); }, { 'data-t': 'zukan' }),
      btn('💾 セーブを ファイルに かきだす', () => { close(); app.exportSave(); }),
      btn('📂 ファイルから よみこむ', () => file.click()),
      btn('とじる', () => close()), file);
    file.addEventListener('change', async () => {
      const f = file.files[0]; if (!f) return;
      close();
      app.importSave(await f.text());
    });
  }

  // ペットやさんの棚: ペット8種類とえさ。お金が足りないものは押せない
  function openShelf() {
    const c = G.config, coin = S().coin.emoji;
    const money = h('div', { class: 'title' });
    const grid = h('div', { class: 'shelf' });
    const items = [];
    for (const k of c.petKinds) {
      const b = btn(`${S().pets[k.id].emoji}<small>${k.label}</small><small>${coin} ${k.price}</small>`,
        () => { close(); openNames(k.id); }, { 'data-pet': k.id });
      items.push([b, k.price]);
      grid.append(b);
    }
    const food = btn(`${S().food.emoji}<small>えさ</small><small>${coin} ${c.foodPrice}</small>`,
      () => { app.buyFood(); refresh(); }, { 'data-t': 'buyfood' });
    items.push([food, c.foodPrice]);
    grid.append(food);
    const refresh = () => {
      const p = app.s.player;
      money.textContent = `ペットやさん　${coin} ${p.money}　${S().food.emoji} ${p.food}`;
      for (const [b, price] of items) b.disabled = p.money < price;
    };
    const { close } = modal(money, grid, btn('とじる', () => close(), { 'data-t': 'closeshelf' }));
    refresh();
  }

  // かぐやさんの棚: 家具10種類。買ったものは ✅、お金が足りないものは押せない
  function openFurnitureShelf() {
    const coin = S().coin.emoji;
    const money = h('div', { class: 'title' });
    const grid = h('div', { class: 'shelf' });
    const items = [];
    for (const k of G.config.furnitureKinds.filter(k => !k.prize)) { // 景品はクレーンでしか取れない
      const b = btn('', () => { app.buyFurniture(k.id); refresh(); }, { 'data-furn': k.id });
      items.push([b, k]);
      grid.append(b);
    }
    const refresh = () => {
      const s = app.s;
      money.textContent = `かぐやさん　${coin} ${s.player.money}`;
      for (const [b, k] of items) {
        const owned = G.furniture.isUnlocked(s, k.id);
        b.innerHTML = `${furnIcon(k.id)}<small>${k.label}</small><small>${owned ? '✅' : `${coin} ${k.price}`}</small>`;
        b.disabled = owned || s.player.money < k.price;
      }
    };
    const { close } = modal(money, grid, btn('とじる', () => close(), { 'data-t': 'closefurnshelf' }));
    refresh();
  }

  // 名前を候補から選ぶ。選んだら買う。やめたら買わない
  function openNames(kind) {
    const sp = S().pets[kind];
    const row = h('div', { class: 'names' });
    G.petCare.nameChoices(kind, G.rng).forEach((name, i) =>
      row.append(btn(name, () => { close(); app.buyPet(kind, name); }, { 'data-name': i })));
    const { close } = modal(h('div', { class: 'title' }, `${sp.emoji} なまえを えらんでね`), row,
      btn('やめる', () => close(), { 'data-t': 'cancelname' }));
  }

  G.ui = { init, update, toast, pop };
})(window.Game = window.Game || {});
</script>
<script>
// 全体の流れ: 読み込み → ループ（動かす・描く・自動セーブ）、モード切り替え
(function (G) {
  const MSG = {
    occupied: 'ひとが いるところには おけないよ',
    ownBed: 'じぶんの ベッドは けせないよ',
    money: 'おかねが たりないよ。アルバイトしよう！',
    full: 'おうちが いっぱいだよ',
    food: 'えさを ペットやさんで かってね',
    owned: 'もう もってるよ',
    hand: 'もう もてないよ',
    fridgeFull: 'れいぞうこが いっぱいだよ',
    empty: 'からっぽだよ。ならべて あげよう',
  };
  const coin = () => G.sprites.coin.emoji;
  const prizeLabel = (id) => G.furniture.kindOf(id).label;

  const loaded = G.save.load(localStorage);
  const app = {
    s: loaded.state, mode: 'walk', tool: 'floor', cam: { x: 0, y: 0 },
    canvas: document.getElementById('screen'), toastUntil: 0, saveTimer: 0, wasHungry: false,
    tvGlow: null, // テレビが光っている { key, until }（セーブしない）
  };
  app.ctx = app.canvas.getContext('2d');
  app.cam = { x: app.s.player.x, y: app.s.player.y };

  const persist = () => G.save.save(localStorage, app.s);

  function setMode(m) {
    app.mode = m;
    G.input.reset();
    persist();
  }

  app.toggleBuild = () => {
    if (app.mode === 'build') { setMode('walk'); return; }
    setMode('build');
  };

  app.onTap = (t) => {
    if (app.mode !== 'build') return;
    const s = app.s;
    const gacha = G.gachaLogic.isMachine(app.tool);
    const res = app.tool === 'erase' ? G.world.erase(s.world, t.x, t.y)
      : app.tool === 'crane' ? G.crane.build(s, t.x, t.y)
        : gacha ? G.gacha.build(s, t.x, t.y, app.tool)
          : G.world.place(s.world, t.x, t.y, app.tool, G.state.occupied(s));
    if (!res.ok && MSG[res.why]) G.ui.toast(MSG[res.why]);
    if (app.tool === 'crane' && res.ok && !res.same) G.ui.pop(`-${G.config.craneCost} ${coin()}`);
    if (gacha && res.ok && !res.same) G.ui.pop(`-${G.config.gachaCost} ${coin()}`);
    // 台を消した・上書きしたら、建てたお金がもどる
    const refund = G.crane.reconcile(s) + G.gacha.reconcile(s) + (res.refund || 0);
    if (refund) setTimeout(() => G.ui.pop(`+${refund} ${coin()}`), res.ok && !res.same && (gacha || app.tool === 'crane') ? 500 : 0);
  };

  app.talk = () => {
    const r = G.residents.near(app.s);
    if (!r) return;
    const res = G.residents.talk(app.s, r);
    let text = `${r.look} ${r.name}「${res.text}」`;
    if (res.gift) {
      text += res.gift.isNew ? ` ${prizeLabel(res.gift.id)}が おけるように なったよ！` : ' また もらった！';
      G.ui.pop(G.sprites.furniture[res.gift.id].emoji);
    }
    G.ui.toast(text, 3000);
    if (res.reward) G.ui.pop(`+${res.reward} ${coin()}`);
  };

  app.buy = () => {
    const res = G.shop.buy(app.s);
    if (res.ok) { G.ui.pop('😋 もぐもぐ'); app.wasHungry = false; }
    else G.ui.toast(MSG[res.why]);
  };

  app.startJob = () => {
    const k = G.shop.nearCounter(app.s);
    if (!k) return;
    G.shop.startJob(app.s, k);
    setMode('job');
  };
  app.endJob = () => { G.shop.endJob(app.s); setMode('walk'); };
  app.addLayer = (id) => { if (app.s.job.order) G.burgerJob.addLayer(app.s.job.stack, id); };
  app.removeLayer = () => { G.burgerJob.removeLayer(app.s.job.stack); };
  app.deliver = () => {
    const res = G.shop.deliver(app.s);
    if (res.ok) G.ui.pop(`+${res.reward} ${G.sprites.coin.emoji}`);
  };

  // ペット
  app.buyPet = (kind, name) => {
    const res = G.petShop.buyPet(app.s, kind, name);
    if (res.ok) { G.ui.pop(G.sprites.pets[kind].emoji); G.ui.toast(`${name}が なかまに なったよ！`); }
    else G.ui.toast(MSG[res.why]);
  };
  app.buyFood = () => {
    const res = G.petShop.buyFood(app.s);
    if (res.ok) G.ui.pop(`+1 ${G.sprites.food.emoji}`);
    else G.ui.toast(MSG[res.why]);
  };
  // なかよしが増えたときのお知らせ
  function celebrate(pet, res) {
    const labels = G.sprites.trickLabels;
    if (res.newTricks.length) G.ui.toast(`${pet.name}は「${labels[res.newTricks[0]]}」を おぼえたよ！`, 3000);
    else if (res.heartUp) G.ui.toast(`${pet.name}と なかよしに なったよ！`, 3000);
  }
  app.pat = () => {
    const pet = G.pets.near(app.s);
    if (!pet) return;
    G.ui.pop(G.sprites.heart.emoji);
    celebrate(pet, G.pets.pat(app.s, pet));
  };
  app.feed = () => {
    const pet = G.pets.near(app.s);
    if (!pet) return;
    const res = G.pets.feed(app.s, pet);
    if (!res.ok) { G.ui.toast(MSG[res.why]); return; }
    G.ui.pop('😋');
    celebrate(pet, res);
  };
  app.toggleFollow = () => {
    const pet = G.pets.near(app.s);
    if (!pet) return;
    G.pets.setFollow(pet, !pet.follow);
    G.ui.toast(pet.follow ? `${pet.name}「ついていくよ！」` : `${pet.name}「おうちで まってるね」`);
  };

  // かぐやさん・家具・冷蔵庫
  app.buyFurniture = (id) => {
    const res = G.furnitureShop.buy(app.s, id);
    if (res.ok) { G.ui.pop(G.sprites.furniture[id].emoji || '✅'); G.ui.toast(`${res.kind.label}が おけるように なったよ！`); }
    else G.ui.toast(MSG[res.why]);
  };
  app.toGo = () => {
    const res = G.shop.buyToGo(app.s);
    if (res.ok) G.ui.pop(`+1 ${G.sprites.burger.emoji}`);
    else G.ui.toast(MSG[res.why]);
  };
  app.eatHand = () => {
    if (G.furniture.eatHand(app.s).ok) { G.ui.pop('😋 もぐもぐ'); app.wasHungry = false; }
  };
  app.furnitureAct = () => {
    const f = G.furniture.near(app.s);
    if (!f) return;
    G.ui.pop(G.sprites.furniture[f.kind].react);
    if (f.kind === 'tv') app.tvGlow = { key: G.world.key(f.x, f.y), until: app.s.time + G.config.tvGlowTime };
  };
  app.stash = () => {
    const res = G.furniture.stash(app.s);
    if (res.ok) G.ui.pop(`🧊 +${res.n}`);
    else if (MSG[res.why]) G.ui.toast(MSG[res.why]);
  };
  app.takeOut = () => {
    const res = G.furniture.takeOut(app.s);
    if (res.ok) G.ui.pop(`+${res.n} ${G.sprites.burger.emoji}`);
    else if (MSG[res.why]) G.ui.toast(MSG[res.why]);
  };

  // ゲームセンター
  function craneBlocked(k, why) {
    if (why === 'busy') {
      const r = G.crane.playerOf(app.s, k);
      G.ui.toast(`${r ? r.name : 'だれか'}が あそんでるよ。まってね`);
    } else if (MSG[why]) G.ui.toast(MSG[why]);
  }
  app.cranePlay = () => {
    const k = G.crane.near(app.s);
    if (!k) return;
    const res = G.crane.startPlay(app.s, k);
    if (!res.ok) { craneBlocked(k, res.why); return; }
    setMode('crane');
  };
  app.craneHold = (on) => G.crane.hold(app.s, on);
  app.craneQuit = () => {
    const res = G.crane.cancel(app.s);
    if (res.ok) { G.ui.pop(`+${res.refund} ${coin()}`); setMode('walk'); }
  };
  app.craneStock = () => {
    const k = G.crane.near(app.s);
    if (!k) return;
    const res = G.crane.startStock(app.s, k);
    if (!res.ok) { craneBlocked(k, res.why); return; }
    setMode('stock');
  };
  app.stockPick = (id) => {
    const res = G.crane.stockPick(app.s, id);
    if (res.finished) { G.ui.pop(`+${res.reward} ${coin()}`); G.ui.toast('ありがとう！ きれいに ならんだね'); setMode('walk'); }
    return res;
  };
  app.stockQuit = () => { G.crane.cancelStock(app.s); setMode('walk'); };

  // ガシャポン
  const figLabel = (id) => G.gachaLogic.kindOf(id).label;
  app.gachaOpen = () => {
    const k = G.gacha.near(app.s);
    if (!k) return;
    const res = G.gacha.open(app.s, k);
    if (!res.ok) {
      if (res.why === 'busy') { const r = G.gacha.playerOf(app.s, k); G.ui.toast(`${r ? r.name : 'だれか'}が まわしてるよ。まってね`); }
      return;
    }
    setMode('gacha');
  };
  app.gachaTurn = () => {
    const res = G.gacha.turn(app.s);
    if (!res.ok && MSG[res.why]) G.ui.toast(MSG[res.why]);
  };
  // 出たものを知らせる
  function gachaResult(r) {
    if (!r) return;
    G.ui.toast(r.isNew ? `${figLabel(r.id)}が でた！` : `${figLabel(r.id)}が でた！ あげられるよ`, 3000);
    if (r.trophy) setTimeout(() => G.ui.toast(`そろった！ ${figLabel(r.trophy)}が もらえたよ！`, 3500), 1500);
  }
  app.gachaCrack = () => gachaResult(G.gacha.crack(app.s));
  app.gachaClose = () => { gachaResult(G.gacha.close(app.s)); setMode('walk'); };
  app.decorate = (k, i, id) => G.figures.setSlot(app.s, k, i, id);
  app.give = (r, id) => {
    const res = G.figures.give(app.s, r, id);
    if (!res.ok) return;
    G.ui.toast(`${r.look} ${r.name}「わあ、${figLabel(id)}！ ありがとう」`, 3000);
    G.ui.pop(`+${res.reward} ${coin()}`);
  };

  // 動きの中で起きたことを知らせる（クレーンの結果・ペットのなかよし・カプセル）
  function notify(e) {
    if (e.type === 'love') celebrate(e.pet, e.res);
    if (e.type === 'capsule') G.ui.pop(`+${e.reward} ${coin()}`);
    if (e.type !== 'crane') return;
    if (!e.caught) { G.ui.toast('あとちょっと！'); return; }
    const label = prizeLabel(e.id);
    G.ui.pop(G.sprites.furniture[e.id].emoji);
    G.ui.toast(e.isNew ? `${label}が とれた！ ${label}が おけるように なったよ！` : `${label}が とれた！ また とれた！`, 3000);
  }

  app.exportSave = () => {
    const blob = new Blob([G.save.serialize(app.s)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `kids-game-save-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  app.importSave = (text) => {
    try {
      app.s = G.save.deserialize(text);
      app.cam = { x: app.s.player.x, y: app.s.player.y };
      setMode('walk');
      G.ui.toast('よみこんだよ');
    } catch (e) { G.ui.toast('この ファイルは よめないよ'); }
  };

  function update(dt) {
    const s = app.s;
    if (app.mode === 'walk') {
      const d = G.input.dir();
      G.player.move(s.player, s.world, d.vx, d.vy, dt);
      if (s.player.hunger <= 0 && !app.wasHungry) { app.wasHungry = true; G.ui.toast('おなかが ぺこぺこ… ハンバーガーを たべよう'); }
    }
    G.state.tick(s, dt);
    if (app.mode === 'job' && !s.job.active) setMode('walk'); // カウンターが消えたなど
    if ((app.mode === 'crane' || app.mode === 'stock') && !s.cranePlay) setMode('walk'); // 遊び終わった・台が消えた
    if (app.mode === 'gacha' && !s.gachaPlay) setMode('walk'); // 台が消えた
    for (const e of G.state.drain()) notify(e);
    if (app.mode !== 'build') {
      app.cam.x += (s.player.x - app.cam.x) * Math.min(1, dt * 8);
      app.cam.y += (s.player.y - app.cam.y) * Math.min(1, dt * 8);
    }
    app.saveTimer += dt;
    if (app.saveTimer >= G.config.autosaveInterval) { app.saveTimer = 0; persist(); }
  }

  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - prev) / 1000);
    prev = now;
    update(dt);
    G.render.draw(app);
    G.ui.update();
    requestAnimationFrame(frame);
  }

  // 全画面: Android の Chrome でアドレスバーなどを消す。さわるたびに、全画面でなければ全画面にする
  // （戻るボタンで解除されても、次にさわれば戻る）。全画面にできないブラウザでは何もしない
  app.autoFullscreen = true;
  app.canFullscreen = !!document.fullscreenEnabled;
  app.isFullscreen = () => !!document.fullscreenElement;
  app.goFullscreen = () => {
    if (!app.canFullscreen || app.isFullscreen()) return;
    document.documentElement.requestFullscreen({ navigationUI: 'hide' })
      .then(() => screen.orientation?.lock?.('landscape'))
      .catch(() => {});
  };
  app.toggleFullscreen = () => {
    app.autoFullscreen = !app.isFullscreen();
    if (app.autoFullscreen) app.goFullscreen();
    else document.exitFullscreen().catch(() => {});
  };
  document.addEventListener('pointerdown', () => { if (app.autoFullscreen) app.goFullscreen(); }, true);

  G.render.resize(app);
  addEventListener('resize', () => G.render.resize(app));
  document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
  addEventListener('pagehide', persist);
  G.input.init(app);
  G.ui.init(app);
  if (loaded.status === 'recovered') G.ui.toast('セーブが よめなかったので、あたらしく はじめたよ', 4000);
  requestAnimationFrame(frame);

  // 通しテスト用
  G.debug = {
    app,
    step(sec) { for (let t = 0; t < sec; t += 0.05) update(0.05); G.render.draw(app); G.ui.update(); },
    tileToScreen: (x, y) => G.render.toScreen(app, x, y),
  };
})(window.Game = window.Game || {});
</script>
</body>
</html>
