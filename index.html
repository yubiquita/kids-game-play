      const k = 1 - Math.max(0, pet.trick.until - app.s.time) / c.trickTime; // 0 → 1
      if (pet.trick.id === 'spin') { flip = Math.floor(k * c.trickTime / c.spinFlip) % 2 === 1; lift += Math.round(Math.abs(Math.sin(k * Math.PI * 4)) * 2); }
      if (pet.trick.id === 'jump') lift += Math.round(Math.sin(k * Math.PI) * 8);
    }
    const spr = A().sprite(pet.kind, { frame: m.moving ? 1 + (m.frame - 2) : 0, flip });
    put(g, A().shadow(Math.max(6, spr.width - 4)), px, py + 8);
    put(g, spr, px, py + 7 - lift);
    const top = py + 7 - lift - spr.height;
    over.push(() => {
      let t = top - 1;
      if (near) {
        const name = A().textCanvas(pet.name, { color: A().INK, outline: A().PAPER });
        g.drawImage(name, px - (name.width >> 1), t - name.height);
        t -= name.height + 1;
        const h = G.petCare.hearts(pet.love);
        if (h) { hearts(g, h, px, t); t -= 9; }
      }
      if (pet.state === 'toy' && pet.toyKey) {
        const toy = G.pets.toyAt(app.s, pet.toyKey, pet);
        if (toy) {
          const id = toy.shelf ? S().figures[toy.id].mini : toy.id, bounce = Math.round(Math.abs(Math.sin(now * 6)) * 2);
          put(g, A().mini(id), px - 9, top + 2 - bounce);
          if (toy.shelf) put(g, A().mini('heart'), px - 9, top - 8);
        }
      }
      if (pet.hunger <= 0) bubble(g, 'meat', px + 9, top + 4);
    });
  }

  function draw(app) {
    const g = app.ctx, s = app.s, wd = s.world, art = A(), v = view(app), now = performance.now() / 1000;
    g.imageSmoothingEnabled = false;
    g.fillStyle = S().PAL.t; g.fillRect(0, 0, app.canvas.width, app.canvas.height);

    // 見えるマス（背の高いものと人の頭のために、下へ1マス多く）
    const x0 = Math.max(0, Math.floor((v.cx - v.hx) / D) - 1), x1 = Math.min(wd.w - 1, Math.ceil((v.cx + v.hx) / D) + 1);
    const y0 = Math.max(0, Math.floor((v.cy - v.hy) / D) - 1), y1 = Math.min(wd.h - 1, Math.ceil((v.cy + v.hy) / D) + 2);

    // 1. 地面
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const sx = dotX(v, x), sy = dotY(v, y);
      const c = G.world.hasFloor(wd, x, y) ? art.joined('floor', floorMask(wd, x, y)) : art.grassAt(x, y);
      g.drawImage(c, sx - 8, sy - 8);
    }

    // 2. 奥から手前へ（足もとの y の順）
    const items = [], over = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const o = G.world.objAt(wd, x, y);
      if (!o) continue;
      const sx = dotX(v, x), sy = dotY(v, y);
      if (CLERK[o.type]) {
        const working = o.type === 'counter' && s.job.active && s.job.counter === G.world.key(x, y);
        if (!working) items.push({ k: y + 0.48, f: () => put(g, art.sprite(CLERK[o.type], { frame: Math.floor(now / C().idleBob) % 2 }), sx, sy - 2) });
      }
      items.push({ k: y + 0.49, f: () => drawObject(app, g, o, x, y, sx, sy) });
      if (o.own) over.push(() => g.drawImage(art.mini('star'), sx + 1, sy - 12));
    }
    // 住人のベッドのはしに、その住人のフィギュア（新しいもの3つ）
    for (const r of s.residents) {
      if (!r.figures || !r.figures.length || r.bed.x < x0 || r.bed.x > x1 || r.bed.y < y0 || r.bed.y > y1) continue;
      const sx = dotX(v, r.bed.x), sy = dotY(v, r.bed.y);
      items.push({ k: r.bed.y + 0.495, f: () => r.figures.slice(-3).forEach((id, i) => drawFigure(g, id, sx - 4 + i * 4, sy + 8)) });
    }
    for (const key of s.capsules) {
      const { x, y } = G.world.parseKey(key);
      if (x < x0 || x > x1 || y < y0 || y > y1) continue;
      items.push({ k: y + 0.3, f: () => put(g, art.mini('capsule'), dotX(v, x), dotY(v, y) + 5) });
    }

    // 人とペット
    const nearPet = G.pets.near(s), nearRes = G.residents.near(s);
    const person = (key, look, ent, extras) => {
      const px = dotX(v, ent.x), py = dotY(v, ent.y);
      items.push({ k: ent.y + 0.5, f: () => {
        const m = moveOf(key, ent.x, ent.y, now, false), spr = art.person(look, m.dir, m.frame);
        put(g, art.shadow(10), px, py + 8);
        put(g, spr, px, py + 7);
        const top = py + 7 - spr.height;
        if (extras) over.push(() => extras(px, top));
      } });
    };
    person('me', G.looks.PLAYER, s.player, (px, top) => put(g, art.mini('playerMark'), px, top - 1));
    for (const r of s.residents) person('r' + r.id, r.look, r, (px, top) => residentExtras(app, g, r, px, top, r === nearRes));
    for (const pet of s.pets) {
      const px = dotX(v, pet.x), py = dotY(v, pet.y);
      items.push({ k: pet.y + 0.5, f: () => drawPet(app, g, pet, px, py, now, pet === nearPet, over) });
    }
    items.sort((a, b) => a.k - b.k);
    for (const it of items) it.f();

    // 3. 頭の上の表示
    for (const f of over) f();

    // 4. 建てるモードのマス目、ぷにコン
    if (app.mode === 'build') {
      const cell = art.gridCell();
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) g.drawImage(cell, dotX(v, x) - 8, dotY(v, y) - 8);
    }
    const j = G.input.joy;
    if (j && app.mode === 'walk') {
      const R = Math.round(G.input.RADIUS / app.cssK);
      let dx = j.cx - j.ox, dy = j.cy - j.oy; const l = Math.hypot(dx, dy);
      if (l > G.input.RADIUS) { dx = (dx / l) * G.input.RADIUS; dy = (dy / l) * G.input.RADIUS; }
      const ox = Math.round(j.ox / app.cssK), oy = Math.round(j.oy / app.cssK);
      const ring = art.ring(R);
      g.drawImage(ring, ox - (ring.width >> 1), oy - (ring.height >> 1));
      const knob = art.sprite('joyKnob');
      g.drawImage(knob, Math.round(ox + dx / app.cssK) - (knob.width >> 1), Math.round(oy + dy / app.cssK) - (knob.height >> 1));
    }
  }

  G.render = { resize, draw, toScreen, screenToTile, drawFigure, D };
})(window.Game = window.Game || {});
</script>
<script>
// 画面の上に重ねる表示（DOM）: 上の表示・ボタン・つくるパレット・アルバイト画面・メニュー・ペットやさん・かぐやさん
// ・クレーンゲームの画面・ならべるの画面・ガシャの画面・かざる・あげる・ずかん
// 絵と文字は、すべて art.img / art.text（ドット絵）で出す。DOM に普通の文字は置かない（ドット絵の設計書 4節）
(function (G) {
  const S = () => G.sprites, A = () => G.art;
  let root, els = {}, last = {}, app, tab = 'parts'; // tab: パレットの列 'parts' | 'furniture' | 'gacha'
  const figLabel = (id) => G.gachaLogic.kindOf(id).label;

  // 絵入りの文字（'{coin} 120' のように書くと、ミニ絵が入る）
  const T = (str, opt) => A().text(str, opt);
  const mini = (id, scale = 1, opt = {}) => A().img(id, Object.assign({ mini: true, scale }, opt));
  const sprite = (id, scale = 1) => A().img(id, { scale });
  const fig = (id, scale = 2) => A().figureImg(id, { scale });

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'class') e.className = v;
      else e.setAttribute(k, v);
    }
    for (const c of kids) e.append(typeof c === 'string' ? T(c) : c);
    return e;
  }
  // 中身を入れかえる。文字列は絵入りの文字に。読み上げ用に aria-label も付ける
  function fill(el, ...kids) {
    el.replaceChildren(...kids.map((c) => (typeof c === 'string' ? T(c) : c)));
    const words = kids.filter((c) => typeof c === 'string');
    if (words.length) el.setAttribute('aria-label', words.map(A().plain).join(' '));
    else el.removeAttribute('aria-label');
  }
  // pointerdown で押す（タッチで反応を速く・ぷにコンと取り合わない）。label は文字列か、絵（要素）か、その配列
  function btn(label, fn, attrs = {}) {
    const b = h('button', attrs);
    fill(b, ...[].concat(label));
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); if (!b.disabled) fn(); });
    return b;
  }

  // つくるパレットの部品: アイコン（ミニ絵の2倍）と名前。名前はパレットの上の行に出す
  const TOOLS = [
    { id: 'floor', icon: 'floor', label: 'ゆか' },
    { id: 'wall', icon: 'wall', label: 'かべ' },
    { id: 'door', icon: 'door', label: 'ドア' },
    { id: 'bed', icon: 'bed', label: 'ベッド' },
    { id: 'counter', icon: 'burger', label: 'カウンター' },
    { id: 'petCounter', icon: 'paw', label: 'ペットやさん' },
    { id: 'furnitureCounter', icon: 'sofa', label: 'かぐやさん' },
  ];
  const ERASE = { id: 'erase', icon: 'erase', label: 'けす' };
  let toolNames = {}; // 部品の ID → 名前の行の文字

  function init(a) {
    app = a;
    A().setColors();
    root = document.getElementById('ui');
    els.money = h('span', { class: 'pill', 'data-t': 'money' });
    els.bar = h('div', { class: 'bar' }, h('i'));
    els.hunger = h('span', { class: 'pill hunger' }, 'おなか', els.bar);
    els.food = h('span', { class: 'pill', 'data-t': 'food' });
    els.hand = h('span', { class: 'pill', 'data-t': 'hand' });
    els.build = btn('', () => app.toggleBuild(), { 'data-t': 'build' });
    els.menu = btn(mini('menu', 2), () => openMenu(), { 'data-t': 'menu', 'aria-label': 'メニュー' });
    root.append(h('div', { class: 'hud' }, els.money, els.food, els.hand, els.hunger, h('span', { class: 'spacer' }), els.build, els.menu));

    els.actions = h('div', { class: 'actions' });
    els.talk = btn('{chat} はなす', () => app.talk(), { 'data-t': 'talk' });
    els.buy = btn('', () => app.buy(), { 'data-t': 'buy' });
    els.work = btn('{clerkBurger} アルバイト', () => app.startJob(), { 'data-t': 'work' });
    els.petShop = btn('{paw} かう', () => openShelf(), { 'data-t': 'petshop' });
    els.pat = btn('{hand} なでる', () => app.pat(), { 'data-t': 'pat' });
    els.feed = btn('{food} えさ', () => app.feed(), { 'data-t': 'feed' });
    els.follow = btn('', () => app.toggleFollow(), { 'data-t': 'follow' });
    els.toGo = btn('', () => app.toGo(), { 'data-t': 'togo' });
    els.eat = btn('{burger} たべる', () => app.eatHand(), { 'data-t': 'eat' });
    els.furnShop = btn('{sofa} かう', () => openFurnitureShelf(), { 'data-t': 'furnshop' });
    els.furnAct = btn('', () => app.furnitureAct(), { 'data-t': 'furnact' });
    els.stash = btn('{fridge} しまう', () => app.stash(), { 'data-t': 'stash' });
    els.takeOut = btn('', () => app.takeOut(), { 'data-t': 'takeout' });
    els.cranePlay = btn('', () => app.cranePlay(), { 'data-t': 'craneplay' });
    els.craneStock = btn('{bigBear} ならべる', () => app.craneStock(), { 'data-t': 'cranestock' });
    els.giveFig = btn('{gift} あげる', () => openGive(), { 'data-t': 'give-fig' });
    els.gachaSpin = btn('{capsule} まわす', () => app.gachaOpen(), { 'data-t': 'gachaspin' });
    els.decorate = btn('{frame} かざる', () => openDecorate(), { 'data-t': 'decorate' });
    els.actions.append(els.talk, els.giveFig, els.buy, els.toGo, els.work, els.eat, els.petShop, els.pat, els.feed, els.follow,
      els.furnShop, els.furnAct, els.stash, els.takeOut, els.cranePlay, els.craneStock, els.gachaSpin, els.decorate);
    root.append(els.actions);

    els.toolName = h('div', { class: 'pill toolname', 'data-t': 'toolname' });
    els.palette = h('div', { class: 'palette' });
    els.paletteBox = h('div', { class: 'palettebox' }, els.toolName, els.palette);
    root.append(els.paletteBox);
    buildPalette();

    buildJob();
    buildCrane();
    buildStock();
    buildGacha();
    els.toast = h('div', { class: 'toast panel', style: 'display:none' });
    root.append(els.toast);
    root.append(h('div', { class: 'rotate' },
      h('div', { class: 'rotpics' }, mini('phone', 4), mini('arrow', 3), mini('phoneSide', 4)),
      T('スマホを よこに してね', { color: A().PAPER })));
  }

  const toolBtn = (id, icon, label, extra = '') => {
    toolNames[id] = label + extra;
    return btn(icon, () => { app.tool = id; }, { 'data-tool': id, 'aria-label': label });
  };
  const costText = (n) => `　{coin} ${n}`;

  // パレットを今の列で作り直す。家具の列は、買った家具だけ
  function buildPalette() {
    els.palette.replaceChildren();
    toolNames = {};
    if (tab === 'parts') {
      for (const t of TOOLS) els.palette.append(toolBtn(t.id, mini(t.icon, 2), t.label));
      // クレーン台は建てるのにお金がかかる（足りないときは薄く）
      els.craneTool = toolBtn('crane', mini('crane', 2), 'クレーン', costText(G.config.craneCost));
      els.palette.append(els.craneTool);
      last.craneAfford = undefined;
      els.palette.append(btn(mini('chair', 2), () => openFurnitureTab(), { 'data-t': 'furntab', 'aria-label': 'かぐ' }));
      els.palette.append(btn(mini('capsule', 2), () => { tab = 'gacha'; buildPalette(); }, { 'data-t': 'gachatab', 'aria-label': 'ガシャ' }));
    } else if (tab === 'gacha') {
      els.palette.append(btn(mini('back', 2), () => { tab = 'parts'; buildPalette(); }, { 'data-t': 'partstab', 'aria-label': 'もどる' }));
      // ガシャ台は建てるのにお金がかかる（足りないときは薄く）
      els.gachaTools = G.config.gachaSeries.map((g) => {
        const b = toolBtn(g.machine, mini(g.machine, 2), `ガシャ（${g.label}）`, costText(G.config.gachaCost));
        els.palette.append(b);
        return b;
      });
      last.gachaAfford = undefined;
      els.palette.append(toolBtn('figureShelf', mini('frame', 2), 'かざりだな'));
    } else {
      els.palette.append(btn(mini('back', 2), () => { tab = 'parts'; buildPalette(); }, { 'data-t': 'partstab', 'aria-label': 'もどる' }));
      for (const k of G.config.furnitureKinds)
        if (G.furniture.isUnlocked(app.s, k.id)) els.palette.append(toolBtn(k.id, mini(k.id, 2), k.label));
    }
    els.palette.append(toolBtn(ERASE.id, mini(ERASE.icon, 2), ERASE.label));
    last.tool = undefined; // 選んでいる部品の印を付け直す
  }

  function openFurnitureTab() {
    if (!app.s.unlocked.length) { toast('かぐやさんで かうと おけるよ'); return; }
    tab = 'furniture';
    buildPalette();
  }

  // ハンバーガーの段: 下から積む（0 が下のパン、いちばん上のパンは上のパン）
  const LAYER = { patty: 'layerPatty', cheese: 'layerCheese', lettuce: 'layerLettuce' };
  function stackImgs(list) {
    return list.map((id, i) => sprite(id === 'bun' ? (i === 0 ? 'layerBunBottom' : 'layerBunTop') : LAYER[id], 2));
  }

  function buildJob() {
    const J = S().ingredients;
    els.order = h('div', { class: 'stack apart', 'data-t': 'order' }); // 注文は具材ごとにすき間を空けて、数えやすく
    els.customer = h('div', { class: 'customer' });
    els.mine = h('div', { class: 'stack', 'data-t': 'mine' });
    els.wait = h('div', { class: 'wait' });
    els.give = btn('{hand} わたす', () => app.deliver(), { class: 'give', 'data-t': 'give' });
    const controls = h('div', { class: 'controls' });
    for (const id of G.burgerJob.FILLINGS.concat(['bun']).reverse())
      controls.append(btn(mini(id, 2), () => app.addLayer(id), { 'data-ing': id, 'aria-label': J[id].label }));
    controls.append(btn('{back} 1つ とる', () => app.removeLayer(), { 'data-t': 'undo' }), els.give,
      btn('おわる', () => app.endJob(), { class: 'end', 'data-t': 'endjob' }));
    els.job = h('div', { class: 'job panel' },
      h('div', { class: 'col' }, h('div', { class: 'title' }, 'ちゅうもん'), els.wait, h('div', { class: 'orderrow' }, els.customer, els.order)),
      h('div', { class: 'col' }, h('div', { class: 'title' }, 'つくってる ハンバーガー'), els.mine),
      controls);
    root.append(els.job);
  }

  // クレーンの画面: 6列（左はしが取り出し口、そのあと場所0〜4）。アームは armX から位置を決める。つめと景品は2倍
  function buildCrane() {
    els.cMeter = h('div', { class: 'meter pill', 'data-t': 'cranemeter' });
    els.cSlots = [];
    const slots = h('div', { class: 'cslots' }, h('div', { class: 'chute' }, mini('arrow', 2, { flip: false })));
    for (let i = 0; i < G.config.craneSlots; i++) { const c = h('div', { class: 'cslot', 'data-slot': i }); els.cSlots.push(c); slots.append(c); }
    els.cRope = h('div', { class: 'rope' });
    els.cClaw = h('div', { class: 'claw' });
    els.cArm = h('div', { class: 'arm' }, els.cRope, els.cClaw);
    els.cMsg = h('div', { class: 'cmsg' });
    const field = h('div', { class: 'cfield' }, els.cArm, slots, els.cMsg);
    els.cGo = h('button', { class: 'go', 'data-t': 'cranego', 'aria-label': 'すすむ' }, mini('arrow', 2));
    const up = () => app.craneHold(false);
    els.cGo.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      if (els.cGo.disabled) return;
      try { els.cGo.setPointerCapture(e.pointerId); } catch (_) { /* 取れなくても動く */ }
      app.craneHold(true);
    });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) els.cGo.addEventListener(ev, up);
    els.cQuit = btn('やめる', () => app.craneQuit(), { class: 'end', 'data-t': 'cranequit' });
    els.crane = h('div', { class: 'crane panel', style: 'display:none' },
      h('div', { class: 'ctop' }, h('div', { class: 'title' }, T('{crane} クレーンゲーム', { scale: 2 })), els.cMeter),
      field,
      h('div', { class: 'controls' }, els.cGo, els.cQuit));
    root.append(els.crane);
  }

  function updateCrane(s) {
    const cp = s.cranePlay, rec = s.cranes[cp.key], c = G.config;
    if (!rec) return;
    const caught = cp.phase === 'result' && cp.result && cp.result.caught;
    rec.slots.forEach((id, i) => set('cslot' + i, id || '', (v) => { els.cSlots[i].replaceChildren(...(v ? [sprite(v, 2)] : [])); }));
    // アーム: 結果で取れたときは取り出し口へ戻る
    let x = cp.armX, down = 0;
    if (cp.phase === 'dropping') { const k = cp.t / c.craneDropTime; down = k < 0.5 ? k * 2 : (1 - k) * 2; }
    if (caught) x = cp.armX + (G.craneGame.ARM_START - cp.armX) * Math.min(1, cp.t / (c.craneResultTime * 0.6));
    const cols = c.craneSlots + 1;
    els.cArm.style.left = `${(x + 1.5) / cols * 100}%`;
    els.cRope.style.height = `${8 + down * 55}%`;
    set('claw', caught ? cp.result.id : '', (v) => { els.cClaw.replaceChildren(sprite('claw', 2), ...(v ? [sprite(v, 2)] : [])); });
    // あとちょっとメーター: アームにいちばん近い景品の「かならず取れる回数」まで
    const ni = G.craneGame.nearestSlot(rec.slots, cp.armX);
    const need = ni >= 0 ? G.craneGame.triesOf(rec.slots[ni]) - 1 : 0;
    set('cmeter', `${rec.meter},${need}`, () => {
      const n = Math.min(rec.meter, need);
      if (!need) fill(els.cMeter);
      else if (rec.meter >= need) fill(els.cMeter, 'つぎは かならず とれる！');
      else { const dots = '{dotOn}'.repeat(n) + '{dotOff}'.repeat(need - n); fill(els.cMeter, `あとちょっと ${dots}`); }
    });
    let msg = '';
    if (cp.phase === 'ready') msg = '{arrow} を おしてる あいだ うごくよ';
    else if (cp.phase === 'result') msg = cp.result.caught ? 'とれた！' : 'あとちょっと！';
    set('cmsg', msg, (v) => { if (v) fill(els.cMsg, T(v, { scale: v.length < 8 ? 2 : 1 })); else fill(els.cMsg); });
    set('cgo', cp.phase === 'ready' || cp.phase === 'moving', (v) => { els.cGo.disabled = !v; });
    set('cquit', cp.phase === 'ready', (v) => { els.cQuit.disabled = !v; });
  }

  // ならべるの画面: 見本（うすい絵）の上に、光っている場所から左から順に置く
  function buildStock() {
    els.sCells = [];
    const row = h('div', { class: 'srow' });
    for (let i = 0; i < G.config.craneSlots; i++) { const c = h('div', { class: 'scell', 'data-cell': i }); els.sCells.push(c); row.append(c); }
    const pick = h('div', { class: 'spick' });
    for (const id of G.craneGame.prizeIds()) {
      const b = btn(sprite(id), () => {
        if (app.stockPick(id).ok) return;
        b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      }, { 'data-prize': id, 'aria-label': G.furniture.kindOf(id).label });
      pick.append(b);
    }
    els.stock = h('div', { class: 'stock panel', style: 'display:none' },
      h('div', { class: 'title' }, '{bigBear} みほんと おなじに ならべてね'), row, pick,
      h('div', { class: 'controls' }, btn('やめる', () => app.stockQuit(), { class: 'end', 'data-t': 'stockquit' })));
    root.append(els.stock);
  }

  function updateStock(s) {
    const cp = s.cranePlay;
    set('stock', `${cp.key},${cp.done},${cp.target.join()}`, () => {
      const placed = new Set(cp.todo.slice(0, cp.done)), cur = cp.todo[cp.done];
      cp.target.forEach((id, i) => {
        const cell = els.sCells[i], todo = cp.todo.indexOf(i) >= 0;
        cell.replaceChildren(...(id ? [sprite(id, 2)] : []));
        cell.className = 'scell' + (todo && !placed.has(i) ? ' mihon' : '') + (i === cur ? ' now' : '');
      });
    });
  }

  // ガシャの画面: 台の絵 → ぐるっ → カプセル（タップで開く）→ 出たもの（2倍）
  function buildGacha() {
    els.gTitle = h('div', { class: 'title' });
    els.gCount = h('div', { class: 'meter pill', 'data-t': 'gachacount' });
    els.gMachine = h('div', { class: 'gmachine' });
    els.gCapsule = btn(mini('capsule', 4), () => app.gachaCrack(), { class: 'gcap', 'data-t': 'gachacap', 'aria-label': 'カプセル' });
    els.gResult = h('div', { class: 'gresult panel', 'data-t': 'gacharesult' });
    els.gMsg = h('div', { class: 'gmsg' });
    const field = h('div', { class: 'gfield' }, els.gMachine, h('div', { class: 'gout' }, els.gMsg, els.gCapsule, els.gResult));
    els.gTurn = btn('', () => app.gachaTurn(), { class: 'go', 'data-t': 'gachaturn' });
    els.gClose = btn('とじる', () => app.gachaClose(), { class: 'end', 'data-t': 'gachaclose' });
    els.gacha = h('div', { class: 'gacha panel', style: 'display:none' },
      h('div', { class: 'ctop' }, els.gTitle, els.gCount), field, h('div', { class: 'controls' }, els.gTurn, els.gClose));
    root.append(els.gacha);
  }

  function updateGacha(s) {
    const gp = s.gachaPlay, series = G.gacha.seriesAt(s, gp.key);
    if (!series) return;
    const g = G.gachaLogic.seriesInfo(series);
    set('gtitle', series, () => {
      fill(els.gTitle, T(`{${g.machine}} ${g.label}`, { scale: 2 }));
      els.gMachine.replaceChildren(sprite(g.machine, 3));
    });
    const figs = G.gachaLogic.seriesFigures(series), have = figs.filter((id) => G.figures.count(s, id)).length;
    set('gcount', `${have}/${figs.length}`, (v) => {
      const cup = G.figures.count(s, g.trophy) ? ' {trophy}' : '';
      fill(els.gCount, `あつめた ${v}${cup}`);
    });
    set('gphase', gp.phase + (gp.result ? gp.result.id : ''), () => {
      els.gMachine.classList.toggle('turning', gp.phase === 'turning');
      show(els.gCapsule, gp.phase === 'capsule');
      show(els.gResult, gp.phase === 'open');
      if (gp.phase === 'open') {
        const r = gp.result;
        fill(els.gResult, fig(r.id, 4), T(figLabel(r.id), { scale: 2 }),
          r.isNew ? h('em', {}, T('NEW', { color: A().PAPER })) : T('あげられるよ'));
      }
      const msg = { ready: 'ぐるっ と まわしてね', turning: 'がちゃ がちゃ…', capsule: 'カプセルを タップ！', open: '' }[gp.phase];
      fill(els.gMsg, ...(msg ? [msg] : []));
      fill(els.gTurn, `${gp.phase === 'open' ? 'もういっかい' : 'ぐるっ'}　{coin} ${G.config.gachaPlayPrice}`);
      show(els.gTurn, gp.phase === 'ready' || gp.phase === 'open');
    });
    set('gafford', s.player.money >= G.config.gachaPlayPrice, (v) => els.gTurn.classList.toggle('dim', !v));
  }

  // フィギュアのボタン（台座つき）
  function figBtn(id, extra, fn, attrs = {}) {
    return btn([fig(id)].concat(extra ? [extra] : []), fn, Object.assign({ 'data-fig': id, 'aria-label': figLabel(id) }, attrs));
  }

  // かざる画面: 上にたなの3つの場所、下に持っているフィギュア（シリーズごと）
  function openDecorate() {
    const s = app.s, k = G.figures.nearShelf(s);
    if (!k) return;
    const sh = G.figures.shelfAt(s, k);
    let cur = Math.max(0, sh.indexOf(null));
    const row = h('div', { class: 'srow' });
    const cells = sh.map((_, i) => { const c = btn([], () => { cur = i; refresh(); }, { class: 'scell', 'data-cell': i }); row.append(c); return c; });
    const list = h('div', { class: 'figlist' });
    let any = false;
    for (const g of G.config.gachaSeries) {
      const ids = G.config.figureKinds.filter((f) => f.series === g.id && G.figures.count(s, f.id)).map((f) => f.id);
      if (!ids.length) continue;
      any = true;
      const line = h('div', { class: 'figrow' });
      for (const id of ids) line.append(figBtn(id, '', () => {
        app.decorate(k, cur, id);
        const next = sh.indexOf(null, cur + 1);
        cur = next >= 0 ? next : (sh.indexOf(null) >= 0 ? sh.indexOf(null) : cur);
        refresh();
      }));
      list.append(line);
    }
    if (!any) list.append(h('div', { class: 'note' }, 'ガシャを まわすと かざれるよ'));
    const refresh = () => sh.forEach((id, i) => {
      cells[i].replaceChildren(...(id ? [fig(id)] : []));
      cells[i].classList.toggle('now', i === cur);
    });
    const { close } = modal(h('div', { class: 'title' }, '{frame} かざりだな'), row, list,
      h('div', { class: 'names' }, btn('はずす', () => { app.decorate(k, cur, null); refresh(); }, { 'data-t': 'unset' }),
        btn('とじる', () => close(), { 'data-t': 'closedecorate' })));
    refresh();
  }

  // あげる画面: 2体目からのフィギュア
  function openGive() {
    const r = G.residents.near(app.s);
    if (!r) return;
    const list = h('div', { class: 'figrow wrap' });
    for (const id of G.figures.giftable(app.s))
      list.append(figBtn(id, `×${G.figures.count(app.s, id) - 1}`, () => { close(); app.give(r, id); }));
    const { close } = modal(h('div', { class: 'title who' }, A().personImg(r.look, { scale: 2 }), `${r.name}に なにを あげる？`), list,
      btn('やめる', () => close(), { 'data-t': 'closegive' }));
  }

  // ずかん: シリーズごとに1行。持っていないものは「？」
  function openZukan() {
    const s = app.s, rows = [];
    for (const g of G.config.gachaSeries) {
      const figs = G.gachaLogic.seriesFigures(g.id), have = figs.filter((id) => G.figures.count(s, id)).length;
      const line = h('div', { class: 'figrow' });
      for (const id of figs) {
        const n = G.figures.count(s, id);
        line.append(h('div', Object.assign({ class: 'zcell' + (n ? '' : ' unknown'), 'data-zukan': id }, n ? { 'aria-label': figLabel(id) } : {}),
          n ? fig(id) : T('？', { scale: 2 }),
          ...(n >= 2 ? [h('b', { class: 'badge' }, T(`×${n}`, { color: A().PAPER }))] : [])));
      }
      const trophy = mini('trophy', 1);
      if (!G.figures.count(s, g.trophy)) trophy.classList.add('dim');
      rows.push(h('div', { class: 'zhead' }, `{${g.machine}} ${g.label}　${have}/${figs.length}`, trophy), line);
    }
    const { close } = modal(h('div', { class: 'title' }, '{book} ずかん'), h('div', { class: 'zukan' }, ...rows),
      btn('とじる', () => close(), { 'data-t': 'closezukan' }));
  }

  // 変わったときだけ DOM を書き換える
  function set(name, value, fn) { if (last[name] !== value) { last[name] = value; fn(value); } }
  const show = (el, on) => { el.style.display = on ? '' : 'none'; };

  function update() {
    const s = app.s, p = s.player, mode = app.mode;
    set('money', p.money, (v) => fill(els.money, `{coin} ${v}`));
    set('food', p.food, (v) => { fill(els.food, `{food} ${v}`); els.feed.disabled = v <= 0; });
    set('hand', p.hand, (v) => {
      fill(els.hand, `{burger} ${v}`);
      els.toGo.disabled = v >= G.config.handMax;
      els.stash.disabled = v <= 0;
    });
    set('fridge', `${s.fridge},${p.hand}`, () => {
      fill(els.takeOut, `{fridge} とりだす（のこり ${s.fridge}）`);
      els.takeOut.disabled = s.fridge <= 0 || p.hand >= G.config.handMax;
    });
    set('unlocked', s.unlocked.join(), () => { if (tab === 'furniture') buildPalette(); });
    set('hunger', Math.ceil(p.hunger), (v) => {
      els.bar.firstChild.style.width = (v / G.config.hungerMax * 100) + '%';
      els.bar.classList.toggle('empty', v <= 0);
    });
    set('mode', mode, (m) => {
      fill(els.build, m === 'build' ? '{check} もどる' : '{hammer} つくる');
      show(els.build, m === 'walk' || m === 'build');
      show(els.paletteBox, m === 'build');
      show(els.job, m === 'job');
      show(els.crane, m === 'crane');
      show(els.stock, m === 'stock');
      show(els.gacha, m === 'gacha');
      show(els.actions, m === 'walk');
    });
    if (els.craneTool) set('craneAfford', p.money >= G.config.craneCost, (v) => els.craneTool.classList.toggle('dim', !v));
    if (tab === 'gacha' && els.gachaTools) set('gachaAfford', p.money >= G.config.gachaCost, (v) => els.gachaTools.forEach((b) => b.classList.toggle('dim', !v)));
    set('tool', app.tool, (t) => {
      for (const b of els.palette.children) b.classList.toggle('on', b.dataset.tool === t);
    });
    set('toolName', toolNames[app.tool] || '', (v) => { fill(els.toolName, ...(v ? [v] : [])); show(els.toolName, !!v); });

    if (mode === 'walk') {
      const near = G.residents.near(s), counter = G.shop.nearCounter(s);
      set('near', !!near, (v) => show(els.talk, v));
      set('counter', !!counter, (v) => { show(els.buy, v); show(els.work, v); show(els.toGo, v); });
      set('price', G.config.burgerPrice, (v) => {
        fill(els.buy, `{burger} かう　{coin} ${v}`);
        fill(els.toGo, `{toGo} もちかえる　{coin} ${v}`);
      });
      set('eat', p.hand > 0, (v) => show(els.eat, v));
      set('furnShop', !!G.furnitureShop.nearShop(s), (v) => show(els.furnShop, v));
      const f = G.furniture.near(s), kind = f && G.furniture.kindOf(f.kind);
      set('furnAct', kind && kind.action ? f.kind : '', (v) => {
        show(els.furnAct, !!v);
        if (v) fill(els.furnAct, `{${S().furniture[v].reactMini}} ${kind.action}`);
      });
      set('nearFridge', !!f && f.kind === 'fridge', (v) => { show(els.stash, v); show(els.takeOut, v); });
      const pet = G.pets.near(s);
      set('petShop', !!G.petShop.nearPetShop(s), (v) => show(els.petShop, v));
      set('pet', !!pet, (v) => { show(els.pat, v); show(els.feed, v); show(els.follow, v); });
      set('follow', pet ? pet.follow : null, (v) => fill(els.follow, v ? '{home} おうちにいて' : '{paw} ついてきて'));
      const ck = G.crane.near(s);
      set('craneNear', !!ck, (v) => show(els.cranePlay, v));
      set('cranePrice', G.config.cranePlayPrice, (v) => fill(els.cranePlay, `{crane} あそぶ　{coin} ${v}`));
      set('cranePlayDim', ck ? !!G.crane.playBlock(s, ck) : false, (v) => els.cranePlay.classList.toggle('dim', v));
      const sb = ck ? G.crane.stockBlock(s, ck) : 'full';
      set('craneStock', sb !== 'full', (v) => show(els.craneStock, v));
      set('craneStockDim', sb === 'busy', (v) => els.craneStock.classList.toggle('dim', v));
      set('giveFig', !!near && G.figures.giftable(s).length > 0, (v) => show(els.giveFig, v));
      const gk = G.gacha.near(s);
      set('gachaNear', !!gk, (v) => show(els.gachaSpin, v));
      set('gachaDim', gk ? !!G.gacha.openBlock(s, gk) : false, (v) => els.gachaSpin.classList.toggle('dim', v));
      set('shelfNear', !!G.figures.nearShelf(s), (v) => show(els.decorate, v));
    }

    if (mode === 'crane' && s.cranePlay && s.cranePlay.mode === 'play') updateCrane(s);
    if (mode === 'stock' && s.cranePlay && s.cranePlay.mode === 'stock') updateStock(s);
    if (mode === 'gacha' && s.gachaPlay) updateGacha(s);

    if (mode === 'job') {
      const j = s.job, cust = s.residents.find((r) => r.id === j.customerId);
      const waitMsg = j.order ? '' : (s.residents.length ? 'おきゃくさんを まってるよ…' : 'ベッドを おくと\nおきゃくさんが くるよ');
      set('wait', waitMsg, (v) => { fill(els.wait, ...(v ? [v] : [])); show(els.wait, !!v); });
      set('order', j.order ? j.order.join() : '', () => { els.order.replaceChildren(...(j.order ? stackImgs(j.order) : [])); });
      set('cust', cust ? cust.id + cust.name : '', () => fill(els.customer, ...(cust ? [A().personImg(cust.look, { scale: 2 }), cust.name] : [])));
      set('mine', j.stack.join(), () => { els.mine.replaceChildren(...stackImgs(j.stack)); });
      set('give', G.burgerJob.canDeliver(j.stack, j.order), (v) => { els.give.disabled = !v; });
    }

    if (app.toastUntil && performance.now() > app.toastUntil) { app.toastUntil = 0; show(els.toast, false); }
  }

  function toast(text, ms = 2500) {
    fill(els.toast, T(text, { wrap: 26 }));
    els.toast.setAttribute('aria-label', A().plain(text));
    show(els.toast, true);
    app.toastUntil = performance.now() + ms;
  }

  // 浮かんで消える表示（2倍、白い字に濃い縁）
  function pop(text) {
    const e = h('div', { class: 'pop' }, T(text, { color: A().PAPER, outline: A().INK, scale: 2 }));
    root.append(e);
    setTimeout(() => e.remove(), 1000);
  }

  // 画面の上に重ねる箱。戻り値の close で閉じる
  function modal(...kids) {
    const box = h('div', { class: 'box panel' }, ...kids);
    const m = h('div', { class: 'modal' }, box);
    root.append(m);
    return { box, close: () => m.remove() };
  }

  function openMenu() {
    const file = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
    const fs = app.canFullscreen
      ? [btn(app.isFullscreen() ? '{full} ぜんがめんを やめる' : '{full} ぜんがめんに する', () => { close(); app.toggleFullscreen(); }, { 'data-t': 'fullscreen' })]
      : [];
    const { close } = modal(...fs,
      btn('{book} ずかん', () => { close(); openZukan(); }, { 'data-t': 'zukan' }),
      btn('{save} セーブを ファイルに かきだす', () => { close(); app.exportSave(); }),
      btn('{load} ファイルから よみこむ', () => file.click()),
      btn('とじる', () => close()), file);
    file.addEventListener('change', async () => {
      const f = file.files[0]; if (!f) return;
      close();
      app.importSave(await f.text());
    });
  }

  // 棚の1つ: 絵（下そろえ）・名前・値段
  const shelfItem = (pic, label, price, tall) => [h('span', { class: 'pic' + (tall ? ' tall' : '') }, pic), label, price];

  // ペットやさんの棚: ペット8種類とえさ。お金が足りないものは押せない
  function openShelf() {
    const c = G.config;
    const money = h('div', { class: 'title' });
    const grid = h('div', { class: 'shelf' });
    const items = [];
    for (const k of c.petKinds) {
      const b = btn(shelfItem(sprite(k.id), k.label, `{coin} ${k.price}`), () => { close(); openNames(k.id); }, { 'data-pet': k.id });
      items.push([b, k.price]);
      grid.append(b);
    }
    const food = btn(shelfItem(mini('food', 2), 'えさ', `{coin} ${c.foodPrice}`), () => { app.buyFood(); refresh(); }, { 'data-t': 'buyfood' });
    items.push([food, c.foodPrice]);
    grid.append(food);
    const refresh = () => {
      const p = app.s.player;
      fill(money, `ペットやさん　{coin} ${p.money}　{food} ${p.food}`);
      for (const [b, price] of items) b.disabled = p.money < price;
    };
    const { close } = modal(h('div', { class: 'shead' }, money, btn('とじる', () => close(), { 'data-t': 'closeshelf' })), grid);
    refresh();
  }

  // かぐやさんの棚: 家具10種類。買ったものは「かった」、お金が足りないものは押せない
  function openFurnitureShelf() {
    const money = h('div', { class: 'title' });
    const grid = h('div', { class: 'shelf' });
    const items = [];
    for (const k of G.config.furnitureKinds.filter((k) => !k.prize)) { // 景品はクレーンでしか取れない
      const b = btn([], () => { app.buyFurniture(k.id); refresh(); }, { 'data-furn': k.id });
      items.push([b, k]);
      grid.append(b);
    }
    const refresh = () => {
      const s = app.s;
      fill(money, `かぐやさん　{coin} ${s.player.money}`);
      for (const [b, k] of items) {
        const owned = G.furniture.isUnlocked(s, k.id);
        fill(b, ...shelfItem(sprite(k.id), k.label, owned ? '{check} かった' : `{coin} ${k.price}`, true));
        b.disabled = owned || s.player.money < k.price;
      }
    };
    const { close } = modal(h('div', { class: 'shead' }, money, btn('とじる', () => close(), { 'data-t': 'closefurnshelf' })), grid);
    refresh();
  }

  // 名前を候補から選ぶ。選んだら買う。やめたら買わない
  function openNames(kind) {
    const row = h('div', { class: 'names' });
    G.petCare.nameChoices(kind, G.rng).forEach((name, i) =>
      row.append(btn(name, () => { close(); app.buyPet(kind, name); }, { 'data-name': i })));
    const { close } = modal(h('div', { class: 'title' }, `{${kind}} なまえを えらんでね`), row,
      btn('やめる', () => close(), { 'data-t': 'cancelname' }));
  }

  G.ui = { init, update, toast, pop };
})(window.Game = window.Game || {});
</script>
<script>
// 全体の流れ: 読み込み → ループ（動かす・描く・自動セーブ）、モード切り替え
(function (G) {
  const MSG = {
    occupied: 'ひとが いるところには おけないよ',
    ownBed: 'じぶんの ベッドは けせないよ',
    money: 'おかねが たりないよ。アルバイトしよう！',
    full: 'おうちが いっぱいだよ',
    food: 'えさを ペットやさんで かってね',
    owned: 'もう もってるよ',
    hand: 'もう もてないよ',
    fridgeFull: 'れいぞうこが いっぱいだよ',
    empty: 'からっぽだよ。ならべて あげよう',
  };
  const coin = () => '{coin}';
  const prizeLabel = (id) => G.furniture.kindOf(id).label;

  const loaded = G.save.load(localStorage);
  const app = {
    s: loaded.state, mode: 'walk', tool: 'floor', cam: { x: 0, y: 0 },
    canvas: document.getElementById('screen'), toastUntil: 0, saveTimer: 0, wasHungry: false,
    tvGlow: null, // テレビが光っている { key, until }（セーブしない）
  };
  app.ctx = app.canvas.getContext('2d');
  app.cam = { x: app.s.player.x, y: app.s.player.y };

  const persist = () => G.save.save(localStorage, app.s);

  function setMode(m) {
    app.mode = m;
    G.input.reset();
    persist();
  }

  app.toggleBuild = () => {
    if (app.mode === 'build') { setMode('walk'); return; }
    setMode('build');
  };

  app.onTap = (t) => {
    if (app.mode !== 'build') return;
    const s = app.s;
    const gacha = G.gachaLogic.isMachine(app.tool);
    const res = app.tool === 'erase' ? G.world.erase(s.world, t.x, t.y)
      : app.tool === 'crane' ? G.crane.build(s, t.x, t.y)
        : gacha ? G.gacha.build(s, t.x, t.y, app.tool)
          : G.world.place(s.world, t.x, t.y, app.tool, G.state.occupied(s));
    if (!res.ok && MSG[res.why]) G.ui.toast(MSG[res.why]);
    if (app.tool === 'crane' && res.ok && !res.same) G.ui.pop(`-${G.config.craneCost} ${coin()}`);
    if (gacha && res.ok && !res.same) G.ui.pop(`-${G.config.gachaCost} ${coin()}`);
    // 台を消した・上書きしたら、建てたお金がもどる
    const refund = G.crane.reconcile(s) + G.gacha.reconcile(s) + (res.refund || 0);
    if (refund) setTimeout(() => G.ui.pop(`+${refund} ${coin()}`), res.ok && !res.same && (gacha || app.tool === 'crane') ? 500 : 0);
  };

  app.talk = () => {
    const r = G.residents.near(app.s);
    if (!r) return;
    const res = G.residents.talk(app.s, r);
    let text = `${r.name}「${res.text}」`;
    if (res.gift) {
      text += res.gift.isNew ? ` ${prizeLabel(res.gift.id)}が おけるように なったよ！` : ' また もらった！';
      G.ui.pop(`{${res.gift.id}}`);
    }
    G.ui.toast(text, 3000);
    if (res.reward) G.ui.pop(`+${res.reward} ${coin()}`);
  };

  app.buy = () => {
    const res = G.shop.buy(app.s);
    if (res.ok) { G.ui.pop('{yum} もぐもぐ'); app.wasHungry = false; }
    else G.ui.toast(MSG[res.why]);
  };

  app.startJob = () => {
    const k = G.shop.nearCounter(app.s);
    if (!k) return;
    G.shop.startJob(app.s, k);
    setMode('job');
  };
  app.endJob = () => { G.shop.endJob(app.s); setMode('walk'); };
  app.addLayer = (id) => { if (app.s.job.order) G.burgerJob.addLayer(app.s.job.stack, id); };
  app.removeLayer = () => { G.burgerJob.removeLayer(app.s.job.stack); };
  app.deliver = () => {
    const res = G.shop.deliver(app.s);
    if (res.ok) G.ui.pop(`+${res.reward} ${coin()}`);
  };

  // ペット
  app.buyPet = (kind, name) => {
    const res = G.petShop.buyPet(app.s, kind, name);
    if (res.ok) { G.ui.pop(`{${kind}}`); G.ui.toast(`${name}が なかまに なったよ！`); }
    else G.ui.toast(MSG[res.why]);
  };
  app.buyFood = () => {
    const res = G.petShop.buyFood(app.s);
    if (res.ok) G.ui.pop('+1 {food}');
    else G.ui.toast(MSG[res.why]);
  };
  // なかよしが増えたときのお知らせ
  function celebrate(pet, res) {
    const labels = G.sprites.trickLabels;
    if (res.newTricks.length) G.ui.toast(`${pet.name}は「${labels[res.newTricks[0]]}」を おぼえたよ！`, 3000);
    else if (res.heartUp) G.ui.toast(`${pet.name}と なかよしに なったよ！`, 3000);
  }
  app.pat = () => {
    const pet = G.pets.near(app.s);
    if (!pet) return;
    G.ui.pop('{heart}');
    celebrate(pet, G.pets.pat(app.s, pet));
  };
  app.feed = () => {
    const pet = G.pets.near(app.s);
    if (!pet) return;
    const res = G.pets.feed(app.s, pet);
    if (!res.ok) { G.ui.toast(MSG[res.why]); return; }
    G.ui.pop('{yum}');
    celebrate(pet, res);
  };
  app.toggleFollow = () => {
    const pet = G.pets.near(app.s);
    if (!pet) return;
    G.pets.setFollow(pet, !pet.follow);
    G.ui.toast(pet.follow ? `${pet.name}「ついていくよ！」` : `${pet.name}「おうちで まってるね」`);
  };

  // かぐやさん・家具・冷蔵庫
  app.buyFurniture = (id) => {
    const res = G.furnitureShop.buy(app.s, id);
    if (res.ok) { G.ui.pop(`{${id}}`); G.ui.toast(`${res.kind.label}が おけるように なったよ！`); }
    else G.ui.toast(MSG[res.why]);
  };
  app.toGo = () => {
    const res = G.shop.buyToGo(app.s);
    if (res.ok) G.ui.pop('+1 {burger}');
    else G.ui.toast(MSG[res.why]);
  };
  app.eatHand = () => {
    if (G.furniture.eatHand(app.s).ok) { G.ui.pop('{yum} もぐもぐ'); app.wasHungry = false; }
  };
  app.furnitureAct = () => {
    const f = G.furniture.near(app.s);
    if (!f) return;
    G.ui.pop(`{${G.sprites.furniture[f.kind].reactMini}}`);
    if (f.kind === 'tv') app.tvGlow = { key: G.world.key(f.x, f.y), until: app.s.time + G.config.tvGlowTime };
  };
  app.stash = () => {
    const res = G.furniture.stash(app.s);
    if (res.ok) G.ui.pop(`{fridge} +${res.n}`);
    else if (MSG[res.why]) G.ui.toast(MSG[res.why]);
  };
  app.takeOut = () => {
    const res = G.furniture.takeOut(app.s);
    if (res.ok) G.ui.pop(`+${res.n} {burger}`);
    else if (MSG[res.why]) G.ui.toast(MSG[res.why]);
  };

  // ゲームセンター
  function craneBlocked(k, why) {
    if (why === 'busy') {
      const r = G.crane.playerOf(app.s, k);
      G.ui.toast(`${r ? r.name : 'だれか'}が あそんでるよ。まってね`);
    } else if (MSG[why]) G.ui.toast(MSG[why]);
  }
  app.cranePlay = () => {
    const k = G.crane.near(app.s);
    if (!k) return;
    const res = G.crane.startPlay(app.s, k);
    if (!res.ok) { craneBlocked(k, res.why); return; }
    setMode('crane');
  };
  app.craneHold = (on) => G.crane.hold(app.s, on);
  app.craneQuit = () => {
    const res = G.crane.cancel(app.s);
    if (res.ok) { G.ui.pop(`+${res.refund} ${coin()}`); setMode('walk'); }
  };
  app.craneStock = () => {
    const k = G.crane.near(app.s);
    if (!k) return;
    const res = G.crane.startStock(app.s, k);
    if (!res.ok) { craneBlocked(k, res.why); return; }
    setMode('stock');
  };
  app.stockPick = (id) => {
    const res = G.crane.stockPick(app.s, id);
    if (res.finished) { G.ui.pop(`+${res.reward} ${coin()}`); G.ui.toast('ありがとう！ きれいに ならんだね'); setMode('walk'); }
    return res;
  };
  app.stockQuit = () => { G.crane.cancelStock(app.s); setMode('walk'); };

  // ガシャポン
  const figLabel = (id) => G.gachaLogic.kindOf(id).label;
  app.gachaOpen = () => {
    const k = G.gacha.near(app.s);
    if (!k) return;
    const res = G.gacha.open(app.s, k);
    if (!res.ok) {
      if (res.why === 'busy') { const r = G.gacha.playerOf(app.s, k); G.ui.toast(`${r ? r.name : 'だれか'}が まわしてるよ。まってね`); }
      return;
    }
    setMode('gacha');
  };
  app.gachaTurn = () => {
    const res = G.gacha.turn(app.s);
    if (!res.ok && MSG[res.why]) G.ui.toast(MSG[res.why]);
  };
  // 出たものを知らせる
  function gachaResult(r) {
    if (!r) return;
    G.ui.toast(r.isNew ? `${figLabel(r.id)}が でた！` : `${figLabel(r.id)}が でた！ あげられるよ`, 3000);
    if (r.trophy) setTimeout(() => G.ui.toast(`そろった！ ${figLabel(r.trophy)}が もらえたよ！`, 3500), 1500);
  }
  app.gachaCrack = () => gachaResult(G.gacha.crack(app.s));
  app.gachaClose = () => { gachaResult(G.gacha.close(app.s)); setMode('walk'); };
  app.decorate = (k, i, id) => G.figures.setSlot(app.s, k, i, id);
  app.give = (r, id) => {
    const res = G.figures.give(app.s, r, id);
    if (!res.ok) return;
    G.ui.toast(`${r.name}「わあ、${figLabel(id)}！ ありがとう」`, 3000);
    G.ui.pop(`+${res.reward} ${coin()}`);
  };

  // 動きの中で起きたことを知らせる（クレーンの結果・ペットのなかよし・カプセル）
  function notify(e) {
    if (e.type === 'love') celebrate(e.pet, e.res);
    if (e.type === 'capsule') G.ui.pop(`+${e.reward} ${coin()}`);
    if (e.type !== 'crane') return;
    if (!e.caught) { G.ui.toast('あとちょっと！'); return; }
    const label = prizeLabel(e.id);
    G.ui.pop(`{${e.id}}`);
    G.ui.toast(e.isNew ? `${label}が とれた！ ${label}が おけるように なったよ！` : `${label}が とれた！ また とれた！`, 3000);
  }

  app.exportSave = () => {
    const blob = new Blob([G.save.serialize(app.s)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `kids-game-save-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  app.importSave = (text) => {
    try {
      app.s = G.save.deserialize(text);
      app.cam = { x: app.s.player.x, y: app.s.player.y };
      setMode('walk');
      G.ui.toast('よみこんだよ');
    } catch (e) { G.ui.toast('この ファイルは よめないよ'); }
  };

  function update(dt) {
    const s = app.s;
    if (app.mode === 'walk') {
      const d = G.input.dir();
      G.player.move(s.player, s.world, d.vx, d.vy, dt);
      if (s.player.hunger <= 0 && !app.wasHungry) { app.wasHungry = true; G.ui.toast('おなかが ぺこぺこ… ハンバーガーを たべよう'); }
    }
    G.state.tick(s, dt);
    if (app.mode === 'job' && !s.job.active) setMode('walk'); // カウンターが消えたなど
    if ((app.mode === 'crane' || app.mode === 'stock') && !s.cranePlay) setMode('walk'); // 遊び終わった・台が消えた
    if (app.mode === 'gacha' && !s.gachaPlay) setMode('walk'); // 台が消えた
    for (const e of G.state.drain()) notify(e);
    if (app.mode !== 'build') {
      app.cam.x += (s.player.x - app.cam.x) * Math.min(1, dt * 8);
      app.cam.y += (s.player.y - app.cam.y) * Math.min(1, dt * 8);
    }
    app.saveTimer += dt;
    if (app.saveTimer >= G.config.autosaveInterval) { app.saveTimer = 0; persist(); }
  }

  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - prev) / 1000);
    prev = now;
    update(dt);
    G.render.draw(app);
    G.ui.update();
    requestAnimationFrame(frame);
  }

  // 全画面: Android の Chrome でアドレスバーなどを消す。さわるたびに、全画面でなければ全画面にする
  // （戻るボタンで解除されても、次にさわれば戻る）。全画面にできないブラウザでは何もしない
  app.autoFullscreen = true;
  app.canFullscreen = !!document.fullscreenEnabled;
  app.isFullscreen = () => !!document.fullscreenElement;
  app.goFullscreen = () => {
    if (!app.canFullscreen || app.isFullscreen()) return;
    document.documentElement.requestFullscreen({ navigationUI: 'hide' })
      .then(() => screen.orientation?.lock?.('landscape'))
      .catch(() => {});
  };
  app.toggleFullscreen = () => {
    app.autoFullscreen = !app.isFullscreen();
    if (app.autoFullscreen) app.goFullscreen();
    else document.exitFullscreen().catch(() => {});
  };
  document.addEventListener('pointerdown', () => { if (app.autoFullscreen) app.goFullscreen(); }, true);

  G.render.resize(app);
  addEventListener('resize', () => G.render.resize(app));
  document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
  addEventListener('pagehide', persist);
  G.input.init(app);
  G.ui.init(app);
  if (loaded.status === 'recovered') G.ui.toast('セーブが よめなかったので、あたらしく はじめたよ', 4000);
  requestAnimationFrame(frame);

  // 通しテスト用
  G.debug = {
    app,
    step(sec) { for (let t = 0; t < sec; t += 0.05) update(0.05); G.render.draw(app); G.ui.update(); },
    tileToScreen: (x, y) => G.render.toScreen(app, x, y),
  };
})(window.Game = window.Game || {});
</script>
</body>
</html>
