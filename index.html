(function (G) {
  const C = () => G.config, GL = () => G.gachaLogic, W = () => G.world;

  const count = (s, id) => s.figures[id] || 0;

  // 1体足す。はじめてなら isNew。シリーズの最後の1種類なら、トロフィーを1回だけ足す
  function add(s, id) {
    const isNew = !count(s, id);
    s.figures[id] = count(s, id) + 1;
    let trophy = null;
    const series = GL().seriesOf(id), t = GL().trophyOf(series);
    if (isNew && t && !count(s, t) && GL().isComplete(series, s.figures)) { s.figures[t] = 1; trophy = t; }
    return { isNew, trophy };
  }

  // あげられるフィギュア（2体目から。トロフィーはあげられない）
  const giftable = (s) => C().figureKinds.filter(k => !k.trophy && count(s, k.id) >= 2).map(k => k.id);

  // 住人にあげる。お礼のお金としあわせ
  function give(s, r, id) {
    const k = GL().kindOf(id);
    if (!k || k.trophy || count(s, id) < 2) return { ok: false };
    s.figures[id]--;
    r.figures.push(id);
    while (r.figures.length > C().residentFigureMax) r.figures.shift();
    s.player.money += C().giftReward;
    r.happiness = Math.min(C().happinessMax, (r.happiness || 0) + 1);
    return { ok: true, reward: C().giftReward };
  }

  // 住人のフィギュアを足す（ガシャで遊んだとき）
  function residentAdd(r, id) {
    r.figures.push(id);
    while (r.figures.length > C().residentFigureMax) r.figures.shift();
  }

  const emptyShelf = () => new Array(C().shelfSlots).fill(null);
  const shelfAt = (s, k) => s.shelves[k] || null;

  // 自分のまわり（となり・ななめ）のたなの key。なければ null
  function nearShelf(s) {
    const pt = G.player.tile(s.player);
    return W().findAdjacent(s.world, pt.x, pt.y, 'figureShelf');
  }

  // 場所 i に id を置く（null ではずす）。持っていないものは置けない
  function setSlot(s, k, i, id) {
    const sh = shelfAt(s, k);
    if (!sh || i < 0 || i >= sh.length) return false;
    if (id !== null && !count(s, id)) return false;
    sh[i] = id;
    return true;
  }

  // マスのたなと記録をそろえる。たなが消えたら記録を消す（フィギュアは減らない）
  function reconcile(s) {
    const keys = new Set(W().findAll(s.world, 'figureShelf').map(p => W().key(p.x, p.y)));
    for (const k of keys) if (!s.shelves[k]) s.shelves[k] = emptyShelf();
    for (const k of Object.keys(s.shelves)) if (!keys.has(k)) delete s.shelves[k];
  }

  // 読み込んだとき: 知らない id・おかしい数を取り除く
  function restore(s) {
    const known = (id) => !!GL().kindOf(id);
    const figs = s.figures && typeof s.figures === 'object' ? s.figures : {};
    s.figures = {};
    for (const [id, n] of Object.entries(figs)) if (known(id) && Number.isInteger(n) && n >= 1) s.figures[id] = n;
    const st = s.streak && typeof s.streak === 'object' ? s.streak : {};
    s.streak = {};
    for (const g of C().gachaSeries) s.streak[g.id] = Number.isInteger(st[g.id]) && st[g.id] >= 0 ? st[g.id] : 0;
    const shelves = s.shelves && typeof s.shelves === 'object' ? s.shelves : {};
    s.shelves = {};
    for (const [k, sh] of Object.entries(shelves)) {
      const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y);
      if (!o || o.type !== 'figureShelf' || !Array.isArray(sh)) continue;
      s.shelves[k] = emptyShelf().map((_, i) => (known(sh[i]) && count(s, sh[i]) ? sh[i] : null));
    }
  }

  G.figures = { count, add, giftable, give, residentAdd, shelfAt, nearShelf, setSlot, reconcile, restore };
})(window.Game = window.Game || {});
</script>
<script>
// ガシャポン: シリーズごとのガシャ台（gachaPet / gachaTown / gachaFood）。建てる（お金）・消えたら返金・まわす・カプセル
// 台の記録 s.gachas[key] = { paid }。まわしている途中は s.gachaPlay（セーブしない）
// 住人が遊ぶと、台の近くに空のカプセル（s.capsules = ["x,y"]）を落とす。自分が入ると拾ってお金
(function (G) {
  const W = () => G.world, C = () => G.config, GL = () => G.gachaLogic;

  const machineKeys = (s) => {
    const out = [];
    for (const g of C().gachaSeries) for (const p of W().findAll(s.world, g.machine)) out.push(W().key(p.x, p.y));
    return out;
  };

  // k のマスの台のシリーズ。台でなければ null
  function seriesAt(s, k) {
    const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y);
    return o ? GL().seriesOfMachine(o.type) : null;
  }

  // マスの台と記録をそろえる。マスから消えた台は払ったお金を返す。通れなくなったマスのカプセルを消す。戻り値は返したお金
  function reconcile(s) {
    const keys = new Set(machineKeys(s));
    for (const k of keys) if (!s.gachas[k]) s.gachas[k] = { paid: 0 };
    let refund = 0;
    for (const k of Object.keys(s.gachas)) {
      if (keys.has(k)) continue;
      refund += s.gachas[k].paid || 0;
      delete s.gachas[k];
      if (s.gachaPlay && s.gachaPlay.key === k) s.gachaPlay = null;
    }
    s.player.money += refund;
    s.capsules = s.capsules.filter(k => { const { x, y } = W().parseKey(k); return W().isPassable(s.world, x, y); });
    return refund;
  }

  // 台を建てる。同じ種類の台の上なら何も変わらない。別のガシャ台の上なら、払ってから前の台のお金を返す
  function build(s, x, y, type) {
    const o = W().objAt(s.world, x, y);
    if (o && o.type === type) return { ok: true, same: true };
    if (s.player.money < C().gachaCost) return { ok: false, why: 'money' };
    const res = W().place(s.world, x, y, type, G.state.occupied(s));
    if (!res.ok) return res;
    const k = W().key(x, y), old = s.gachas[k];
    s.player.money -= C().gachaCost;
    let refund = 0;
    if (old) { refund = old.paid || 0; s.player.money += refund; if (s.gachaPlay && s.gachaPlay.key === k) s.gachaPlay = null; }
    s.gachas[k] = { paid: C().gachaCost };
    return Object.assign(res, { refund });
  }

  // 自分のまわり（となり・ななめ）の台で、いちばん近いものの key。なければ null
  function near(s) {
    const p = s.player, pt = G.player.tile(p);
    let best = null, bd = Infinity;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = pt.x + dx, y = pt.y + dy, o = W().objAt(s.world, x, y);
      if (!o || !GL().isMachine(o.type)) continue;
      const d = Math.hypot(x - p.x, y - p.y);
      if (d < bd) { bd = d; best = W().key(x, y); }
    }
    return best;
  }

  // その台で遊んでいる住人
  const playerOf = (s, k) => s.residents.find(r => r.state === 'playingMachine' && r.machineKey === k) || null;

  // 画面を開けないわけ: 'busy' | null。まわせないわけ: 'money' | null
  const openBlock = (s, k) => (playerOf(s, k) ? 'busy' : null);
  const turnBlock = (s) => (s.player.money < C().gachaPlayPrice ? 'money' : null);

  // ガシャの画面を開く（お金はまだ減らない）。向かっている住人は家に帰る
  function open(s, k) {
    if (!s.gachas[k]) return { ok: false };
    const why = openBlock(s, k);
    if (why) return { ok: false, why };
    s.gachaPlay = { key: k, phase: 'ready', t: 0, result: null };
    G.residents.leaveMachine(s, k);
    return { ok: true };
  }

  // ぐるっ: 3コイン払ってハンドルを回す（結果が出たあとなら「もういっかい」）
  function turn(s) {
    const gp = s.gachaPlay;
    if (!gp || (gp.phase !== 'ready' && gp.phase !== 'open')) return { ok: false };
    const why = turnBlock(s);
    if (why) return { ok: false, why };
    s.player.money -= C().gachaPlayPrice;
    Object.assign(gp, { phase: 'turning', t: 0, result: null });
    return { ok: true };
  }

  // カプセルを開ける: 出るものを決めて、持っている数・続けてダブった回数・トロフィー
  function crack(s) {
    const gp = s.gachaPlay;
    if (!gp || (gp.phase !== 'turning' && gp.phase !== 'capsule')) return null;
    const series = seriesAt(s, gp.key);
    const id = GL().pick(series, s.figures, s.streak[series] || 0, G.rng);
    const res = G.figures.add(s, id);
    s.streak[series] = res.isNew ? 0 : (s.streak[series] || 0) + 1;
    const pet = GL().kindOf(id).pet;
    if (pet) for (const p of s.pets) if (p.follow && p.kind === pet) p.trick = { id: 'jump', until: s.time + C().trickTime };
    gp.result = { id, isNew: res.isNew, trophy: res.trophy };
    gp.phase = 'open';
    return gp.result;
  }

  // とじる: 開ける前なら、開けたことにしてから閉じる。戻り値はそのときの結果（なければ null）
  function close(s) {
    const gp = s.gachaPlay;
    if (!gp) return null;
    const res = gp.phase === 'turning' || gp.phase === 'capsule' ? crack(s) : null;
    s.gachaPlay = null;
    return res;
  }

  // 住人が遊び終わった: 台の近くの通れる空いたマスに、空のカプセルを1つ落とす
  function dropCapsule(s, k) {
    const c = C();
    if (s.capsules.length >= c.capsuleMax) return null;
    const { x: mx, y: my } = W().parseKey(k), R = c.capsuleRange;
    const occ = G.state.occupied(s), have = new Set(s.capsules), cands = [];
    for (let y = my - R; y <= my + R; y++) for (let x = mx - R; x <= mx + R; x++) {
      const kk = W().key(x, y);
      if (W().isPassable(s.world, x, y) && !occ.has(kk) && !have.has(kk)) cands.push(kk);
    }
    if (!cands.length) return null;
    const kk = cands[Math.floor(G.rng() * cands.length)];
    s.capsules.push(kk);
    return kk;
  }

  // 自分のいるマスのカプセルを拾う
  function pickUp(s) {
    const pt = G.player.tile(s.player), k = W().key(pt.x, pt.y), i = s.capsules.indexOf(k);
    if (i < 0) return false;
    s.capsules.splice(i, 1);
    s.player.money += C().capsuleReward;
    G.state.emit({ type: 'capsule', reward: C().capsuleReward });
    return true;
  }

  function update(s, dt) {
    const gp = s.gachaPlay;
    if (gp && gp.phase === 'turning') {
      gp.t += dt;
      if (gp.t >= C().gachaTurnTime) gp.phase = 'capsule';
    }
    pickUp(s);
  }

  // 読み込んだとき: 台のないマスの記録は（返金せずに）消す。地図の外・通れないマスのカプセルを消す
  function restore(s) {
    s.gachaPlay = null;
    const gs = s.gachas && typeof s.gachas === 'object' ? s.gachas : {};
    s.gachas = {};
    for (const [k, rec] of Object.entries(gs)) {
      if (!seriesAt(s, k) || !rec) continue;
      s.gachas[k] = { paid: typeof rec.paid === 'number' ? rec.paid : 0 };
    }
    const caps = Array.isArray(s.capsules) ? s.capsules : [];
    const seen = new Set();
    s.capsules = caps.filter(k => {
      if (typeof k !== 'string' || seen.has(k)) return false;
      seen.add(k);
      const { x, y } = W().parseKey(k);
      return Number.isInteger(x) && Number.isInteger(y) && W().isPassable(s.world, x, y);
    });
  }

  G.gacha = { seriesAt, reconcile, build, near, playerOf, openBlock, turnBlock, open, turn, crack, close,
    dropCapsule, pickUp, update, restore };
})(window.Game = window.Game || {});
</script>
<script>
// 住人: ベッドを置くと引っ越してくる。家とハンバーガー屋を行き来する
// 状態: arriving → home → toShop → queued → returning → home … / ベッドが消えたら leaving
//       家にいるとき、ときどき home → toFurniture → using → returning（家の近くの家具を使う）
//       ときどき home → toMachine → playingMachine → returning（クレーン台かガシャ台で遊ぶ）
//       クレーン: 景品を取ると gift にして、はなすとくれる / ガシャ: フィギュアが figures に入り、カプセルを落とす
(function (G) {
  const W = () => G.world, P = () => G.pathfind;
  const NAMES = ['たろう', 'はなこ', 'けんた', 'さくら', 'ゆうと', 'みさき', 'そうた', 'あおい',
    'りく', 'ひなた', 'こうき', 'ゆい', 'はると', 'めい', 'だいち', 'のぞみ'];

  const LINES = {
    normal: ['いいまちだね', 'きょうも いいてんき！', 'このまち すきだよ'],
    hungry: ['おなかすいた〜', 'ハンバーガー たべたいな'],
    ate: ['ハンバーガー おいしかった！', 'おなか いっぱい！'],
    noShop: ['ハンバーガーやさんが あればなあ'],
    cantReach: ['おみせに いけないよ〜'],
    full: ['おみせ こんでるね。あとで いこう'],
    happy: ['まいにち たのしい！', 'このまち だいすき！'],
    allSet: ['すてきな おうちで うれしい！'],
  };

  const bedKey = (r) => W().key(r.bed.x, r.bed.y);
  const tileOf = (r) => ({ x: Math.round(r.x), y: Math.round(r.y) });

  // 家の前のマス（ベッドのとなりで通れるところ）。なければベッドの上
  function homeSpot(s, r) {
    return W().passableNeighbors(s.world, r.bed.x, r.bed.y)[0] || { x: r.bed.x, y: r.bed.y };
  }

  function create(s, bed) {
    const id = s.nextId++;
    const r = {
      id, name: NAMES[(id - 1) % NAMES.length], look: G.looks.random(G.rng),
      bed: { x: bed.x, y: bed.y }, x: 0, y: 0, path: [], goal: null, state: 'arriving',
      mood: 'normal', shopKey: null, spot: null, queuedAt: 0, lastServed: -1e9,
      hungerTimer: G.config.residentHungerInterval * (0.3 + 0.4 * G.rng()), pullBlockedUntil: 0,
      wish: null, wishTimer: G.wishes.firstTimer(G.rng), happiness: 0,
      useTimer: useInterval(), useKey: null, useFrom: null, useUntil: 0,
      visitTimer: visitInterval(), machineKey: null, machineUntil: 0, gift: null, figures: [],
    };
    const home = homeSpot(s, r);
    const out = P().find(s.world, home, P().edgeKeys(s.world));
    const start = out && out.length ? out[out.length - 1] : home;
    r.x = start.x; r.y = start.y;
    setGoal(s, r, home);
    s.residents.push(r);
    return r;
  }

  const useInterval = () => { const c = G.config; return c.furnitureUseMin + (c.furnitureUseMax - c.furnitureUseMin) * G.rng(); };
  const visitInterval = () => { const c = G.config; return c.craneVisitMin + (c.craneVisitMax - c.craneVisitMin) * G.rng(); };

  // 家具の上に座っていたら、となりのマスへ戻る。使っている家具・台をはなす
  function standUp(r) {
    if (r.useFrom) { r.x = r.useFrom.x; r.y = r.useFrom.y; }
    r.useFrom = null; r.useKey = null; r.machineKey = null;
  }

  // useKey の家具がまだあるか
  function furnitureAt(s, k) {
    if (!k) return null;
    const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y);
    return o && G.furniture.kindOf(o.type) ? G.furniture.kindOf(o.type) : null;
  }

  // 家の近くの家具（住人が使うもの・ほかの人が使っていないもの）へ向かう。行けなければ false
  function goFurniture(s, r) {
    const taken = new Set(s.residents.filter(o => o !== r && o.useKey).map(o => o.useKey));
    const cands = G.wishes.nearbyFurniture(s, r.bed)
      .filter(f => G.furniture.kindOf(f.kind).use && !taken.has(W().key(f.x, f.y)));
    while (cands.length) {
      const f = cands.splice(Math.floor(G.rng() * cands.length), 1)[0];
      const goals = new Set(W().passableNeighbors(s.world, f.x, f.y).map(p => W().key(p.x, p.y)));
      const path = goals.size && P().find(s.world, tileOf(r), goals);
      if (!path) continue;
      r.useKey = W().key(f.x, f.y);
      r.goal = path.length ? path[path.length - 1] : tileOf(r);
      r.path = path;
      r.state = 'toFurniture';
      return true;
    }
    return false;
  }

  // 着いた: 座る家具なら上に乗る
  function startUsing(s, r) {
    const kind = furnitureAt(s, r.useKey);
    r.state = 'using';
    r.useUntil = s.time + G.config.furnitureUseTime;
    if (kind && kind.sit) {
      r.useFrom = tileOf(r);
      const { x, y } = W().parseKey(r.useKey);
      r.x = x; r.y = y;
    }
  }

  // k のマスの台の種類: 'crane' | 'gacha' | null
  function machineAt(s, k) {
    if (!k) return null;
    const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y);
    if (!o) return null;
    if (o.type === 'crane') return s.cranes[k] ? 'crane' : null;
    return G.gachaLogic.isMachine(o.type) && s.gachas[k] ? 'gacha' : null;
  }

  // 遊びに行ける台（ほかの人が向かっていない・遊んでいない・自分が使っていない）へ向かう。距離の決まりはない
  // クレーンは景品が入っていて、自分が gift を持っていないときだけ。ガシャはいつでも
  function goMachine(s, r) {
    const taken = new Set(s.residents.filter(o => o !== r && o.machineKey).map(o => o.machineKey));
    if (s.cranePlay) taken.add(s.cranePlay.key);
    if (s.gachaPlay) taken.add(s.gachaPlay.key);
    const cands = [];
    if (!r.gift) for (const k of Object.keys(s.cranes)) if (G.crane.count(s.cranes[k])) cands.push(k);
    for (const k of Object.keys(s.gachas)) cands.push(k);
    const free = cands.filter(k => !taken.has(k));
    while (free.length) {
      const k = free.splice(Math.floor(G.rng() * free.length), 1)[0];
      const { x, y } = W().parseKey(k);
      const goals = new Set(W().passableNeighbors(s.world, x, y).map(p => W().key(p.x, p.y)));
      const path = goals.size && P().find(s.world, tileOf(r), goals);
      if (!path) continue;
      r.machineKey = k;
      r.goal = path.length ? path[path.length - 1] : tileOf(r);
      r.path = path;
      r.state = 'toMachine';
      return true;
    }
    return false;
  }

  // 自分がその台を使い始めた: 向かっている住人は家に帰る
  function leaveMachine(s, k) {
    for (const r of s.residents) if (r.state === 'toMachine' && r.machineKey === k) goHome(s, r);
  }

  // 着いた: 遊べるなら遊び始める。自分が使っている・ほかの人が遊んでいる・クレーンがからっぽなら帰る
  function arriveMachine(s, r) {
    const k = r.machineKey, type = machineAt(s, k);
    const mine = (s.cranePlay && s.cranePlay.key === k) || (s.gachaPlay && s.gachaPlay.key === k);
    const other = s.residents.some(o => o !== r && o.state === 'playingMachine' && o.machineKey === k);
    if (!type || mine || other || (type === 'crane' && !G.crane.count(s.cranes[k]))) { goHome(s, r); return; }
    r.state = 'playingMachine';
    r.machineUntil = s.time + (type === 'crane' ? G.config.cranePlayTime : G.config.gachaPlayTime);
  }

  // 遊び終わり。クレーン: ときどき景品を1つ取る / ガシャ: フィギュアが1つ入り、カプセルを落とす
  function finishMachine(s, r) {
    const k = r.machineKey, type = machineAt(s, k);
    if (type === 'crane') {
      const rec = s.cranes[k];
      if (G.crane.count(rec) && G.rng() < G.config.craneResidentWin) {
        const full = [];
        rec.slots.forEach((id, i) => { if (id) full.push(i); });
        const i = full[Math.floor(G.rng() * full.length)];
        r.gift = rec.slots[i];
        rec.slots[i] = null;
      }
    } else if (type === 'gacha') {
      const figs = G.gachaLogic.seriesFigures(G.gacha.seriesAt(s, k));
      G.figures.residentAdd(r, figs[Math.floor(G.rng() * figs.length)]);
      G.gacha.dropCapsule(s, k);
    }
    goHome(s, r);
  }

  // 目的地を決めて道を引く。行けなければ false
  function setGoal(s, r, goal) {
    const path = P().find(s.world, tileOf(r), new Set([W().key(goal.x, goal.y)]));
    if (!path) return false;
    r.goal = { x: goal.x, y: goal.y };
    r.path = path;
    return true;
  }

  // 道にそって歩く。'moving' | 'arrived' | 'blocked'
  function walk(s, r, dt) {
    let left = G.config.residentSpeed * dt;
    while (left > 0 && r.path.length) {
      const t = r.path[0];
      if (!W().isPassable(s.world, t.x, t.y)) {
        if (!r.goal || !setGoal(s, r, r.goal)) return 'blocked';
        continue;
      }
      const dx = t.x - r.x, dy = t.y - r.y, d = Math.hypot(dx, dy);
      if (d <= left) { r.x = t.x; r.y = t.y; r.path.shift(); left -= d; }
      else { r.x += dx / d * left; r.y += dy / d * left; left = 0; }
    }
    return r.path.length ? 'moving' : 'arrived';
  }

  function warpHome(s, r) {
    standUp(r);
    const h = homeSpot(s, r);
    Object.assign(r, { x: h.x, y: h.y, path: [], goal: null, state: 'home', shopKey: null, spot: null });
  }

  function goHome(s, r) {
    standUp(r);
    r.shopKey = null; r.spot = null;
    r.state = 'returning';
    if (!setGoal(s, r, homeSpot(s, r))) warpHome(s, r);
  }

  function startLeaving(s, r) {
    standUp(r);
    r.state = 'leaving'; r.shopKey = null; r.spot = null;
    const path = P().find(s.world, tileOf(r), P().edgeKeys(s.world));
    if (!path) { r.gone = true; return; }
    r.path = path;
    r.goal = path.length ? path[path.length - 1] : null;
  }

  // お店へ向かう。onlyKey があればそのお店だけ。行けなければ mood を変えて false
  function goShop(s, r, onlyKey) {
    const keys = onlyKey ? [onlyKey] : Object.keys(s.shops);
    if (!Object.keys(s.shops).length) { r.mood = 'noShop'; return false; }
    const reserved = new Set(s.residents.filter(o => o !== r && o.spot).map(o => o.spot));
    const spotShop = new Map();
    let anySpot = false;
    for (const k of keys) for (const p of G.shop.spotsFor(s, k)) {
      anySpot = true;
      const pk = W().key(p.x, p.y);
      if (!reserved.has(pk)) spotShop.set(pk, k);
    }
    if (!spotShop.size) { r.mood = anySpot ? 'full' : 'cantReach'; return false; }
    const path = P().find(s.world, tileOf(r), new Set(spotShop.keys()));
    if (!path) { r.mood = 'cantReach'; return false; }
    const end = path.length ? path[path.length - 1] : tileOf(r);
    r.spot = W().key(end.x, end.y);
    r.shopKey = spotShop.get(r.spot);
    r.goal = end; r.path = path;
    r.state = 'toShop'; r.mood = 'hungry';
    return true;
  }

  // 買えた（店員から、またはアルバイトの自分から）
  function served(s, r) {
    r.mood = 'ate';
    r.lastServed = s.time;
    r.hungerTimer = G.config.residentHungerInterval * (0.8 + 0.4 * G.rng());
    goHome(s, r);
  }

  // アルバイト中は、おなかに関係なく1人ずつ順番に来る
  function pullForJob(s) {
    const k = s.job.counter;
    if (s.residents.some(r => r.shopKey === k && (r.state === 'toShop' || r.state === 'queued'))) return;
    const cands = s.residents.filter(r => r.state === 'home' && r.pullBlockedUntil <= s.time)
      .sort((a, b) => a.lastServed - b.lastServed);
    for (const r of cands) {
      if (goShop(s, r, k)) return;
      r.pullBlockedUntil = s.time + 5;
    }
  }

  function update(s, dt) {
    // ベッドと住人をそろえる
    const have = new Set(s.residents.map(bedKey));
    for (const b of W().findAll(s.world, 'bed')) if (!b.own && !have.has(W().key(b.x, b.y))) create(s, b);
    for (const r of s.residents) {
      const o = W().objAt(s.world, r.bed.x, r.bed.y);
      if (r.state !== 'leaving' && (!o || o.type !== 'bed')) startLeaving(s, r);
      if (r.shopKey && !s.shops[r.shopKey]) goHome(s, r);
    }

    for (const r of s.residents) {
      if (r.gone) continue;
      if (r.mood === 'ate' && s.time - r.lastServed > 30) r.mood = 'normal';
      if (r.state !== 'leaving') G.wishes.tick(s, r, dt, G.rng);
      switch (r.state) {
        case 'arriving':
        case 'returning': {
          const st = walk(s, r, dt);
          if (st === 'arrived') r.state = 'home';
          else if (st === 'blocked') warpHome(s, r);
          break;
        }
        case 'home':
          r.hungerTimer -= dt;
          if (r.hungerTimer <= 0) {
            if (!goShop(s, r)) r.hungerTimer = G.config.retryInterval;
            break;
          }
          r.useTimer -= dt;
          if (r.useTimer <= 0) {
            r.useTimer = useInterval();
            goFurniture(s, r);
          }
          if (r.state !== 'home') break;
          r.visitTimer -= dt;
          if (r.visitTimer <= 0) {
            r.visitTimer = visitInterval();
            goMachine(s, r); // 景品を渡すまではクレーンには行かない
          }
          break;
        case 'toFurniture':
        case 'using': {
          if (!furnitureAt(s, r.useKey)) { goHome(s, r); break; }
          r.hungerTimer -= dt;
          if (r.hungerTimer <= 0) {
            // おなかがすいたら、使うのをやめてお店へ。行けなければ続ける
            const from = r.useFrom, key = r.useKey, pos = { x: r.x, y: r.y };
            standUp(r);
            if (goShop(s, r)) break;
            r.hungerTimer = G.config.retryInterval;
            r.useFrom = from; r.useKey = key; r.x = pos.x; r.y = pos.y;
          }
          if (r.state === 'toFurniture') {
            const st = walk(s, r, dt);
            if (st === 'arrived') startUsing(s, r);
            else if (st === 'blocked') goHome(s, r);
          } else if (s.time >= r.useUntil) goHome(s, r);
          break;
        }
        case 'toMachine':
        case 'playingMachine': {
          if (!machineAt(s, r.machineKey)) { goHome(s, r); break; }
          r.hungerTimer -= dt;
          if (r.hungerTimer <= 0) {
            // おなかがすいたら、遊ぶのをやめてお店へ。行けなければ続ける
            const key = r.machineKey;
            standUp(r);
            if (goShop(s, r)) break;
            r.hungerTimer = G.config.retryInterval;
            r.machineKey = key;
          }
          if (r.state === 'toMachine') {
            const st = walk(s, r, dt);
            if (st === 'arrived') arriveMachine(s, r);
            else if (st === 'blocked') goHome(s, r);
          } else if (s.time >= r.machineUntil) finishMachine(s, r);
          break;
        }
        case 'toShop': {
          const st = walk(s, r, dt);
          if (st === 'arrived') { r.state = 'queued'; r.queuedAt = s.time; }
          else if (st === 'blocked') goHome(s, r);
          break;
        }
        case 'queued':
          break;
        case 'leaving':
          if (walk(s, r, dt) !== 'moving') r.gone = true;
          break;
      }
    }
    s.residents = s.residents.filter(r => !r.gone);
    if (s.job.active) pullForJob(s);
  }

  const oneOf = (lines) => lines[Math.floor(G.rng() * lines.length)];

  // おなかがすいているのに、お店がない・行けない・混んでいて家で待っている
  const WAIT_MOODS = { noShop: true, cantReach: true, full: true };
  const waitingHungry = (r) => !!WAIT_MOODS[r.mood] && ['home', 'toFurniture', 'using', 'toMachine', 'playingMachine'].indexOf(r.state) >= 0;
  // 頭の上に ハンバーガーの吹き出しを出すか（ほしいものより先）
  const wantsBurger = (r) => r.state === 'toShop' || r.state === 'queued' || waitingHungry(r);

  // はなす。ほしいものがかなっていたらお礼をくれる。次に、クレーンで取った景品をくれる
  // 戻り値 { text, reward?, gift?: { id, isNew } }
  function talk(s, r) {
    if (G.wishes.granted(s, r)) {
      const res = G.wishes.thank(s, r, G.rng);
      return { text: `${G.furniture.kindOf(res.kind).label} ありがとう！`, reward: res.reward };
    }
    if (r.gift) {
      const id = r.gift, isNew = !G.furniture.isUnlocked(s, id);
      r.gift = null;
      G.furniture.unlock(s, id);
      return { text: `${G.furniture.kindOf(id).label} あげる！`, gift: { id, isNew } };
    }
    if (r.state === 'toShop' || r.state === 'queued') return { text: oneOf(LINES.hungry) };
    if (waitingHungry(r)) return { text: oneOf(LINES[r.mood]) };
    if (r.wish) return { text: `${G.furniture.kindOf(r.wish).label}が ほしいな` };
    if (r.mood === 'normal' && !G.wishes.pick(s, r, () => 0)) return { text: oneOf(LINES.allSet) };
    if (r.mood === 'normal' && r.happiness >= 3) return { text: oneOf(LINES.happy) };
    return { text: oneOf(LINES[r.mood] || LINES.normal) };
  }

  // 読み込んだとき: 家具・台へ向かう途中・使っている途中は家にいることにする。足りない項目をうめる
  function restore(s, r) {
    r.look = G.looks.normalize(r.look, r.id); // 見た目: 型・髪型・色の番号（古い絵文字は版 6 への移し替えで置き換え済み）
    if (!r.wish || !G.furniture.kindOf(r.wish)) r.wish = null;
    if (typeof r.happiness !== 'number') r.happiness = 0;
    if (typeof r.wishTimer !== 'number') r.wishTimer = G.wishes.firstTimer(G.rng);
    if (typeof r.useTimer !== 'number') r.useTimer = useInterval();
    const g = r.gift && G.furniture.kindOf(r.gift);
    if (!g || !g.prize) r.gift = null;
    if (typeof r.visitTimer !== 'number') r.visitTimer = typeof r.craneTimer === 'number' ? r.craneTimer : visitInterval();
    delete r.craneTimer; delete r.craneKey; delete r.craneUntil;
    r.figures = Array.isArray(r.figures) ? r.figures.filter(id => G.gachaLogic.kindOf(id) && !G.gachaLogic.kindOf(id).trophy) : [];
    r.figures = r.figures.slice(-G.config.residentFigureMax);
    if (['toFurniture', 'using', 'toCrane', 'playingCrane', 'toMachine', 'playingMachine'].indexOf(r.state) >= 0) warpHome(s, r);
    r.useKey = null; r.useFrom = null; r.useUntil = 0; r.machineKey = null; r.machineUntil = 0;
    return r;
  }

  // 自分のまわり1.5マス以内でいちばん近い住人
  function near(s) { return G.player.nearest(s.player, s.residents, 1.5); }

  G.residents = { NAMES, LINES, create, update, served, talk, near, homeSpot, goShop, goMachine, leaveMachine, machineAt, restore, wantsBurger };
})(window.Game = window.Game || {});
</script>
<script>
// ペットのお世話の計算（計算だけで画面には関わらない）: おなか・なかよし・ハート・芸・名前の候補
// しっぱいはない: おなかが空でも何も起きない。なかよしは減らない
(function (G) {
  const C = () => G.config;

  // 6秒で1減る。0で止まる
  function hunger(pet, dt) {
    pet.hunger = Math.max(0, pet.hunger - dt / C().petHungerEvery);
  }

  function hearts(love) {
    return C().heartAt.filter(v => love >= v).length;
  }

  // 覚えた芸の id
  function learned(love) {
    const h = hearts(love);
    return C().tricks.filter(t => h >= t.hearts).map(t => t.id);
  }

  // なかよしを足して、ハートが増えたか・新しく覚えた芸を返す
  function addLove(pet, n) {
    const h0 = hearts(pet.love), t0 = learned(pet.love);
    pet.love += n;
    return { gained: n, heartUp: hearts(pet.love) > h0, newTricks: learned(pet.love).filter(t => t0.indexOf(t) < 0) };
  }

  // なでる。間隔内は増やさない（ハートは出す）。覚えた芸があれば2回に1回くらいする
  function pat(pet, now, rng) {
    const res = now - pet.lastPatAt >= C().petPatCooldown
      ? (pet.lastPatAt = now, addLove(pet, C().petLovePat))
      : { gained: 0, heartUp: false, newTricks: [] };
    const known = learned(pet.love);
    res.trick = known.length && rng() < 0.5 ? known[Math.floor(rng() * known.length)] : null;
    return res;
  }

  function feed(pet) {
    pet.hunger = C().petHungerMax;
    return addLove(pet, C().petLoveFeed);
  }

  // 名前の候補（重ならない4つ）
  function nameChoices(kind, rng) {
    const all = G.sprites.pets[kind].names.slice();
    const out = [];
    while (out.length < 4 && all.length) out.push(all.splice(Math.floor(rng() * all.length), 1)[0]);
    return out;
  }

  G.petCare = { hunger, hearts, learned, addLove, pat, feed, nameChoices };
})(window.Game = window.Game || {});
</script>
<script>
// ペット: ついてくる（follow）か、自分のベッドのまわりでうろうろ（idle と walking を行き来する）
// うろうろするのは「おうち」の中だけ: ベッドからドアを通らずに行けて、ベッドから半径以内のマス
// 閉じ込められたら自分のベッドのそばへぱっと戻る（エラーにしない）
// おうちにいる子は、ときどきベッドの近くのおもちゃへ行って遊ぶ（toToy → toy）。遊ぶと なかよし +1
// 同じ種類のフィギュア（かペットのトロフィー）を飾ったかざりだなも、同じように見に行く
(function (G) {
  const W = () => G.world, P = () => G.pathfind, C = () => G.config;
  const tileOf = (p) => ({ x: Math.round(p.x), y: Math.round(p.y) });
  const kindOf = (id) => C().petKinds.find(k => k.id === id);

  function create(s, kind, name) {
    const t = G.player.tile(s.player);
    const p = { id: s.nextId++, kind, name, x: t.x, y: t.y, follow: true,
      hunger: C().petHungerMax, love: 0, lastPatAt: -1e9 };
    reset(p);
    s.pets.push(p);
    return p;
  }

  const toyInterval = () => C().toyMin + (C().toyMax - C().toyMin) * G.rng();

  // 歩いている途中・芸・おもちゃで遊んでいる途中など、セーブしなくてよいところを初めにもどす
  function reset(p) {
    Object.assign(p, { path: [], state: 'idle', idleUntil: 0, repathAt: 0, trick: null, moving: false, toyKey: null, toyUntil: 0 });
    if (typeof p.toyTimer !== 'number') p.toyTimer = toyInterval();
    return p;
  }

  // 読み込んだペット。知らない種類は取り除く
  function restore(list) { return list.filter(p => p && kindOf(p.kind)).map(reset); }

  const isDoor = (s, x, y) => { const o = W().objAt(s.world, x, y); return !!o && o.type === 'door'; };

  // 自分のベッドのとなりの行けるマス（ドアでないほうを先に）。なければベッドの上
  function homeSpot(s) {
    const b = C().ownBed, ns = W().passableNeighbors(s.world, b.x, b.y);
    return ns.find(q => !isDoor(s, q.x, q.y)) || ns[0] || { x: b.x, y: b.y };
  }

  // おうちのマスの key の Set: ベッドのとなりから、ドアを通らずに歩いて行けて、ベッドから半径以内（まっすぐの距離）
  // 家を建てていなければ、ベッドのまわりの半径以内がそのままおうち
  function homeArea(s) {
    const b = C().ownBed, R = C().petHomeRadius, area = new Set();
    const ok = (q) => Math.hypot(q.x - b.x, q.y - b.y) <= R && !isDoor(s, q.x, q.y);
    const queue = W().passableNeighbors(s.world, b.x, b.y).filter(ok);
    for (const q of queue) area.add(W().key(q.x, q.y));
    for (let i = 0; i < queue.length; i++) {
      for (const q of W().passableNeighbors(s.world, queue[i].x, queue[i].y)) {
        const k = W().key(q.x, q.y);
        if (area.has(k) || !ok(q)) continue;
        area.add(k); queue.push(q);
      }
    }
    return area;
  }

  // おうちの中の goals までの道。おうちの中にいればおうちの中だけを歩く。外にいればまずおうちへ
  function homePath(s, p, goals, area) {
    const here = tileOf(p);
    return P().find(s.world, here, goals, area.has(W().key(here.x, here.y)) ? area : undefined);
  }

  function warpHome(s, p) {
    const h = homeSpot(s);
    Object.assign(p, { x: h.x, y: h.y, path: [] });
  }

  // いるマスに壁などが置かれたら、となりの行けるマスへ。なければベッドのそばへ
  function getOut(s, p) {
    const t = tileOf(p);
    if (W().isPassable(s.world, t.x, t.y)) return;
    const n = W().passableNeighbors(s.world, t.x, t.y)[0];
    if (n) Object.assign(p, { x: n.x, y: n.y, path: [] });
    else warpHome(s, p);
  }

  // 道にそって歩く。'moving' | 'arrived' | 'blocked'
  function walk(s, p, speed, dt) {
    let left = speed * dt;
    while (left > 0 && p.path.length) {
      const t = p.path[0];
      if (!W().isPassable(s.world, t.x, t.y)) { p.path = []; return 'blocked'; }
      const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy);
      if (d <= left) { p.x = t.x; p.y = t.y; p.path.shift(); left -= d; }
      else { p.x += dx / d * left; p.y += dy / d * left; left = 0; }
    }
    return p.path.length ? 'moving' : 'arrived';
  }

  // leader（前の子、先頭は自分）の後ろを歩く
  function followStep(s, p, leader, dt) {
    const c = C();
    if (s.job.active) { p.path = []; return; } // アルバイト中はその場で待つ
    const d = Math.hypot(leader.x - p.x, leader.y - p.y);
    if (d <= c.petFollowNear) { p.path = []; return; }
    if (s.time >= p.repathAt) {
      p.repathAt = s.time + c.petRepath;
      const lt = tileOf(leader);
      const path = P().find(s.world, tileOf(p), new Set([W().key(lt.x, lt.y)]));
      if (!path) { warpHome(s, p); return; }
      p.path = path;
    }
    const speed = c.petSpeeds[kindOf(p.kind).move] * (d >= c.petCatchUpDist ? c.petCatchUpRate : 1);
    walk(s, p, speed, dt);
  }

  // おうちのマスを1つ選んで歩き、着いたら少し止まる。おうちの外にいたら、まずおうちへ戻る
  function homeStep(s, p, dt) {
    const c = C();
    if (p.path.length) {
      if (walk(s, p, c.petSpeeds[kindOf(p.kind).move], dt) === 'moving') return;
      p.idleUntil = s.time + c.petIdleMin + (c.petIdleMax - c.petIdleMin) * G.rng();
      return;
    }
    if (s.time < p.idleUntil) return;
    const here = tileOf(p), hk = W().key(here.x, here.y), area = homeArea(s);
    const cands = area.has(hk) ? [...area].filter(k => k !== hk) : [...area];
    if (!cands.length) { p.idleUntil = s.time + 1; return; } // おうちが1マスだけ・ないときはその場で
    const goals = area.has(hk) ? new Set([cands[Math.floor(G.rng() * cands.length)]]) : area;
    const path = homePath(s, p, goals, area);
    if (path) { p.path = path; return; }
    if (!area.has(hk)) warpHome(s, p); // おうちに戻れない
    p.idleUntil = s.time + 1;
  }

  // k のマスで、ペット p が遊べる・見られるもの { id, love, shelf }。なければ null
  // id はおもちゃなら家具の ID、かざりだななら飾ってあるフィギュアの ID（shelf: true）
  // おもちゃ、または p と同じ種類のフィギュアかペットのトロフィーが飾ってあるかざりだな
  function toyAt(s, k, p) {
    if (!k) return null;
    const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y);
    if (!o) return null;
    const kind = G.furniture.kindOf(o.type);
    if (kind && kind.petToy) return { id: o.type, love: C().toyLove };
    if (o.type !== 'figureShelf' || !p) return null;
    const sh = G.figures.shelfAt(s, k) || [];
    const id = sh.find(f => f && (f === 'trophyPet' || G.gachaLogic.kindOf(f).pet === p.kind));
    return id ? { id, love: C().shelfLove, shelf: true } : null;
  }

  function stopToy(p) {
    Object.assign(p, { state: 'idle', toyKey: null, toyUntil: 0, path: [], idleUntil: 0 });
  }

  // おもちゃで遊ぶ。遊びに向かっている・遊んでいるあいだは true（いつものうろうろはしない）
  function toyStep(s, p, dt) {
    const c = C();
    if (p.state === 'toToy' || p.state === 'toy') {
      const toy = toyAt(s, p.toyKey, p);
      if (!toy) { stopToy(p); return false; }
      if (p.state === 'toToy') {
        const st = walk(s, p, c.petSpeeds[kindOf(p.kind).move], dt);
        if (st === 'arrived') { p.state = 'toy'; p.toyUntil = s.time + c.toyPlayTime; }
        else if (st === 'blocked') stopToy(p);
        return true;
      }
      if (s.time >= p.toyUntil) {
        G.state.emit({ type: 'love', pet: p, res: G.petCare.addLove(p, toy.love) });
        stopToy(p);
      }
      return true;
    }
    p.toyTimer -= dt;
    if (p.toyTimer > 0) return false;
    p.toyTimer = toyInterval();
    // ベッドから半径以内のおもちゃ・かざりだなで、おうちの中から遊べるもの
    const b = c.ownBed, R = c.petHomeRadius, area = homeArea(s), toys = [];
    for (let y = b.y - R; y <= b.y + R; y++) for (let x = b.x - R; x <= b.x + R; x++)
      if (Math.hypot(x - b.x, y - b.y) <= R && toyAt(s, W().key(x, y), p)) toys.push({ x, y });
    while (toys.length) {
      const t = toys.splice(Math.floor(G.rng() * toys.length), 1)[0];
      const goals = new Set(W().passableNeighbors(s.world, t.x, t.y).map(q => W().key(q.x, q.y)).filter(k => area.has(k)));
      const path = goals.size && homePath(s, p, goals, area);
      if (!path) continue;
      Object.assign(p, { state: 'toToy', toyKey: W().key(t.x, t.y), path });

<script>
// ゲーム全体の状態（セーブするのはこれ全部）と、1コマ進める処理
(function (G) {
  G.rng = G.rng || Math.random;
  const VERSION = 6;

  function create() {
    const c = G.config;
    const world = G.world.create(c.mapW, c.mapH);
    world.obj[c.ownBed.y * c.mapW + c.ownBed.x] = { type: 'bed', own: true };
    return {
      version: VERSION, time: 0, nextId: 1,
      world,
      player: G.player.create(),
      residents: [],
      pets: [],
      fridge: 0, unlocked: [],
      shops: {},
      cranes: {}, cranePlay: null,
      gachas: {}, gachaPlay: null, figures: {}, streak: { pet: 0, town: 0, food: 0 }, shelves: {}, capsules: [],
      job: { active: false, counter: null, deliveries: 0, customerId: null, order: null, stack: [] },
    };
  }

  // 人が立っている（これから入る）マス。ここには壁などを置けない（ペットは入れない。置かれたら自分でよける）
  function occupied(s) {
    const set = new Set();
    const add = (x, y) => set.add(G.world.key(Math.round(x), Math.round(y)));
    const p = s.player;
    for (const dx of [-0.3, 0.3]) for (const dy of [-0.3, 0.3]) add(p.x + dx, p.y + dy);
    for (const r of s.residents) {
      add(r.x, r.y);
      if (r.path.length) add(r.path[0].x, r.path[0].y);
      if (r.useFrom) add(r.useFrom.x, r.useFrom.y); // 家具に座っている人が戻るマス
    }
    return set;
  }

  function tick(s, dt) {
    s.time += dt;
    G.shop.reconcile(s);
    G.crane.reconcile(s);
    G.gacha.reconcile(s);
    G.figures.reconcile(s);
    G.residents.update(s, dt);
    G.pets.update(s, dt);
    G.shop.update(s, dt);
    G.crane.update(s, dt);
    G.gacha.update(s, dt);
  }

  // 画面に知らせること（クレーンの結果・ペットのなかよしなど）。セーブしない。main が毎コマ取り出す
  const events = [];
  const emit = (e) => { events.push(e); };
  const drain = () => events.splice(0, events.length);

  G.state = { VERSION, create, occupied, tick, events, emit, drain };
})(window.Game = window.Game || {});

<script>
// セーブ: ブラウザの中（localStorage）と、ファイルへの書き出し・読み込み
(function (G) {
  function serialize(s) { return JSON.stringify(s); }

  // 古い版のデータを今の版にそろえる
  function migrate(s) {
    if (s && s.version === 1 && s.player) {
      s.pets = [];
      s.player.food = 0;
      s.version = 2;
    }
    if (s && s.version === 2 && s.player) {
      s.player.hand = 0;
      s.fridge = 0;
      s.unlocked = [];
      s.version = 3; // 住人に足す項目は deserialize の residents.restore でうめる
    }
    if (s && s.version === 3 && s.player) {
      s.cranes = {};
      s.version = 4; // 住人の gift・ペットの toyTimer は restore でうめる
    }
    if (s && s.version === 4 && s.player) {
      Object.assign(s, { gachas: {}, figures: {}, streak: { pet: 0, town: 0, food: 0 }, shelves: {}, capsules: [] });
      s.version = 5; // 住人の craneTimer → visitTimer・figures は restore で
    }
    if (s && s.version === 5 && s.player) {
      // ドット絵: 住人の見た目を絵文字から「型・髪型・色」に（色は住人の id から決める）
      if (Array.isArray(s.residents)) for (const r of s.residents) if (r) r.look = G.looks.fromEmoji(r.look, r.id);
      s.version = 6;
    }
    return s;
  }

  // 形がおかしければ例外
  function deserialize(text) {
    const s = migrate(JSON.parse(text));
    const c = G.config;
    const ok = s && s.version === G.state.VERSION && s.world && s.world.w === c.mapW && s.world.h === c.mapH
      && Array.isArray(s.world.floor) && s.world.floor.length === c.mapW * c.mapH
      && Array.isArray(s.world.obj) && s.world.obj.length === c.mapW * c.mapH
      && s.player && typeof s.player.money === 'number' && Array.isArray(s.residents)
      && s.shops && typeof s.shops === 'object' && s.job && typeof s.time === 'number'
      && Array.isArray(s.pets) && typeof s.player.food === 'number'
      && typeof s.player.hand === 'number' && typeof s.fridge === 'number' && Array.isArray(s.unlocked)
      && s.cranes && typeof s.cranes === 'object'
      && s.gachas && typeof s.gachas === 'object' && s.figures && typeof s.figures === 'object'
      && s.streak && typeof s.streak === 'object' && s.shelves && typeof s.shelves === 'object'
      && Array.isArray(s.capsules);
    if (!ok) throw new Error('bad save');
    s.pets = G.pets.restore(s.pets); // 知らない種類は取り除き、歩いている途中などは初めから
    G.furniture.restoreWorld(s); // 知らない家具は取り除く
    G.crane.restore(s); // 台のない記録・知らない景品を取り除く。遊んでいる途中は終わり
    G.figures.restore(s); // 知らないフィギュア・おかしい数・たなのないマスの記録を取り除く
    G.gacha.restore(s); // 台のない記録・通れないマスのカプセルを取り除く。まわしている途中は終わり
    for (const r of s.residents) G.residents.restore(s, r);
    s.job.active = false; // 開き直したらアルバイトは終わっている
    s.job.customerId = null; s.job.order = null; s.job.stack = [];
    return s;
  }

  // 戻り値 { state, status: 'new' | 'loaded' | 'recovered' }
  // recovered: 壊れていたので新しく始めた（壊れたデータは別のキーに残す）
  function load(storage) {
    const key = G.config.saveKey;
    let text = null;
    try { text = storage.getItem(key); } catch (e) { /* 保存が使えない */ }
    if (!text) return { state: G.state.create(), status: 'new' };
    try { return { state: deserialize(text), status: 'loaded' }; }
    catch (e) {
      try { storage.setItem(key + '-broken-' + Date.now(), text); } catch (e2) { /* 残せなくても続ける */ }
      return { state: G.state.create(), status: 'recovered' };
    }
  }

  function save(storage, s) {
    try { storage.setItem(G.config.saveKey, serialize(s)); return true; }
    catch (e) { return false; }
  }

  G.save = { serialize, deserialize, load, save };
})(window.Game = window.Game || {});
</script>
<script>
// 操作: ぷにコン（触ったところにスティック）・マウスのドラッグ・矢印キー。つくるモードはタップで置く・なぞって動かす
(function (G) {
  const RADIUS = 50, DEAD = 0.15;
  const keys = new Set();
  const input = {
    joy: null,   // { ox, oy, cx, cy, id }
    drag: null,  // つくるモードのなぞり
  };

  function init(app) {
    const cv = app.canvas;
    cv.addEventListener('pointerdown', (e) => {
      cv.setPointerCapture(e.pointerId);
      if (app.mode === 'walk') input.joy = { ox: e.clientX, oy: e.clientY, cx: e.clientX, cy: e.clientY, id: e.pointerId };
      else if (app.mode === 'build')
        input.drag = { x: e.clientX, y: e.clientY, cam: { ...app.cam }, moved: false, id: e.pointerId };
    });
    cv.addEventListener('pointermove', (e) => {
      if (input.joy && e.pointerId === input.joy.id) { input.joy.cx = e.clientX; input.joy.cy = e.clientY; }
      const d = input.drag;
      if (d && e.pointerId === d.id) {
        const dx = e.clientX - d.x, dy = e.clientY - d.y;
        if (Math.hypot(dx, dy) > 10) d.moved = true;
        if (d.moved) { app.cam.x = d.cam.x - dx / app.T; app.cam.y = d.cam.y - dy / app.T; }
      }
    });
    const up = (e) => {
      if (input.joy && e.pointerId === input.joy.id) input.joy = null;
      const d = input.drag;
      if (d && e.pointerId === d.id) {
        if (!d.moved && e.type === 'pointerup') app.onTap(G.render.screenToTile(app, e.clientX, e.clientY));
        input.drag = null;
      }
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    addEventListener('keydown', (e) => { keys.add(e.key); });
    addEventListener('keyup', (e) => { keys.delete(e.key); });
    addEventListener('blur', () => keys.clear());
  }

  // 歩く向き（長さ1まで）
  function dir() {
    let vx = 0, vy = 0;
    if (keys.has('ArrowLeft') || keys.has('a')) vx -= 1;
    if (keys.has('ArrowRight') || keys.has('d')) vx += 1;
    if (keys.has('ArrowUp') || keys.has('w')) vy -= 1;
    if (keys.has('ArrowDown') || keys.has('s')) vy += 1;
    if (vx || vy) { const l = Math.hypot(vx, vy); return { vx: vx / l, vy: vy / l }; }
    const j = input.joy;
    if (!j) return { vx: 0, vy: 0 };
    let dx = (j.cx - j.ox) / RADIUS, dy = (j.cy - j.oy) / RADIUS;
    const l = Math.hypot(dx, dy);
    if (l < DEAD) return { vx: 0, vy: 0 };
    if (l > 1) { dx /= l; dy /= l; }
    return { vx: dx, vy: dy };
  }

  function reset() { input.joy = null; input.drag = null; }

  Object.assign(input, { init, dir, reset, RADIUS });
  G.input = input;
})(window.Game = window.Game || {});
</script>
<script>
// Canvas への描画（ドット絵の設計書 2節）。Canvas の画素は「画面の画素 ÷ k」ドットだけにして、ドット単位で描き、
// 拡大は CSS（image-rendering: pixelated）に任せる。マス (x, y) の中心は整数の座標、1マスは 16 ドット
(function (G) {
  const D = 16;
  const A = () => G.art, S = () => G.sprites, C = () => G.config;

  function resize(app) {

    let k = Math.max(1, Math.round(Math.min(w, h) / (c.tilesShort * D)));
    while (k > 1 && (D * k) / dpr > hi) k--;

    // Canvas を右と下へ（画面の外に）数ドット足して、丸めの要らない大きさにする（HOPPE DIVE の render.js と同じ）
    const fit = (n) => { for (let p = 0; p < 64; p++) { const v = ((n + p) * k * 64) / dpr; if (Math.abs(v - Math.round(v)) < 1e-6) return n + p; } return n; };
    const cw = fit(Lw), ch = fit(Lh);

    // 画面の上の表示（DOM）のドット: 普通は Canvas と同じ k 画素。低い画面では、表示が入りきるように小さくする（整数の画素のまま）
    const uiK = Math.max(1, Math.min(k, Math.floor(Math.min(w, h) / c.uiDotsShort)));
