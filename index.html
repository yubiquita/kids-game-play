<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5d8a2f">
<title>けんちくけいゲーム</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #5d8a2f;
  font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Noto Sans JP", sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
canvas { display: block; position: fixed; inset: 0; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
#ui > .pop, #ui > .toast { pointer-events: none; } /* 浮かぶ表示はタップを取らない */
button { font: inherit; border: none; border-radius: 14px; background: #fff; color: #333;
  box-shadow: 0 3px 0 #0003; padding: 8px 14px; font-size: 18px; cursor: pointer; touch-action: manipulation; }
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0003; }
button:disabled { opacity: .45; }

.hud { position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
  right: max(8px, env(safe-area-inset-right)); display: flex; gap: 10px; align-items: center; pointer-events: none; }
.hud > * { pointer-events: auto; }
.pill { background: #fffe; border-radius: 14px; padding: 6px 12px; font-size: 20px; box-shadow: 0 2px 0 #0002; }
.hunger { display: flex; align-items: center; gap: 6px; }
.bar { width: 110px; height: 14px; background: #ddd; border-radius: 7px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: #ff9800; transition: width .3s; }
.bar.empty > i { background: #e53935; }
.spacer { flex: 1; }

.actions { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: 16px;
  display: flex; flex-direction: column; flex-wrap: wrap-reverse; gap: 10px; align-items: flex-end;
  align-content: flex-start; max-height: calc(100% - 90px); }
.actions button { font-size: 22px; padding: 12px 18px; }

.toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); background: #fffe;
  padding: 10px 18px; border-radius: 16px; font-size: 20px; box-shadow: 0 3px 0 #0003; white-space: nowrap;
  pointer-events: none; }

.palette { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; display: flex; gap: 8px;
  background: #fffc; padding: 8px; border-radius: 18px; box-sizing: border-box; max-width: calc(100% - 16px);
  overflow-x: auto; touch-action: pan-x; }
.palette button { flex-shrink: 0; }
.palette button { display: flex; flex-direction: column; align-items: center; font-size: 24px; padding: 6px 6px; min-width: 54px; }
.palette button small { font-size: 12px; white-space: nowrap; }
.palette button.on { background: #ffe082; outline: 3px solid #ff9800; }
.swatch { width: 28px; height: 28px; border-radius: 6px; display: inline-block; }

.job { position: absolute; inset: 8px; background: #fff8e1; border-radius: 22px; display: grid;
  grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; gap: 8px; padding: 12px; box-sizing: border-box; }
.job .col { display: flex; flex-direction: column; align-items: center; justify-content: safe flex-end; gap: 4px;
  min-height: 0; overflow: hidden auto; }
.job .title { font-size: 18px; margin-bottom: auto; }
.job .customer { font-size: clamp(26px, 10vh, 44px); line-height: 1.1; }
.stack { display: flex; flex-direction: column-reverse; align-items: center; }
.stack span { width: min(110px, 100%); height: clamp(15px, 6vh, 26px); border-radius: 10px; margin-top: -2px;
  display: flex; align-items: center; justify-content: center; font-size: clamp(12px, 5vh, 22px); box-shadow: inset 0 -3px 0 #0002; }
.job .stack { width: 110px; flex-shrink: 0; }
.job .wait { font-size: 20px; color: #666; text-align: center; margin: auto; }
.job .controls { grid-column: 1 / 3; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.job .controls button { font-size: 24px; padding: 10px 14px; }
.job .controls .give { background: #66bb6a; color: #fff; }
.job .controls .end { background: #eee; }
@media (max-height: 340px) {
  .job { inset: 4px; padding: 8px; gap: 4px; }
  .job .title { font-size: 15px; }
  .job .controls button { font-size: 20px; padding: 6px 10px; }
}
.pop { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 48px; font-weight: bold;
  color: #fff; text-shadow: 0 0 6px #e65100, 0 2px 0 #e65100; white-space: nowrap;
  animation: pop 1s ease-out forwards; pointer-events: none; }
@keyframes pop { from { opacity: 1; transform: translate(-50%, -50%) scale(.6); }
  to { opacity: 0; transform: translate(-50%, -130%) scale(1.2); } }

.modal { position: absolute; inset: 0; background: #0006; display: flex; align-items: center; justify-content: center; }
.modal .box { background: #fff; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 260px; }

.modal .title { font-size: 20px; text-align: center; }
.shelf { display: grid; grid-template-columns: repeat(5, auto); gap: 8px; }
.shelf button { display: flex; flex-direction: column; align-items: center; font-size: 34px; padding: 6px 10px; min-width: 76px; }
.shelf button small { font-size: 14px; }
.names { display: flex; gap: 10px; }
.names button { font-size: 22px; padding: 12px 16px; }

.rotate { position: absolute; inset: 0; background: #5d8a2f; color: #fff; display: none;
  align-items: center; justify-content: center; font-size: 28px; text-align: center; }
@media (orientation: portrait) and (pointer: coarse) { .rotate { display: flex; } }

/* ゲームセンター */
.dim { opacity: .45; }
.palette button.dim { opacity: .45; }
.crane, .stock { position: absolute; inset: 8px; background: #fce4ec; border-radius: 22px; display: flex;
  flex-direction: column; gap: 8px; padding: 12px; box-sizing: border-box; }
.crane .ctop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.crane .title, .stock .title { font-size: 18px; }
.crane .meter { font-size: 18px; background: #fff; border-radius: 12px; padding: 2px 10px; }
.crane .meter:empty { display: none; }
.cfield { position: relative; flex: 1; min-height: 0; background: #e1f5fe; border: 4px solid #f48fb1;
  border-radius: 16px; overflow: hidden; }
.cslots { position: absolute; left: 0; right: 0; bottom: 6px; display: grid; grid-template-columns: repeat(6, 1fr);
  align-items: end; }
.cslots > div { text-align: center; font-size: clamp(24px, 11vh, 48px); line-height: 1.1; }
.chute { background: #f8bbd0; border-radius: 10px; margin: 0 6px; font-size: 20px !important; padding: 6px 0; }
.arm { position: absolute; top: 0; height: 100%; width: 0; display: flex; flex-direction: column; align-items: center; }
.arm .rope { width: 4px; background: #757575; flex-shrink: 0; }
.arm .claw { font-size: clamp(22px, 9vh, 40px); line-height: 1; transform: translateX(0); white-space: nowrap;
  display: flex; flex-direction: column; align-items: center; }
.arm .claw span { font-size: .8em; margin-top: -4px; }
.cmsg { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 20px; color: #ad1457;
  white-space: nowrap; font-weight: bold; }
.crane .controls, .stock .controls { display: flex; gap: 12px; justify-content: center; }
.crane .go { font-size: 34px; padding: 8px 40px; background: #ffd54f; touch-action: none; }
.crane .end, .stock .end { background: #eee; font-size: 22px; padding: 10px 16px; }
.stock { align-items: center; justify-content: space-between; }
.srow { display: flex; gap: 10px; }
.scell { width: clamp(44px, 16vh, 72px); height: clamp(44px, 16vh, 72px); background: #fff; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; font-size: clamp(26px, 10vh, 44px); }
.scell.mihon { opacity: .35; outline: 2px dashed #f48fb1; }
.scell.now { opacity: .55; outline: 4px solid #ff9800; background: #fff3e0; }
.spick { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.spick button { font-size: 30px; padding: 6px 10px; }
.shake { animation: shake .35s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (max-height: 340px) {
  .crane, .stock { inset: 4px; padding: 8px; gap: 4px; }
  .spick button { font-size: 24px; padding: 4px 8px; }
}

/* ガシャポン */
.capsule { display: inline-block; width: 26px; height: 26px; border-radius: 50%; vertical-align: middle;
  background: linear-gradient(#ef5350 50%, #fafafa 50%); box-shadow: inset 0 0 0 2px #9e9e9e; }
.capsule.big { width: clamp(48px, 18vh, 80px); height: clamp(48px, 18vh, 80px); }
.palette .swatch { display: flex; align-items: center; justify-content: center; font-size: 18px; }
.gacha { position: absolute; inset: 8px; background: #e3f2fd; border-radius: 22px; display: flex;
  flex-direction: column; gap: 8px; padding: 12px; box-sizing: border-box; }
.gacha .ctop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gacha .title { font-size: 18px; }
.gacha .meter { font-size: 18px; background: #fff; border-radius: 12px; padding: 2px 10px; }
.gfield { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 6%; }
.gmachine { position: relative; height: 92%; aspect-ratio: 3 / 4; border: 4px solid #0277bd; border-radius: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; box-sizing: border-box; }
.gglass { position: relative; width: 74%; aspect-ratio: 1; border-radius: 50%; background: #fffc; overflow: hidden; }
.gglass i { position: absolute; width: 26%; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 0 0 2px #0002; }
.gglass i:nth-child(1) { left: 14%; top: 52%; background: linear-gradient(#ef5350 50%, #fafafa 50%); }
.gglass i:nth-child(2) { left: 44%; top: 60%; background: linear-gradient(#42a5f5 50%, #fafafa 50%); }
.gglass i:nth-child(3) { left: 62%; top: 34%; background: linear-gradient(#ffca28 50%, #fafafa 50%); }
.gglass i:nth-child(4) { left: 30%; top: 26%; background: linear-gradient(#66bb6a 50%, #fafafa 50%); }
.gglass i:nth-child(5) { left: 58%; top: 8%; background: linear-gradient(#ab47bc 50%, #fafafa 50%); }
.gmachine.turning .gglass i { animation: shake .3s infinite; }
.ghandle { font-size: clamp(24px, 10vh, 44px); line-height: 1; }
.gmachine.turning .ghandle { animation: spin .8s linear; }
@keyframes spin { to { transform: rotate(360deg); } }
.gout { width: 36%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.gmsg { font-size: 20px; color: #0277bd; font-weight: bold; white-space: nowrap; }
.gmsg:empty { display: none; }
.gcap { background: none; box-shadow: none; padding: 0; animation: drop .4s ease-out; }
@keyframes drop { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
.gresult { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #fff; border-radius: 18px;
  padding: 8px 14px; animation: pop-in .35s ease-out; }
@keyframes pop-in { from { transform: scale(.4); } to { transform: none; } }
.gresult .fig { font-size: clamp(48px, 26vh, 110px); line-height: 1.1; }
.gresult b { font-size: 22px; }
.gresult em { font-style: normal; font-weight: bold; color: #fff; background: #e53935; border-radius: 10px; padding: 0 10px; }
.gresult small { font-size: 15px; color: #666; }
.gacha .controls { display: flex; gap: 12px; justify-content: center; }
.gacha .go { font-size: 26px; padding: 8px 28px; background: #ffd54f; }
.gacha .end { background: #eee; font-size: 22px; padding: 10px 16px; }
.fig { display: inline-block; position: relative; padding-bottom: 4px;
  background: radial-gradient(ellipse 45% 12% at 50% 92%, #9e9e9e 98%, transparent 100%); }
.fig.gold { background: radial-gradient(ellipse 45% 12% at 50% 92%, #ffc107 98%, transparent 100%); }
.figlist { display: flex; flex-direction: column; gap: 6px; max-height: 42vh; overflow-y: auto; touch-action: pan-y; padding: 2px 2px 6px; }
.figrow { display: flex; gap: 6px; }
.figrow.wrap { flex-wrap: wrap; max-width: 80vw; justify-content: center; }
.figrow button { font-size: 28px; padding: 4px 8px; display: flex; flex-direction: column; align-items: center; }
.figrow button small { font-size: 13px; }
.modal .scell { padding: 0; }
.note { color: #666; text-align: center; }
.zukan { display: flex; flex-direction: column; gap: 2px; max-height: 70vh; overflow-y: auto; touch-action: pan-y; }
.modal .box:has(.zukan) { padding: 10px 14px; gap: 6px; }
.zhead { font-size: 15px; display: flex; gap: 8px; align-items: center; }
.zcell { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 58px; background: #f5f5f5;
  border-radius: 12px; padding: 1px 4px; line-height: 1.15; }
.zcell .fig { font-size: 24px; }
.zcell small { font-size: 11px; white-space: nowrap; }
.zcell .badge { position: absolute; top: -2px; right: -2px; font-size: 11px; background: #ff9800; color: #fff; border-radius: 8px; padding: 0 4px; }
.zcell.unknown { color: #aaa; }
@media (max-height: 340px) {
  .gacha { inset: 4px; padding: 8px; gap: 4px; }
  .zcell { min-width: 50px; }
  .zcell .fig { font-size: 22px; }
}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="ui"></div>
<script>
// 数字はここに集める（設計書4節）。遊んでもらってから調整する
(function (G) {
  G.config = {
    mapW: 40,
    mapH: 40,
    ownBed: { x: 20, y: 20 },     // 最初からある自分のベッド
    startMoney: 10,
    burgerPrice: 5,
    hungerMax: 100,
    tilesPerHunger: 5,             // 何マス歩くとおなかが1減るか
    burgerHeal: 40,
    hungrySpeedRate: 0.5,          // おなか0のときの速さの倍率
    playerSpeed: 4,                // マス/秒
    residentSpeed: 2.5,
    residentHungerInterval: 120,   // 住人がおなかすく間隔（秒）
    retryInterval: 8,              // お店に行けなかったときの再挑戦（秒）
    queueMax: 3,
    clerkServeTime: 3,             // 店員が1人に売る時間（秒）
    orderStartLayers: 3,
    orderMaxLayers: 6,
    deliveriesPerLevel: 5,
    stackMax: 8,
    autosaveInterval: 10,
    saveKey: 'kids-game-save',

    // ペット（第2弾の設計書2節）
    foodPrice: 2,
    petMax: 12,
    petHungerMax: 100,
    petHungerEvery: 6,             // 何秒でおなかが1減るか
    petLovePat: 1,
    petLoveFeed: 3,
    petPatCooldown: 3,             // 同じペットをなでて増えるのは何秒に1回か
    heartAt: [5, 15, 30, 50, 80],  // ハート1〜5になる「なかよし」
    tricks: [{ id: 'spin', hearts: 2 }, { id: 'jump', hearts: 4 }],
    trickTime: 1,                  // 芸の長さ（秒）
    petFollowNear: 1.5,            // ついてくるとき、これより近ければ止まる（マス）
    petCatchUpDist: 3,             // これより離れたら速く歩いて追いつく
    petCatchUpRate: 2,
    petRepath: 0.5,                // ついてくるときに道を引き直す間隔（秒）
    petHomeRadius: 4,              // おうちにいるとき、ベッドからどこまで歩くか（マス）
    petIdleMin: 2,
    petIdleMax: 5,
    petSpeeds: { normal: 3, hop: 3, scurry: 3.5, float: 3, slow: 1.5 },
    petKinds: [
      { id: 'dog',      label: 'いぬ',       price: 20, move: 'normal' },
      { id: 'cat',      label: 'ねこ',       price: 20, move: 'normal' },
      { id: 'rabbit',   label: 'うさぎ',     price: 15, move: 'hop' },
      { id: 'hamster',  label: 'ハムスター', price: 10, move: 'scurry' },
      { id: 'hedgehog', label: 'ハリネズミ', price: 10, move: 'scurry' },
      { id: 'mouse',    label: 'ネズミ',     price: 10, move: 'scurry' },
      { id: 'parakeet', label: 'インコ',     price: 15, move: 'float' },
      { id: 'turtle',   label: 'かめ',       price: 15, move: 'slow' },
    ],

    // かぐやさん（第3弾の設計書2〜3節）。action: 自分のボタンの文字 / use: 住人が使う / sit: 上に乗って使う
    furnitureKinds: [
      { id: 'chair',  label: 'いす',       price: 5,  action: 'すわる',     use: true,  sit: true },
      { id: 'desk',   label: 'つくえ',     price: 5,  action: 'べんきょう', use: true,  sit: false },
      { id: 'sofa',   label: 'ソファ',     price: 10, action: 'ごろごろ',   use: true,  sit: true },
      { id: 'shelf',  label: 'ほんだな',   price: 10, action: 'よむ',       use: true,  sit: false },
      { id: 'tv',     label: 'テレビ',     price: 15, action: 'つける',     use: true,  sit: false },
      { id: 'bath',   label: 'おふろ',     price: 15, action: 'はいる',     use: true,  sit: true },
      { id: 'piano',  label: 'ピアノ',     price: 20, action: 'ひく',       use: true,  sit: false },
      { id: 'plush',  label: 'ぬいぐるみ', price: 5,  action: 'だっこ',     use: true,  sit: false },
      { id: 'flower', label: 'はな',       price: 3,  action: 'におう',     use: false, sit: false },
      { id: 'fridge', label: 'れいぞうこ', price: 15, action: null,         use: false, sit: false },
      // ゲームセンターの景品（第4弾の設計書3節）。prize: かぐやさんで売らない / petToy: ペットのおもちゃ / tries: かならず取れる回数
      { id: 'bigBear',     label: 'おおきいくま', action: 'だっこ',   use: true,  sit: false, prize: true, tries: 6 },
      { id: 'robot',       label: 'ロボット',     action: 'うごかす', use: true,  sit: false, prize: true, tries: 6 },
      { id: 'gameConsole', label: 'ゲームき',     action: 'あそぶ',   use: true,  sit: false, prize: true, tries: 5 },
      { id: 'mirrorBall',  label: 'ミラーボール', action: 'まわす',   use: true,  sit: false, prize: true, tries: 5 },
      { id: 'dino',        label: 'きょうりゅう', action: 'がおー',   use: true,  sit: false, prize: true, tries: 4 },
      { id: 'ball',        label: 'ボール',       action: 'ころがす', use: false, sit: false, prize: true, petToy: true, tries: 3 },
      { id: 'yarn',        label: 'けいとだま',   action: 'ころがす', use: false, sit: false, prize: true, petToy: true, tries: 3 },
      { id: 'frisbee',     label: 'フリスビー',   action: 'なげる',   use: false, sit: false, prize: true, petToy: true, tries: 3 },
    ],
    handMax: 3,                    // 手もちのハンバーガー
    fridgeMax: 99,                 // 冷蔵庫（全部で共通）
    homeRadius: 4,                 // 住人のベッドからの範囲（まっすぐの距離）
    furnitureUseMin: 20,           // 家具を使いに行く間隔（秒）
    furnitureUseMax: 40,
    furnitureUseTime: 8,           // 家具を使う長さ（秒）
    wishFirstMin: 50,              // 引っ越してから最初の「ほしい」まで（秒）
    wishFirstMax: 70,
    wishNextMin: 150,              // お礼のあと次の「ほしい」まで（秒）
    wishNextMax: 210,
    wishReward: 5,
    happinessMax: 5,
    tvGlowTime: 3,                 // テレビが光る長さ（秒）

    // ゲームセンター（第4弾の設計書3節）。場所 i の x は i（0〜4）、取り出し口は -1
    craneCost: 100,                // 台を建てる（消すと全額もどる）
    cranePlayPrice: 5,
    craneSlots: 5,
    craneStockMax: 3,
    craneCatchBase: 0.25,          // つかめる幅（場所1つぶんを1）
    craneCatchStep: 0.15,          // メーター1つごとに広がる幅
    craneArmSpeed: 1.5,            // 場所/秒
    craneDropTime: 1.2,            // アームが下りて上がるまで（秒）
    craneResultTime: 1.2,          // 結果を見せる長さ（秒）
    craneRefillInterval: 90,       // 自動の補充（秒に1つ）
    craneStockPay: 2,              // ならべる: 置いた数×2コイン
    craneVisitMin: 60,             // 住人が遊びに行く間隔（秒）
    craneVisitMax: 120,
    cranePlayTime: 10,             // 住人が遊ぶ長さ（秒）
    craneResidentWin: 0.25,        // 住人が景品を取る
    toyMin: 20,                    // ペットがおもちゃで遊びに行く間隔（秒）
    toyMax: 40,
    toyPlayTime: 5,
    toyLove: 1,

    // ガシャポン（第5弾の設計書3節）。台ごとに1シリーズ。trophy: そろえるともらえる
    gachaSeries: [
      { id: 'pet',  machine: 'gachaPet',  label: 'ペットガシャ',     trophy: 'trophyPet' },
      { id: 'town', machine: 'gachaTown', label: 'まちのひとガシャ', trophy: 'trophyTown' },
      { id: 'food', machine: 'gachaFood', label: 'たべものガシャ',   trophy: 'trophyFood' },
    ],
    // pet: 同じ種類のペット（見に来る）/ trophy: ガシャからは出ない
    figureKinds: [
      { id: 'figDog',            series: 'pet',  label: 'いぬ',       pet: 'dog' },
      { id: 'figCat',            series: 'pet',  label: 'ねこ',       pet: 'cat' },
      { id: 'figRabbit',         series: 'pet',  label: 'うさぎ',     pet: 'rabbit' },

<script>
// まちのマス目。床（floor）と上のもの（obj: wall/door/bed/counter/petCounter/furnitureCounter/crane/ガシャ台/かざりだな/家具）を1マスに1つずつ
(function (G) {
  const BLOCKING = { wall: true, bed: true, counter: true, petCounter: true, furnitureCounter: true, crane: true,
    gachaPet: true, gachaTown: true, gachaFood: true, figureShelf: true };
  const OBJECTS = ['wall', 'door', 'bed', 'counter', 'petCounter', 'furnitureCounter', 'crane',
    'gachaPet', 'gachaTown', 'gachaFood', 'figureShelf'];
  for (const k of G.config.furnitureKinds) { BLOCKING[k.id] = true; OBJECTS.push(k.id); } // 家具は全部通れない

  function create(w, h) {
    return { w, h, floor: new Array(w * h).fill(0), obj: new Array(w * h).fill(null) };
  }
  const inBounds = (wd, x, y) => x >= 0 && y >= 0 && x < wd.w && y < wd.h;
  const idx = (wd, x, y) => y * wd.w + x;
  const key = (x, y) => x + ',' + y;
  const parseKey = (k) => { const [x, y] = k.split(',').map(Number); return { x, y }; };

  function objAt(wd, x, y) { return inBounds(wd, x, y) ? wd.obj[idx(wd, x, y)] : null; }
  function hasFloor(wd, x, y) { return inBounds(wd, x, y) && wd.floor[idx(wd, x, y)] === 1; }

  function isPassable(wd, x, y) {
    if (!inBounds(wd, x, y)) return false;
    const o = wd.obj[idx(wd, x, y)];
    return !o || !BLOCKING[o.type];
  }

  // occupied: 人が立っているマスの key の Set
  // 戻り値: null なら置ける。置けないときは理由
  function canPlace(wd, x, y, kind, occupied) {
    if (!inBounds(wd, x, y)) return 'outside';
    const o = wd.obj[idx(wd, x, y)];
    if (o && o.own) return 'ownBed';
    if (kind === 'floor') return null;
    if (OBJECTS.indexOf(kind) < 0) return 'unknown';
    if (BLOCKING[kind] && occupied && occupied.has(key(x, y))) return 'occupied';
    return null;
  }

  function place(wd, x, y, kind, occupied) {
    const why = canPlace(wd, x, y, kind, occupied);
    if (why) return { ok: false, why };
    if (kind === 'floor') { wd.floor[idx(wd, x, y)] = 1; return { ok: true }; }
    const prev = wd.obj[idx(wd, x, y)];
    wd.obj[idx(wd, x, y)] = { type: kind };
    return { ok: true, removed: prev };
  }

  // 上のものがあればそれを、なければ床を消す。自分のベッドは消せない
  function erase(wd, x, y) {
    if (!inBounds(wd, x, y)) return { ok: false, why: 'outside' };
    const i = idx(wd, x, y), o = wd.obj[i];
    if (o && o.own) return { ok: false, why: 'ownBed' };
    if (o) { wd.obj[i] = null; return { ok: true, removed: o }; }
    if (wd.floor[i]) { wd.floor[i] = 0; return { ok: true, removed: { type: 'floor' } }; }
    return { ok: false, why: 'empty' };
  }

  function findAll(wd, type) {
    const out = [];
    for (let y = 0; y < wd.h; y++) for (let x = 0; x < wd.w; x++) {
      const o = wd.obj[idx(wd, x, y)];
      if (o && o.type === type) out.push({ x, y, own: !!o.own });
    }
    return out;
  }

  // (x, y) のまわり（となり・ななめ）にある type の物の key。なければ null
  function findAdjacent(wd, x, y, type) {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const o = objAt(wd, x + dx, y + dy);
      if (o && o.type === type) return key(x + dx, y + dy);
    }
    return null;
  }

  const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];
  function passableNeighbors(wd, x, y) {
    return DIRS.map(([dx, dy]) => ({ x: x + dx, y: y + dy })).filter(p => isPassable(wd, p.x, p.y));
  }

  G.world = { create, inBounds, key, parseKey, objAt, hasFloor, isPassable, canPlace, place, erase,
    findAll, findAdjacent, passableNeighbors, DIRS, BLOCKING, OBJECTS };
})(window.Game = window.Game || {});
</script>
<script>
// 壁をよける道さがし（4方向の幅優先）。計算だけで画面には関わらない
(function (G) {
  // start: {x,y}、goals: key の Set。いちばん近いゴールまでの道（start を含まない）を返す。行けなければ null
  function find(wd, start, goals) {
    const W = G.world;
    const sk = W.key(start.x, start.y);
    if (goals.has(sk)) return [];
    const prev = new Map([[sk, null]]);
    const queue = [start];
    for (let qi = 0; qi < queue.length; qi++) {
      const cur = queue[qi];
      for (const [dx, dy] of W.DIRS) {
        const nx = cur.x + dx, ny = cur.y + dy, nk = W.key(nx, ny);
        if (prev.has(nk) || !W.isPassable(wd, nx, ny)) continue;
        prev.set(nk, cur);
        if (goals.has(nk)) {
          const path = [{ x: nx, y: ny }];
          for (let p = cur; p && W.key(p.x, p.y) !== sk; p = prev.get(W.key(p.x, p.y))) path.unshift(p);
          return path;
        }
        queue.push({ x: nx, y: ny });
      }
    }
    return null;
  }
  const toKeys = (points) => new Set(points.map(p => G.world.key(p.x, p.y)));

  // まちの端のマス（住人が出入りする場所）
  function edgeKeys(wd) {
    const s = new Set();
    for (let x = 0; x < wd.w; x++) { s.add(G.world.key(x, 0)); s.add(G.world.key(x, wd.h - 1)); }
    for (let y = 0; y < wd.h; y++) { s.add(G.world.key(0, y)); s.add(G.world.key(wd.w - 1, y)); }
    return s;
  }

  G.pathfind = { find, toKeys, edgeKeys };
})(window.Game = window.Game || {});
</script>
<script>
// アルバイトの計算: 注文づくり・合っているかの判定・お金
(function (G) {
  const FILLINGS = ['patty', 'cheese', 'lettuce'];

  function layersFor(deliveries) {
    const c = G.config;
    return Math.min(c.orderMaxLayers, c.orderStartLayers + Math.floor(deliveries / c.deliveriesPerLevel));
  }

  // 下と上はいつもパン。あいだは具をランダムに
  function makeOrder(layers, rng) {
    const order = ['bun'];
    for (let i = 0; i < layers - 2; i++) order.push(FILLINGS[Math.floor(rng() * FILLINGS.length)]);
    order.push('bun');
    return order;
  }

  function addLayer(stack, item) {
    if (stack.length >= G.config.stackMax) return false;
    stack.push(item);
    return true;
  }
  function removeLayer(stack) { return stack.pop(); }

  function canDeliver(stack, order) {
    return !!order && stack.length === order.length && stack.every((s, i) => s === order[i]);
  }
  const reward = (order) => order.length;

  G.burgerJob = { FILLINGS, layersFor, makeOrder, addLayer, removeLayer, canDeliver, reward };
})(window.Game = window.Game || {});
</script>
<script>
// 自分の移動とおなかメーター
(function (G) {
  const R = 0.3; // 当たり判定の半径（マス）

  function create() {
    const c = G.config;
    return { x: c.ownBed.x, y: c.ownBed.y + 1, money: c.startMoney, hunger: c.hungerMax, walked: 0, face: 1, food: 0, hand: 0 };
  }

  const tile = (p) => ({ x: Math.round(p.x), y: Math.round(p.y) });

  function speed(p) {
    const c = G.config;
    return c.playerSpeed * (p.hunger <= 0 ? c.hungrySpeedRate : 1);
  }

  function fits(wd, x, y) {
    for (const cx of [x - R, x + R]) for (const cy of [y - R, y + R])
      if (!G.world.isPassable(wd, Math.round(cx), Math.round(cy))) return false;
    return true;
  }

  // vx, vy: 向き（長さ1まで）。歩いた分だけおなかが減る
  function move(p, wd, vx, vy, dt) {
    const len = Math.hypot(vx, vy);
    if (len === 0) return;
    if (len > 1) { vx /= len; vy /= len; }
    const s = speed(p) * dt;
    const ox = p.x, oy = p.y;
    if (fits(wd, p.x + vx * s, p.y)) p.x += vx * s;
    if (fits(wd, p.x, p.y + vy * s)) p.y += vy * s;
    if (vx !== 0) p.face = vx > 0 ? 1 : -1;
    addWalk(p, Math.hypot(p.x - ox, p.y - oy));
  }

  function addWalk(p, dist) {
    const c = G.config;
    p.walked += dist;
    while (p.walked >= c.tilesPerHunger) {
      p.walked -= c.tilesPerHunger;
      p.hunger = Math.max(0, p.hunger - 1);
    }
  }

  function eat(p) { p.hunger = Math.min(G.config.hungerMax, p.hunger + G.config.burgerHeal); }

  // 自分から maxDist マス以内でいちばん近いもの（住人・ペット）。いなければ null
  function nearest(p, list, maxDist) {
    let best = null, bd = maxDist;
    for (const o of list) {
      const d = Math.hypot(o.x - p.x, o.y - p.y);
      if (d <= bd) { best = o; bd = d; }
    }
    return best;
  }

  G.player = { create, tile, speed, move, addWalk, eat, fits, nearest };
})(window.Game = window.Game || {});
</script>
<script>
// ハンバーガー屋: カウンター1つがお店1軒。店員・行列・売り買い・アルバイト
(function (G) {
  const W = () => G.world;

  // カウンターの数とお店の記録をそろえる
  function reconcile(s) {
    const keys = new Set(W().findAll(s.world, 'counter').map(p => W().key(p.x, p.y)));
    for (const k of keys) if (!s.shops[k]) s.shops[k] = { serveTimer: 0 };
    for (const k of Object.keys(s.shops)) if (!keys.has(k)) delete s.shops[k];
    if (s.job.active && !keys.has(s.job.counter)) endJob(s);
  }

  // お客さんが立てるマス（アルバイト中は自分が立っているマスを除く）
  function spotsFor(s, k) {
    const { x, y } = W().parseKey(k);
    let spots = W().passableNeighbors(s.world, x, y);
    if (s.job.active && s.job.counter === k) {
      const pt = G.player.tile(s.player);
      spots = spots.filter(p => p.x !== pt.x || p.y !== pt.y);
    }
    return spots.slice(0, G.config.queueMax);
  }

  function front(s, k) {
    let best = null;
    for (const r of s.residents)
      if (r.state === 'queued' && r.shopKey === k && (!best || r.queuedAt < best.queuedAt)) best = r;
    return best;
  }

  function update(s, dt) {
    for (const k of Object.keys(s.shops)) {
      const shop = s.shops[k], f = front(s, k);
      if (!f) { shop.serveTimer = 0; continue; }
      if (s.job.active && s.job.counter === k) {
        if (s.job.customerId !== f.id) {
          s.job.customerId = f.id;
          s.job.order = G.burgerJob.makeOrder(G.burgerJob.layersFor(s.job.deliveries), G.rng);
          s.job.stack = [];
        }
        continue;
      }
      shop.serveTimer += dt;
      if (shop.serveTimer >= G.config.clerkServeTime) {
        shop.serveTimer = 0;
        G.residents.served(s, f);
      }
    }
  }

  // 自分のまわり（となり・ななめ）にあるカウンター
  function nearCounter(s) {
    const pt = G.player.tile(s.player);
    return W().findAdjacent(s.world, pt.x, pt.y, 'counter');
  }

  function buy(s) {
    const c = G.config;
    if (s.player.money < c.burgerPrice) return { ok: false, why: 'money' };
    s.player.money -= c.burgerPrice;
    G.player.eat(s.player);
    return { ok: true };
  }

  // もちかえる: 手もちに足す（handMax まで）
  function buyToGo(s) {
    const c = G.config;
    if (s.player.hand >= c.handMax) return { ok: false, why: 'hand' };
    if (s.player.money < c.burgerPrice) return { ok: false, why: 'money' };
    s.player.money -= c.burgerPrice;
    s.player.hand++;
    return { ok: true };
  }

  function startJob(s, k) {
    Object.assign(s.job, { active: true, counter: k, customerId: null, order: null, stack: [] });
  }
  function endJob(s) {
    Object.assign(s.job, { active: false, counter: null, customerId: null, order: null, stack: [] });
  }

    const j = s.job;

  const nextTimer = (rng) => between(C().wishNextMin, C().wishNextMax, rng);

  // (bed のまわり) 範囲にある家具をすべて { x, y, kind }
  function nearbyFurniture(s, bed) {

    for (let y = bed.y - R; y <= bed.y + R; y++) for (let x = bed.x - R; x <= bed.x + R; x++) {
      if (Math.hypot(x - bed.x, y - bed.y) > R) continue;
      const o = G.world.objAt(s.world, x, y);
      if (o && G.furniture.kindOf(o.type)) out.push({ x, y, kind: o.type });

    return cands.length ? cands[Math.floor(rng() * cands.length)].id : null;
  }

    r.wishTimer = nextTimer(rng);

<script>
// クレーンゲームの計算（画面には関わらない）: つかめる幅・つかめたか・補充する景品選び・ならべるの見本
// 場所 i の x 座標は i（0〜4）。取り出し口とアームの出発点は x = -1
// しっぱいはない: 外すほど幅が広がり、景品ごとの回数で必ずつかめる。つかめたかに乱数は使わない
(function (G) {
  const C = () => G.config;
  const ARM_START = -1;

  const prizeIds = () => C().furnitureKinds.filter(k => k.prize).map(k => k.id);
  const triesOf = (id) => G.furniture.kindOf(id).tries;
  const unowned = (unlocked) => prizeIds().filter(id => unlocked.indexOf(id) < 0);
  const count = (slots) => slots.filter(Boolean).length;
  const emptySlots = () => new Array(C().craneSlots).fill(null);

  const catchWidth = (meter) => C().craneCatchBase + C().craneCatchStep * meter;

  // アームにいちばん近い、景品の入っている場所。なければ -1（同じ近さなら左）
  function nearestSlot(slots, armX) {
    let best = -1, bd = Infinity;
    slots.forEach((id, i) => {
      if (!id) return;
      const d = Math.abs(i - armX);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }

  // つかめたら { index, id }、つかめなければ null
  function willCatch(slots, armX, meter) {
    const i = nearestSlot(slots, armX);
    if (i < 0) return null;
    const id = slots[i];
    if (meter >= triesOf(id) - 1 || Math.abs(i - armX) <= catchWidth(meter)) return { index: i, id };
    return null;
  }

  // 空いている場所を n 個ランダムに選んで景品を入れた、新しい配列を返す
  // 台の中にまだ持っていない景品がなく、まだ持っていない景品があるなら、1つ目をそこから選ぶ
  function fill(slots, n, unlocked, rng) {
    const out = slots.slice();
    const empty = [];
    out.forEach((id, i) => { if (!id) empty.push(i); });
    const all = prizeIds(), un = unowned(unlocked);
    const needNew = un.length && !out.some(id => id && un.indexOf(id) >= 0);
    for (let k = 0; k < n && empty.length; k++) {
      const i = empty.splice(Math.floor(rng() * empty.length), 1)[0];
      const pool = k === 0 && needNew ? un : all;
      out[i] = pool[Math.floor(rng() * pool.length)];
    }
    return out;
  }

  // ならべるの見本。target: 3つになったあとの台 / todo: 新しく置く場所（左から）
  function stockPlan(slots, unlocked, rng) {

    target.forEach((id, i) => { if (id && !slots[i]) todo.push(i); });

<script>
// ゲームセンター: クレーン台1つが1台。建てる（お金）・消えたら返金・あそぶ・ならべる・自動の補充
// 台の記録 s.cranes[key] = { slots: [id|null ×5], meter, refillTimer, paid }
// 遊んでいる・ならべている途中は s.cranePlay（セーブしない）
(function (G) {
  const W = () => G.world, C = () => G.config, CG = () => G.craneGame;

  function newRecord(s, paid) {
    return { slots: CG().fill(CG().emptySlots(), C().craneStockMax, s.unlocked, G.rng), meter: 0, refillTimer: 0, paid };
  }

  // マスの台と記録をそろえる。マスから消えた台は払ったお金を返す。戻り値は返したお金の合計
  function reconcile(s) {
    const keys = new Set(W().findAll(s.world, 'crane').map(p => W().key(p.x, p.y)));
    for (const k of keys) if (!s.cranes[k]) s.cranes[k] = newRecord(s, 0);
    let refund = 0;
    for (const k of Object.keys(s.cranes)) {
      if (keys.has(k)) continue;
      refund += s.cranes[k].paid || 0;
      delete s.cranes[k];
      if (s.cranePlay && s.cranePlay.key === k) s.cranePlay = null;
    }
    s.player.money += refund;
    return refund;
  }

  // 台を建てる。お金が足りなければ置かない。台の上に台を置いても何も変わらない
  function build(s, x, y) {
    const o = W().objAt(s.world, x, y);
    if (o && o.type === 'crane') return { ok: true, same: true };
    if (s.player.money < C().craneCost) return { ok: false, why: 'money' };
    const res = W().place(s.world, x, y, 'crane', G.state.occupied(s));
    if (!res.ok) return res;
    s.player.money -= C().craneCost;
    s.cranes[W().key(x, y)] = newRecord(s, C().craneCost);
    return res;
  }

  // 自分のまわり（となり・ななめ）の台の key。なければ null
  function near(s) {
    const pt = G.player.tile(s.player);
    return W().findAdjacent(s.world, pt.x, pt.y, 'crane');
  }

  const count = (rec) => CG().count(rec.slots);
  // その台で遊んでいる住人
  const playerOf = (s, k) => s.residents.find(r => r.state === 'playingMachine' && r.machineKey === k) || null;

  // 自分が遊べないわけ: 'empty' | 'busy' | 'money' | null
  function playBlock(s, k) {
    const rec = s.cranes[k];
    if (!rec || !count(rec)) return 'empty';
    if (playerOf(s, k)) return 'busy';
    if (s.player.money < C().cranePlayPrice) return 'money';
    return null;
  }
  function stockBlock(s, k) {
    const rec = s.cranes[k];
    if (!rec || count(rec) >= C().craneStockMax) return 'full';
    if (playerOf(s, k)) return 'busy';
    return null;
  }

  // あそぶ: 5コイン払って始める
  function startPlay(s, k) {
    const why = playBlock(s, k);
    if (why) return { ok: false, why };
    s.player.money -= C().cranePlayPrice;
    s.cranePlay = { key: k, mode: 'play', armX: CG().ARM_START, phase: 'ready', t: 0, holding: false, result: null };
    G.residents.leaveMachine(s, k);
    return { ok: true };
  }

  // 「→」を押している/離した
  function hold(s, on) {
    const cp = s.cranePlay;
    if (!cp || cp.mode !== 'play') return;
    cp.holding = on;
    if (on && cp.phase === 'ready') cp.phase = 'moving';
  }

  // やめる: アームを動かす前ならお金をもどす
  function cancel(s) {
    const cp = s.cranePlay;
    if (!cp || cp.mode !== 'play') return { ok: false };
    if (cp.phase !== 'ready') return { ok: false, why: 'moving' };
    s.player.money += C().cranePlayPrice;
    s.cranePlay = null;
    return { ok: true, refund: C().cranePlayPrice };
  }

  // アームが下りたところで、つかめたか決める
  function resolve(s, cp) {
    const rec = s.cranes[cp.key];
    const got = CG().willCatch(rec.slots, cp.armX, rec.meter);
    if (got) {
      rec.slots[got.index] = null;
      const isNew = !G.furniture.isUnlocked(s, got.id);
      G.furniture.unlock(s, got.id);
      rec.meter = 0;
      for (const p of s.pets) if (p.follow) p.trick = { id: 'jump', until: s.time + C().trickTime };
      cp.result = { caught: true, id: got.id, index: got.index, isNew };
    } else {

  function updatePlay(s, cp, dt) {
    const c = C();
    if (cp.phase === 'moving') {
      if (cp.holding) cp.armX = Math.min(c.craneSlots - 1, cp.armX + c.craneArmSpeed * dt);
      else { cp.phase = 'dropping'; cp.t = 0; }
    } else if (cp.phase === 'dropping') {
      cp.t += dt;
      if (cp.t >= c.craneDropTime) { resolve(s, cp); cp.phase = 'result'; cp.t = 0; }
    } else if (cp.phase === 'result') {
      cp.t += dt;
      if (cp.t >= c.craneResultTime) s.cranePlay = null;
    }
  }

  // ならべる: 見本を作って始める
  function startStock(s, k) {
    const why = stockBlock(s, k);
    if (why) return { ok: false, why };
    const plan = CG().stockPlan(s.cranes[k].slots, s.unlocked, G.rng);
    s.cranePlay = { key: k, mode: 'stock', target: plan.target, todo: plan.todo, done: 0 };
    G.residents.leaveMachine(s, k);
    return { ok: true };
  }

  // 光っている場所に id を置く。違う絵なら何も変わらない
  function stockPick(s, id) {
    const cp = s.cranePlay;
    if (!cp || cp.mode !== 'stock') return { ok: false };
    if (cp.target[cp.todo[cp.done]] !== id) return { ok: false, why: 'wrong' };
    cp.done++;
    if (cp.done < cp.todo.length) return { ok: true, finished: false };
    s.cranes[cp.key].slots = cp.target.slice();
    const reward = C().craneStockPay * cp.todo.length;
    s.player.money += reward;
    s.cranePlay = null;
    return { ok: true, finished: true, reward };
  }

  function cancelStock(s) {
    if (s.cranePlay && s.cranePlay.mode === 'stock') s.cranePlay = null;
  }

  function update(s, dt) {
    const cp = s.cranePlay, c = C();
    if (cp && cp.mode === 'play') updatePlay(s, cp, dt);
    // 自動の補充。自分が遊んでいる・ならべている台は止める
    for (const k of Object.keys(s.cranes)) {
      const rec = s.cranes[k];
      if (count(rec) >= c.craneStockMax) { rec.refillTimer = 0; continue; }
      if (s.cranePlay && s.cranePlay.key === k) continue;
      rec.refillTimer += dt;
      if (rec.refillTimer >= c.craneRefillInterval) {

  }

  // 読み込んだとき: 台のないマスの記録は（返金せずに）消す。知らない景品は空にする
  function restore(s) {
    s.cranePlay = null;

    for (const k of Object.keys(s.cranes)) {
      const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y), rec = s.cranes[k];

      if (typeof rec.meter !== 'number') rec.meter = 0;
      if (typeof rec.refillTimer !== 'number') rec.refillTimer = 0;
      if (typeof rec.paid !== 'number') rec.paid = 0;
    }
  }

  G.crane = { reconcile, build, near, count, playerOf, playBlock, stockBlock, startPlay, hold, cancel,
    startStock, stockPick, cancelStock, update, restore };
})(window.Game = window.Game || {});
</script>
<script>
// ガシャポンの計算だけ: どのフィギュアが出るか（続けてダブった回数で必ず NEW）、シリーズがそろったか
// owned は { id: 数 }。乱数は引数でもらう
(function (G) {
  const C = () => G.config;

  const kindOf = (id) => C().figureKinds.find(k => k.id === id) || null;
  const seriesInfo = (series) => C().gachaSeries.find(x => x.id === series) || null;
  const seriesOfMachine = (type) => { const x = C().gachaSeries.find(g => g.machine === type); return x ? x.id : null; };
  const isMachine = (type) => !!seriesOfMachine(type);
  // ガシャから出るフィギュア（トロフィーは入らない）
  const seriesFigures = (series) => C().figureKinds.filter(k => k.series === series && !k.trophy).map(k => k.id);
  const seriesOf = (id) => { const k = kindOf(id); return k ? k.series : null; };
  const trophyOf = (series) => { const x = seriesInfo(series); return x ? x.trophy : null; };
  const has = (owned, id) => (owned[id] || 0) > 0;
  const missing = (series, owned) => seriesFigures(series).filter(id => !has(owned, id));
  const isComplete = (series, owned) => missing(series, owned).length === 0;

  function pick(series, owned, streak, rng) {
    const miss = missing(series, owned);
    const pool = streak >= C().gachaPityAt && miss.length ? miss : seriesFigures(series);
    return pool[Math.floor(rng() * pool.length)];
  }

  G.gachaLogic = { kindOf, seriesInfo, seriesOfMachine, isMachine, seriesFigures, seriesOf, trophyOf, missing, isComplete, pick };
})(window.Game = window.Game || {});

<script>

(function (G) {

    const keys = new Set(W().findAll(s.world, 'figureShelf').map(p => W().key(p.x, p.y)));
    for (const k of keys) if (!s.shelves[k]) s.shelves[k] = emptyShelf();
    for (const k of Object.keys(s.shelves)) if (!keys.has(k)) delete s.shelves[k];
  }

  // 読み込んだとき: 知らない id・おかしい数を取り除く
  function restore(s) {
    const known = (id) => !!GL().kindOf(id);
    const figs = s.figures && typeof s.figures === 'object' ? s.figures : {};
    s.figures = {};
    for (const [id, n] of Object.entries(figs)) if (known(id) && Number.isInteger(n) && n >= 1) s.figures[id] = n;
    const st = s.streak && typeof s.streak === 'object' ? s.streak : {};
    s.streak = {};
    for (const g of C().gachaSeries) s.streak[g.id] = Number.isInteger(st[g.id]) && st[g.id] >= 0 ? st[g.id] : 0;
    const shelves = s.shelves && typeof s.shelves === 'object' ? s.shelves : {};
    s.shelves = {};
    for (const [k, sh] of Object.entries(shelves)) {
      const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y);
      if (!o || o.type !== 'figureShelf' || !Array.isArray(sh)) continue;
      s.shelves[k] = emptyShelf().map((_, i) => (known(sh[i]) && count(s, sh[i]) ? sh[i] : null));
    }
  }

  G.figures = { count, add, giftable, give, residentAdd, shelfAt, nearShelf, setSlot, reconcile, restore };
})(window.Game = window.Game || {});

<script>
// ガシャポン: シリーズごとのガシャ台（gachaPet / gachaTown / gachaFood）。建てる（お金）・消えたら返金・まわす・カプセル
// 台の記録 s.gachas[key] = { paid }。まわしている途中は s.gachaPlay（セーブしない）
// 住人が遊ぶと、台の近くに空のカプセル（s.capsules = ["x,y"]）を落とす。自分が入ると拾ってお金
(function (G) {
  const W = () => G.world, C = () => G.config, GL = () => G.gachaLogic;

  const machineKeys = (s) => {
    const out = [];
    for (const g of C().gachaSeries) for (const p of W().findAll(s.world, g.machine)) out.push(W().key(p.x, p.y));
    return out;
  };

  // k のマスの台のシリーズ。台でなければ null
  function seriesAt(s, k) {
    const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y);
    return o ? GL().seriesOfMachine(o.type) : null;
  }

  // マスの台と記録をそろえる。マスから消えた台は払ったお金を返す。通れなくなったマスのカプセルを消す。戻り値は返したお金
  function reconcile(s) {
    const keys = new Set(machineKeys(s));
    for (const k of keys) if (!s.gachas[k]) s.gachas[k] = { paid: 0 };
    let refund = 0;
    for (const k of Object.keys(s.gachas)) {
      if (keys.has(k)) continue;
      refund += s.gachas[k].paid || 0;
      delete s.gachas[k];
      if (s.gachaPlay && s.gachaPlay.key === k) s.gachaPlay = null;
    }
    s.player.money += refund;
    s.capsules = s.capsules.filter(k => { const { x, y } = W().parseKey(k); return W().isPassable(s.world, x, y); });
    return refund;
  }

  // 台を建てる。同じ種類の台の上なら何も変わらない。別のガシャ台の上なら、払ってから前の台のお金を返す
  function build(s, x, y, type) {
    const o = W().objAt(s.world, x, y);
    if (o && o.type === type) return { ok: true, same: true };
    if (s.player.money < C().gachaCost) return { ok: false, why: 'money' };
    const res = W().place(s.world, x, y, type, G.state.occupied(s));
    if (!res.ok) return res;
    const k = W().key(x, y), old = s.gachas[k];
    s.player.money -= C().gachaCost;
    let refund = 0;
    if (old) { refund = old.paid || 0; s.player.money += refund; if (s.gachaPlay && s.gachaPlay.key === k) s.gachaPlay = null; }
    s.gachas[k] = { paid: C().gachaCost };
    return Object.assign(res, { refund });
  }

  // 自分のまわり（となり・ななめ）の台で、いちばん近いものの key。なければ null
  function near(s) {
    const p = s.player, pt = G.player.tile(p);
    let best = null, bd = Infinity;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = pt.x + dx, y = pt.y + dy, o = W().objAt(s.world, x, y);
      if (!o || !GL().isMachine(o.type)) continue;
      const d = Math.hypot(x - p.x, y - p.y);
      if (d < bd) { bd = d; best = W().key(x, y); }
    }
    return best;
  }

  // その台で遊んでいる住人
  const playerOf = (s, k) => s.residents.find(r => r.state === 'playingMachine' && r.machineKey === k) || null;

  // 画面を開けないわけ: 'busy' | null。まわせないわけ: 'money' | null
  const openBlock = (s, k) => (playerOf(s, k) ? 'busy' : null);
  const turnBlock = (s) => (s.player.money < C().gachaPlayPrice ? 'money' : null);

  // ガシャの画面を開く（お金はまだ減らない）。向かっている住人は家に帰る
  function open(s, k) {
    if (!s.gachas[k]) return { ok: false };
    const why = openBlock(s, k);
    if (why) return { ok: false, why };
    s.gachaPlay = { key: k, phase: 'ready', t: 0, result: null };
    G.residents.leaveMachine(s, k);
    return { ok: true };
  }

  // ぐるっ: 3コイン払ってハンドルを回す（結果が出たあとなら「もういっかい」）
  function turn(s) {
    const gp = s.gachaPlay;
    if (!gp || (gp.phase !== 'ready' && gp.phase !== 'open')) return { ok: false };
    const why = turnBlock(s);
    if (why) return { ok: false, why };
    s.player.money -= C().gachaPlayPrice;
    Object.assign(gp, { phase: 'turning', t: 0, result: null });
    return { ok: true };
  }

  // カプセルを開ける: 出るものを決めて、持っている数・続けてダブった回数・トロフィー
  function crack(s) {
    const gp = s.gachaPlay;
    if (!gp || (gp.phase !== 'turning' && gp.phase !== 'capsule')) return null;
    const series = seriesAt(s, gp.key);
    const id = GL().pick(series, s.figures, s.streak[series] || 0, G.rng);
    const res = G.figures.add(s, id);
    s.streak[series] = res.isNew ? 0 : (s.streak[series] || 0) + 1;
    const pet = GL().kindOf(id).pet;
    if (pet) for (const p of s.pets) if (p.follow && p.kind === pet) p.trick = { id: 'jump', until: s.time + C().trickTime };
    gp.result = { id, isNew: res.isNew, trophy: res.trophy };
    gp.phase = 'open';
    return gp.result;
  }

  // とじる: 開ける前なら、開けたことにしてから閉じる。戻り値はそのときの結果（なければ null）
  function close(s) {
    const gp = s.gachaPlay;
    if (!gp) return null;
    const res = gp.phase === 'turning' || gp.phase === 'capsule' ? crack(s) : null;
    s.gachaPlay = null;
    return res;
  }

  // 住人が遊び終わった: 台の近くの通れる空いたマスに、空のカプセルを1つ落とす
  function dropCapsule(s, k) {
    const c = C();
    if (s.capsules.length >= c.capsuleMax) return null;
    const { x: mx, y: my } = W().parseKey(k), R = c.capsuleRange;
    const occ = G.state.occupied(s), have = new Set(s.capsules), cands = [];
    for (let y = my - R; y <= my + R; y++) for (let x = mx - R; x <= mx + R; x++) {
      const kk = W().key(x, y);
      if (W().isPassable(s.world, x, y) && !occ.has(kk) && !have.has(kk)) cands.push(kk);
    }
    if (!cands.length) return null;
    const kk = cands[Math.floor(G.rng() * cands.length)];
    s.capsules.push(kk);
    return kk;
  }

  // 自分のいるマスのカプセルを拾う
  function pickUp(s) {
    const pt = G.player.tile(s.player), k = W().key(pt.x, pt.y), i = s.capsules.indexOf(k);
    if (i < 0) return false;
    s.capsules.splice(i, 1);
    s.player.money += C().capsuleReward;
    G.state.emit({ type: 'capsule', reward: C().capsuleReward });
    return true;
  }

  function update(s, dt) {
    const gp = s.gachaPlay;
    if (gp && gp.phase === 'turning') {
      gp.t += dt;
      if (gp.t >= C().gachaTurnTime) gp.phase = 'capsule';
    }
    pickUp(s);
  }

  // 読み込んだとき: 台のないマスの記録は（返金せずに）消す。地図の外・通れないマスのカプセルを消す
  function restore(s) {
    s.gachaPlay = null;
    const gs = s.gachas && typeof s.gachas === 'object' ? s.gachas : {};
    s.gachas = {};
    for (const [k, rec] of Object.entries(gs)) {
      if (!seriesAt(s, k) || !rec) continue;
      s.gachas[k] = { paid: typeof rec.paid === 'number' ? rec.paid : 0 };
    }
    const caps = Array.isArray(s.capsules) ? s.capsules : [];
    const seen = new Set();
    s.capsules = caps.filter(k => {
      if (typeof k !== 'string' || seen.has(k)) return false;
      seen.add(k);
      const { x, y } = W().parseKey(k);
      return Number.isInteger(x) && Number.isInteger(y) && W().isPassable(s.world, x, y);
    });
  }

  G.gacha = { seriesAt, reconcile, build, near, playerOf, openBlock, turnBlock, open, turn, crack, close,
    dropCapsule, pickUp, update, restore };
})(window.Game = window.Game || {});
</script>
<script>
// 住人: ベッドを置くと引っ越してくる。家とハンバーガー屋を行き来する
// 状態: arriving → home → toShop → queued → returning → home … / ベッドが消えたら leaving
//       家にいるとき、ときどき home → toFurniture → using → returning（家の近くの家具を使う）
//       ときどき home → toMachine → playingMachine → returning（クレーン台かガシャ台で遊ぶ）
//       クレーン: 景品を取ると gift にして、はなすとくれる / ガシャ: フィギュアが figures に入り、カプセルを落とす
(function (G) {
  const W = () => G.world, P = () => G.pathfind;
  const NAMES = ['たろう', 'はなこ', 'けんた', 'さくら', 'ゆうと', 'みさき', 'そうた', 'あおい',
    'りく', 'ひなた', 'こうき', 'ゆい', 'はると', 'めい', 'だいち', 'のぞみ'];

  const LINES = {
    normal: ['いいまちだね', 'きょうも いいてんき！', 'このまち すきだよ'],
    hungry: ['おなかすいた〜', 'ハンバーガー たべたいな'],
    ate: ['ハンバーガー おいしかった！', 'おなか いっぱい！'],
    noShop: ['ハンバーガーやさんが あればなあ'],
    cantReach: ['おみせに いけないよ〜'],
    full: ['おみせ こんでるね。あとで いこう'],
    happy: ['まいにち たのしい！', 'このまち だいすき！'],
    allSet: ['すてきな おうちで うれしい！'],
  };

  const bedKey = (r) => W().key(r.bed.x, r.bed.y);
  const tileOf = (r) => ({ x: Math.round(r.x), y: Math.round(r.y) });

  // 家の前のマス（ベッドのとなりで通れるところ）。なければベッドの上
  function homeSpot(s, r) {
    return W().passableNeighbors(s.world, r.bed.x, r.bed.y)[0] || { x: r.bed.x, y: r.bed.y };
  }

  function create(s, bed) {
    const id = s.nextId++;
    const looks = G.sprites.residentLooks;
    const r = {
      id, name: NAMES[(id - 1) % NAMES.length], look: looks[Math.floor(G.rng() * looks.length)],
      bed: { x: bed.x, y: bed.y }, x: 0, y: 0, path: [], goal: null, state: 'arriving',
      mood: 'normal', shopKey: null, spot: null, queuedAt: 0, lastServed: -1e9,
      hungerTimer: G.config.residentHungerInterval * (0.3 + 0.4 * G.rng()), pullBlockedUntil: 0,
      wish: null, wishTimer: G.wishes.firstTimer(G.rng), happiness: 0,
      useTimer: useInterval(), useKey: null, useFrom: null, useUntil: 0,
      visitTimer: visitInterval(), machineKey: null, machineUntil: 0, gift: null, figures: [],
    };
    const home = homeSpot(s, r);
    const out = P().find(s.world, home, P().edgeKeys(s.world));
    const start = out && out.length ? out[out.length - 1] : home;
    r.x = start.x; r.y = start.y;
    setGoal(s, r, home);
    s.residents.push(r);
    return r;
  }

  const useInterval = () => { const c = G.config; return c.furnitureUseMin + (c.furnitureUseMax - c.furnitureUseMin) * G.rng(); };
  const visitInterval = () => { const c = G.config; return c.craneVisitMin + (c.craneVisitMax - c.craneVisitMin) * G.rng(); };

  // 家具の上に座っていたら、となりのマスへ戻る。使っている家具・台をはなす
  function standUp(r) {
    if (r.useFrom) { r.x = r.useFrom.x; r.y = r.useFrom.y; }
    r.useFrom = null; r.useKey = null; r.machineKey = null;
  }

  // useKey の家具がまだあるか
  function furnitureAt(s, k) {
    if (!k) return null;
    const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y);
    return o && G.furniture.kindOf(o.type) ? G.furniture.kindOf(o.type) : null;
  }

  // 家の近くの家具（住人が使うもの・ほかの人が使っていないもの）へ向かう。行けなければ false
  function goFurniture(s, r) {
    const taken = new Set(s.residents.filter(o => o !== r && o.useKey).map(o => o.useKey));
    const cands = G.wishes.nearbyFurniture(s, r.bed)
      .filter(f => G.furniture.kindOf(f.kind).use && !taken.has(W().key(f.x, f.y)));
    while (cands.length) {
      const f = cands.splice(Math.floor(G.rng() * cands.length), 1)[0];
      const goals = new Set(W().passableNeighbors(s.world, f.x, f.y).map(p => W().key(p.x, p.y)));
      const path = goals.size && P().find(s.world, tileOf(r), goals);
      if (!path) continue;
      r.useKey = W().key(f.x, f.y);
      r.goal = path.length ? path[path.length - 1] : tileOf(r);
      r.path = path;
      r.state = 'toFurniture';
      return true;
    }
    return false;
  }

  // 着いた: 座る家具なら上に乗る
  function startUsing(s, r) {
    const kind = furnitureAt(s, r.useKey);
    r.state = 'using';
    r.useUntil = s.time + G.config.furnitureUseTime;
    if (kind && kind.sit) {
      r.useFrom = tileOf(r);
      const { x, y } = W().parseKey(r.useKey);
      r.x = x; r.y = y;
    }
  }

  // k のマスの台の種類: 'crane' | 'gacha' | null
  function machineAt(s, k) {
    if (!k) return null;
    const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y);
    if (!o) return null;
    if (o.type === 'crane') return s.cranes[k] ? 'crane' : null;
    return G.gachaLogic.isMachine(o.type) && s.gachas[k] ? 'gacha' : null;
  }

  // 遊びに行ける台（ほかの人が向かっていない・遊んでいない・自分が使っていない）へ向かう。距離の決まりはない
  // クレーンは景品が入っていて、自分が gift を持っていないときだけ。ガシャはいつでも
  function goMachine(s, r) {
    const taken = new Set(s.residents.filter(o => o !== r && o.machineKey).map(o => o.machineKey));
    if (s.cranePlay) taken.add(s.cranePlay.key);
    if (s.gachaPlay) taken.add(s.gachaPlay.key);
    const cands = [];
    if (!r.gift) for (const k of Object.keys(s.cranes)) if (G.crane.count(s.cranes[k])) cands.push(k);
    for (const k of Object.keys(s.gachas)) cands.push(k);
    const free = cands.filter(k => !taken.has(k));
    while (free.length) {
      const k = free.splice(Math.floor(G.rng() * free.length), 1)[0];
      const { x, y } = W().parseKey(k);
      const goals = new Set(W().passableNeighbors(s.world, x, y).map(p => W().key(p.x, p.y)));
      const path = goals.size && P().find(s.world, tileOf(r), goals);
      if (!path) continue;
      r.machineKey = k;
      r.goal = path.length ? path[path.length - 1] : tileOf(r);
      r.path = path;
      r.state = 'toMachine';
      return true;
    }
    return false;
  }

  // 自分がその台を使い始めた: 向かっている住人は家に帰る
  function leaveMachine(s, k) {
    for (const r of s.residents) if (r.state === 'toMachine' && r.machineKey === k) goHome(s, r);
  }

  // 着いた: 遊べるなら遊び始める。自分が使っている・ほかの人が遊んでいる・クレーンがからっぽなら帰る
  function arriveMachine(s, r) {
    const k = r.machineKey, type = machineAt(s, k);
    const mine = (s.cranePlay && s.cranePlay.key === k) || (s.gachaPlay && s.gachaPlay.key === k);
    const other = s.residents.some(o => o !== r && o.state === 'playingMachine' && o.machineKey === k);
    if (!type || mine || other || (type === 'crane' && !G.crane.count(s.cranes[k]))) { goHome(s, r); return; }
    r.state = 'playingMachine';
    r.machineUntil = s.time + (type === 'crane' ? G.config.cranePlayTime : G.config.gachaPlayTime);
  }

  // 遊び終わり。クレーン: ときどき景品を1つ取る / ガシャ: フィギュアが1つ入り、カプセルを落とす
  function finishMachine(s, r) {
    const k = r.machineKey, type = machineAt(s, k);
    if (type === 'crane') {
      const rec = s.cranes[k];
      if (G.crane.count(rec) && G.rng() < G.config.craneResidentWin) {
        const full = [];
        rec.slots.forEach((id, i) => { if (id) full.push(i); });
        const i = full[Math.floor(G.rng() * full.length)];
        r.gift = rec.slots[i];
        rec.slots[i] = null;
      }
    } else if (type === 'gacha') {
      const figs = G.gachaLogic.seriesFigures(G.gacha.seriesAt(s, k));
      G.figures.residentAdd(r, figs[Math.floor(G.rng() * figs.length)]);
      G.gacha.dropCapsule(s, k);
    }
    goHome(s, r);
  }

  // 目的地を決めて道を引く。行けなければ false
  function setGoal(s, r, goal) {
    const path = P().find(s.world, tileOf(r), new Set([W().key(goal.x, goal.y)]));
    if (!path) return false;
    r.goal = { x: goal.x, y: goal.y };
    r.path = path;
    return true;
  }

  // 道にそって歩く。'moving' | 'arrived' | 'blocked'
  function walk(s, r, dt) {
    let left = G.config.residentSpeed * dt;
    while (left > 0 && r.path.length) {
      const t = r.path[0];
      if (!W().isPassable(s.world, t.x, t.y)) {
        if (!r.goal || !setGoal(s, r, r.goal)) return 'blocked';
        continue;
      }
      const dx = t.x - r.x, dy = t.y - r.y, d = Math.hypot(dx, dy);
      if (d <= left) { r.x = t.x; r.y = t.y; r.path.shift(); left -= d; }
      else { r.x += dx / d * left; r.y += dy / d * left; left = 0; }
    }
    return r.path.length ? 'moving' : 'arrived';
  }

  function warpHome(s, r) {
    standUp(r);
    const h = homeSpot(s, r);
    Object.assign(r, { x: h.x, y: h.y, path: [], goal: null, state: 'home', shopKey: null, spot: null });
  }

  function goHome(s, r) {
    standUp(r);
    r.shopKey = null; r.spot = null;
    r.state = 'returning';
    if (!setGoal(s, r, homeSpot(s, r))) warpHome(s, r);
  }

  function startLeaving(s, r) {
    standUp(r);
    r.state = 'leaving'; r.shopKey = null; r.spot = null;
    const path = P().find(s.world, tileOf(r), P().edgeKeys(s.world));
    if (!path) { r.gone = true; return; }
    r.path = path;
    r.goal = path.length ? path[path.length - 1] : null;
  }

  // お店へ向かう。onlyKey があればそのお店だけ。行けなければ mood を変えて false
  function goShop(s, r, onlyKey) {
    const keys = onlyKey ? [onlyKey] : Object.keys(s.shops);
    if (!Object.keys(s.shops).length) { r.mood = 'noShop'; return false; }
    const reserved = new Set(s.residents.filter(o => o !== r && o.spot).map(o => o.spot));
    const spotShop = new Map();
    let anySpot = false;
    for (const k of keys) for (const p of G.shop.spotsFor(s, k)) {
      anySpot = true;
      const pk = W().key(p.x, p.y);
      if (!reserved.has(pk)) spotShop.set(pk, k);
    }
    if (!spotShop.size) { r.mood = anySpot ? 'full' : 'cantReach'; return false; }
    const path = P().find(s.world, tileOf(r), new Set(spotShop.keys()));
    if (!path) { r.mood = 'cantReach'; return false; }
    const end = path.length ? path[path.length - 1] : tileOf(r);
    r.spot = W().key(end.x, end.y);
    r.shopKey = spotShop.get(r.spot);
    r.goal = end; r.path = path;
    r.state = 'toShop'; r.mood = 'hungry';
    return true;
  }

  // 買えた（店員から、またはアルバイトの自分から）
  function served(s, r) {
    r.mood = 'ate';
    r.lastServed = s.time;
    r.hungerTimer = G.config.residentHungerInterval * (0.8 + 0.4 * G.rng());
    goHome(s, r);
  }

  // アルバイト中は、おなかに関係なく1人ずつ順番に来る
  function pullForJob(s) {
    const k = s.job.counter;
    if (s.residents.some(r => r.shopKey === k && (r.state === 'toShop' || r.state === 'queued'))) return;
    const cands = s.residents.filter(r => r.state === 'home' && r.pullBlockedUntil <= s.time)
      .sort((a, b) => a.lastServed - b.lastServed);
    for (const r of cands) {
      if (goShop(s, r, k)) return;
      r.pullBlockedUntil = s.time + 5;
    }
  }

  function update(s, dt) {
    // ベッドと住人をそろえる
    const have = new Set(s.residents.map(bedKey));
    for (const b of W().findAll(s.world, 'bed')) if (!b.own && !have.has(W().key(b.x, b.y))) create(s, b);
    for (const r of s.residents) {
      const o = W().objAt(s.world, r.bed.x, r.bed.y);
      if (r.state !== 'leaving' && (!o || o.type !== 'bed')) startLeaving(s, r);
      if (r.shopKey && !s.shops[r.shopKey]) goHome(s, r);
    }

    for (const r of s.residents) {
      if (r.gone) continue;
      if (r.mood === 'ate' && s.time - r.lastServed > 30) r.mood = 'normal';
      if (r.state !== 'leaving') G.wishes.tick(s, r, dt, G.rng);
      switch (r.state) {
        case 'arriving':
        case 'returning': {
          const st = walk(s, r, dt);
          if (st === 'arrived') r.state = 'home';
          else if (st === 'blocked') warpHome(s, r);
          break;
        }
        case 'home':
          r.hungerTimer -= dt;
          if (r.hungerTimer <= 0) {
            if (!goShop(s, r)) r.hungerTimer = G.config.retryInterval;
            break;
          }
          r.useTimer -= dt;
          if (r.useTimer <= 0) {
            r.useTimer = useInterval();
            goFurniture(s, r);
          }
          if (r.state !== 'home') break;
          r.visitTimer -= dt;
          if (r.visitTimer <= 0) {
            r.visitTimer = visitInterval();
            goMachine(s, r); // 景品を渡すまではクレーンには行かない
          }
          break;
        case 'toFurniture':
        case 'using': {
          if (!furnitureAt(s, r.useKey)) { goHome(s, r); break; }
          r.hungerTimer -= dt;
          if (r.hungerTimer <= 0) {
            // おなかがすいたら、使うのをやめてお店へ。行けなければ続ける
            const from = r.useFrom, key = r.useKey, pos = { x: r.x, y: r.y };
            standUp(r);
            if (goShop(s, r)) break;
            r.hungerTimer = G.config.retryInterval;
            r.useFrom = from; r.useKey = key; r.x = pos.x; r.y = pos.y;
          }
          if (r.state === 'toFurniture') {
            const st = walk(s, r, dt);
            if (st === 'arrived') startUsing(s, r);
            else if (st === 'blocked') goHome(s, r);
          } else if (s.time >= r.useUntil) goHome(s, r);
          break;
        }
        case 'toMachine':
        case 'playingMachine': {
          if (!machineAt(s, r.machineKey)) { goHome(s, r); break; }
          r.hungerTimer -= dt;
          if (r.hungerTimer <= 0) {
            // おなかがすいたら、遊ぶのをやめてお店へ。行けなければ続ける
            const key = r.machineKey;
            standUp(r);
            if (goShop(s, r)) break;
            r.hungerTimer = G.config.retryInterval;
            r.machineKey = key;
          }
          if (r.state === 'toMachine') {
            const st = walk(s, r, dt);
            if (st === 'arrived') arriveMachine(s, r);
            else if (st === 'blocked') goHome(s, r);
          } else if (s.time >= r.machineUntil) finishMachine(s, r);
          break;
        }
        case 'toShop': {
          const st = walk(s, r, dt);
          if (st === 'arrived') { r.state = 'queued'; r.queuedAt = s.time; }
          else if (st === 'blocked') goHome(s, r);
          break;
        }
        case 'queued':
          break;
        case 'leaving':
          if (walk(s, r, dt) !== 'moving') r.gone = true;
          break;
      }
    }
    s.residents = s.residents.filter(r => !r.gone);
    if (s.job.active) pullForJob(s);
  }

  const oneOf = (lines) => lines[Math.floor(G.rng() * lines.length)];

  // おなかがすいているのに、お店がない・行けない・混んでいて家で待っている
  const WAIT_MOODS = { noShop: true, cantReach: true, full: true };
  const waitingHungry = (r) => !!WAIT_MOODS[r.mood] && ['home', 'toFurniture', 'using', 'toMachine', 'playingMachine'].indexOf(r.state) >= 0;
  // 頭の上に 🍔 の吹き出しを出すか（ほしいものより先）
  const wantsBurger = (r) => r.state === 'toShop' || r.state === 'queued' || waitingHungry(r);

  // はなす。ほしいものがかなっていたらお礼をくれる。次に、クレーンで取った景品をくれる
  // 戻り値 { text, reward?, gift?: { id, isNew } }
  function talk(s, r) {
    if (G.wishes.granted(s, r)) {
      const res = G.wishes.thank(s, r, G.rng);
      return { text: `${G.furniture.kindOf(res.kind).label} ありがとう！`, reward: res.reward };
    }
    if (r.gift) {
      const id = r.gift, isNew = !G.furniture.isUnlocked(s, id);
      r.gift = null;
      G.furniture.unlock(s, id);
      return { text: `${G.furniture.kindOf(id).label} あげる！`, gift: { id, isNew } };
    }
    if (r.state === 'toShop' || r.state === 'queued') return { text: oneOf(LINES.hungry) };
    if (waitingHungry(r)) return { text: oneOf(LINES[r.mood]) };
    if (r.wish) return { text: `${G.furniture.kindOf(r.wish).label}が ほしいな` };
    if (r.mood === 'normal' && !G.wishes.pick(s, r, () => 0)) return { text: oneOf(LINES.allSet) };
    if (r.mood === 'normal' && r.happiness >= 3) return { text: oneOf(LINES.happy) };
    return { text: oneOf(LINES[r.mood] || LINES.normal) };
  }

  // 読み込んだとき: 家具・台へ向かう途中・使っている途中は家にいることにする。足りない項目をうめる
  function restore(s, r) {
    if (!r.wish || !G.furniture.kindOf(r.wish)) r.wish = null;
    if (typeof r.happiness !== 'number') r.happiness = 0;
    if (typeof r.wishTimer !== 'number') r.wishTimer = G.wishes.firstTimer(G.rng);
    if (typeof r.useTimer !== 'number') r.useTimer = useInterval();
    const g = r.gift && G.furniture.kindOf(r.gift);
    if (!g || !g.prize) r.gift = null;
    if (typeof r.visitTimer !== 'number') r.visitTimer = typeof r.craneTimer === 'number' ? r.craneTimer : visitInterval();
    delete r.craneTimer; delete r.craneKey; delete r.craneUntil;
    r.figures = Array.isArray(r.figures) ? r.figures.filter(id => G.gachaLogic.kindOf(id) && !G.gachaLogic.kindOf(id).trophy) : [];
    r.figures = r.figures.slice(-G.config.residentFigureMax);
    if (['toFurniture', 'using', 'toCrane', 'playingCrane', 'toMachine', 'playingMachine'].indexOf(r.state) >= 0) warpHome(s, r);
    r.useKey = null; r.useFrom = null; r.useUntil = 0; r.machineKey = null; r.machineUntil = 0;
    return r;
  }

  // 自分のまわり1.5マス以内でいちばん近い住人
  function near(s) { return G.player.nearest(s.player, s.residents, 1.5); }

  G.residents = { NAMES, LINES, create, update, served, talk, near, homeSpot, goShop, goMachine, leaveMachine, machineAt, restore, wantsBurger };
})(window.Game = window.Game || {});
</script>
<script>
// ペットのお世話の計算（計算だけで画面には関わらない）: おなか・なかよし・ハート・芸・名前の候補
// しっぱいはない: おなかが空でも何も起きない。なかよしは減らない
(function (G) {
  const C = () => G.config;

  // 6秒で1減る。0で止まる
  function hunger(pet, dt) {
    pet.hunger = Math.max(0, pet.hunger - dt / C().petHungerEvery);
  }

  function hearts(love) {
    return C().heartAt.filter(v => love >= v).length;
  }

  // 覚えた芸の id
  function learned(love) {
    const h = hearts(love);
    return C().tricks.filter(t => h >= t.hearts).map(t => t.id);
  }

  // なかよしを足して、ハートが増えたか・新しく覚えた芸を返す
  function addLove(pet, n) {
    const h0 = hearts(pet.love), t0 = learned(pet.love);
    pet.love += n;
    return { gained: n, heartUp: hearts(pet.love) > h0, newTricks: learned(pet.love).filter(t => t0.indexOf(t) < 0) };
  }

  // なでる。間隔内は増やさない（ハートは出す）。覚えた芸があれば2回に1回くらいする
  function pat(pet, now, rng) {
    const res = now - pet.lastPatAt >= C().petPatCooldown
      ? (pet.lastPatAt = now, addLove(pet, C().petLovePat))
      : { gained: 0, heartUp: false, newTricks: [] };
    const known = learned(pet.love);
    res.trick = known.length && rng() < 0.5 ? known[Math.floor(rng() * known.length)] : null;
    return res;
  }

  function feed(pet) {
    pet.hunger = C().petHungerMax;
    return addLove(pet, C().petLoveFeed);
  }

  // 名前の候補（重ならない4つ）
  function nameChoices(kind, rng) {
    const all = G.sprites.pets[kind].names.slice();
    const out = [];
    while (out.length < 4 && all.length) out.push(all.splice(Math.floor(rng() * all.length), 1)[0]);
    return out;
  }

  G.petCare = { hunger, hearts, learned, addLove, pat, feed, nameChoices };
})(window.Game = window.Game || {});
</script>
<script>
// ペット: ついてくる（follow）か、自分のベッドのまわりでうろうろ（idle ↔ walking）
// 閉じ込められたら自分のベッドのそばへぱっと戻る（エラーにしない）
// おうちにいる子は、ときどきベッドの近くのおもちゃへ行って遊ぶ（toToy → toy）。遊ぶと なかよし +1
// 同じ種類のフィギュア（かペットのトロフィー）を飾ったかざりだなも、同じように見に行く
(function (G) {
  const W = () => G.world, P = () => G.pathfind, C = () => G.config;
  const tileOf = (p) => ({ x: Math.round(p.x), y: Math.round(p.y) });
  const kindOf = (id) => C().petKinds.find(k => k.id === id);

  function create(s, kind, name) {
    const t = G.player.tile(s.player);
    const p = { id: s.nextId++, kind, name, x: t.x, y: t.y, follow: true,
      hunger: C().petHungerMax, love: 0, lastPatAt: -1e9 };
    reset(p);
    s.pets.push(p);
    return p;
  }

  const toyInterval = () => C().toyMin + (C().toyMax - C().toyMin) * G.rng();

  // 歩いている途中・芸・おもちゃで遊んでいる途中など、セーブしなくてよいところを初めにもどす
  function reset(p) {
    Object.assign(p, { path: [], state: 'idle', idleUntil: 0, repathAt: 0, trick: null, moving: false, toyKey: null, toyUntil: 0 });
    if (typeof p.toyTimer !== 'number') p.toyTimer = toyInterval();
    return p;
  }

  // 読み込んだペット。知らない種類は取り除く
  function restore(list) { return list.filter(p => p && kindOf(p.kind)).map(reset); }

  // 自分のベッドのとなりの行けるマス。なければベッドの上
  function homeSpot(s) {
    const b = C().ownBed;
    return W().passableNeighbors(s.world, b.x, b.y)[0] || { x: b.x, y: b.y };
  }

  function warpHome(s, p) {
    const h = homeSpot(s);
    Object.assign(p, { x: h.x, y: h.y, path: [] });
  }

  // いるマスに壁などが置かれたら、となりの行けるマスへ。なければベッドのそばへ
  function getOut(s, p) {
    const t = tileOf(p);
    if (W().isPassable(s.world, t.x, t.y)) return;
    const n = W().passableNeighbors(s.world, t.x, t.y)[0];
    if (n) Object.assign(p, { x: n.x, y: n.y, path: [] });
    else warpHome(s, p);
  }

  // 道にそって歩く。'moving' | 'arrived' | 'blocked'
  function walk(s, p, speed, dt) {
    let left = speed * dt;
    while (left > 0 && p.path.length) {
      const t = p.path[0];
      if (!W().isPassable(s.world, t.x, t.y)) { p.path = []; return 'blocked'; }
      const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy);
      if (d <= left) { p.x = t.x; p.y = t.y; p.path.shift(); left -= d; }
      else { p.x += dx / d * left; p.y += dy / d * left; left = 0; }
    }
    return p.path.length ? 'moving' : 'arrived';
  }

  // leader（前の子、先頭は自分）の後ろを歩く
  function followStep(s, p, leader, dt) {
    const c = C();
    if (s.job.active) { p.path = []; return; } // アルバイト中はその場で待つ
    const d = Math.hypot(leader.x - p.x, leader.y - p.y);
    if (d <= c.petFollowNear) { p.path = []; return; }
    if (s.time >= p.repathAt) {
      p.repathAt = s.time + c.petRepath;
      const lt = tileOf(leader);
      const path = P().find(s.world, tileOf(p), new Set([W().key(lt.x, lt.y)]));
      if (!path) { warpHome(s, p); return; }
      p.path = path;
    }
    const speed = c.petSpeeds[kindOf(p.kind).move] * (d >= c.petCatchUpDist ? c.petCatchUpRate : 1);
    walk(s, p, speed, dt);
  }

  // 自分のベッドのまわり（まっすぐの距離で半径以内）の行けるマスを選んで歩き、着いたら少し止まる
  function homeStep(s, p, dt) {
    const c = C(), b = c.ownBed;
    if (p.path.length) {
      if (walk(s, p, c.petSpeeds[kindOf(p.kind).move], dt) === 'moving') return;
      p.idleUntil = s.time + c.petIdleMin + (c.petIdleMax - c.petIdleMin) * G.rng();
      return;
    }
    if (s.time < p.idleUntil) return;
    const here = tileOf(p), R = c.petHomeRadius, cands = [];
    for (let y = b.y - R; y <= b.y + R; y++) for (let x = b.x - R; x <= b.x + R; x++)
      if (Math.hypot(x - b.x, y - b.y) <= R && W().isPassable(s.world, x, y) && (x !== here.x || y !== here.y))
        cands.push({ x, y });
    const goal = cands[Math.floor(G.rng() * cands.length)];
    const path = goal && P().find(s.world, here, new Set([W().key(goal.x, goal.y)]));
    if (path) { p.path = path; return; }
    if (Math.hypot(p.x - b.x, p.y - b.y) > R + 1) warpHome(s, p);
    p.idleUntil = s.time + 1;
  }

  // k のマスで、ペット p が遊べる・見られるもの { emoji, love }。なければ null
  // おもちゃ、または p と同じ種類のフィギュアかペットのトロフィーが飾ってあるかざりだな
  function toyAt(s, k, p) {
    if (!k) return null;
    const { x, y } = W().parseKey(k), o = W().objAt(s.world, x, y);
    if (!o) return null;
    const kind = G.furniture.kindOf(o.type);
    if (kind && kind.petToy) return { emoji: G.sprites.furniture[o.type].emoji, love: C().toyLove };
    if (o.type !== 'figureShelf' || !p) return null;
    const sh = G.figures.shelfAt(s, k) || [];
    const id = sh.find(f => f && (f === 'trophyPet' || G.gachaLogic.kindOf(f).pet === p.kind));
    return id ? { emoji: G.sprites.figures[id].emoji, love: C().shelfLove, shelf: true } : null;
  }

  function stopToy(p) {
    Object.assign(p, { state: 'idle', toyKey: null, toyUntil: 0, path: [], idleUntil: 0 });
  }

  // おもちゃで遊ぶ。遊びに向かっている・遊んでいるあいだは true（いつものうろうろはしない）
  function toyStep(s, p, dt) {
    const c = C();
    if (p.state === 'toToy' || p.state === 'toy') {
      const toy = toyAt(s, p.toyKey, p);
      if (!toy) { stopToy(p); return false; }
      if (p.state === 'toToy') {
        const st = walk(s, p, c.petSpeeds[kindOf(p.kind).move], dt);
        if (st === 'arrived') { p.state = 'toy'; p.toyUntil = s.time + c.toyPlayTime; }
        else if (st === 'blocked') stopToy(p);
        return true;
      }
      if (s.time >= p.toyUntil) {
        G.state.emit({ type: 'love', pet: p, res: G.petCare.addLove(p, toy.love) });
        stopToy(p);
      }
      return true;
    }
    p.toyTimer -= dt;
    if (p.toyTimer > 0) return false;
    p.toyTimer = toyInterval();
    const b = c.ownBed, R = c.petHomeRadius, toys = [];
    for (let y = b.y - R; y <= b.y + R; y++) for (let x = b.x - R; x <= b.x + R; x++)
      if (Math.hypot(x - b.x, y - b.y) <= R && toyAt(s, W().key(x, y), p)) toys.push({ x, y });
    while (toys.length) {
      const t = toys.splice(Math.floor(G.rng() * toys.length), 1)[0];
      const goals = new Set(W().passableNeighbors(s.world, t.x, t.y).map(q => W().key(q.x, q.y)));
      const path = goals.size && P().find(s.world, tileOf(p), goals);
      if (!path) continue;
      Object.assign(p, { state: 'toToy', toyKey: W().key(t.x, t.y), path });
      return true;
    }
    return false;
  }

  function update(s, dt) {
    let leader = s.player;
    for (const p of s.pets) {
      G.petCare.hunger(p, dt);
      if (p.trick && s.time >= p.trick.until) p.trick = null;
      getOut(s, p);
      if (p.follow) { followStep(s, p, leader, dt); leader = p; }
      else if (!toyStep(s, p, dt)) homeStep(s, p, dt);
      p.moving = p.path.length > 0;
    }
  }

  // なでる。芸をすることもある
  function pat(s, p) {
    const res = G.petCare.pat(p, s.time, G.rng);
    if (res.trick) p.trick = { id: res.trick, until: s.time + C().trickTime };
    return res;
  }

  function feed(s, p) {
    if (s.player.food <= 0) return { ok: false, why: 'food' };
    s.player.food--;
    return Object.assign({ ok: true }, G.petCare.feed(p));
  }

  function setFollow(p, on) {
    p.follow = on;
    stopToy(p); p.repathAt = 0;
  }

  // 自分のまわり1.5マス以内でいちばん近いペット
  function near(s) { return G.player.nearest(s.player, s.pets, 1.5); }

  G.pets = { kindOf, create, restore, update, pat, feed, setFollow, near, homeSpot, toyAt };
})(window.Game = window.Game || {});
</script>
<script>
// ペットやさん: petCounter 1つがお店1軒。店員は表示だけで、行列はない。ペットとえさを買う
(function (G) {
  // 自分のまわり（となり・ななめ）にあるペットやさん
  function nearPetShop(s) {
    const pt = G.player.tile(s.player);
    return G.world.findAdjacent(s.world, pt.x, pt.y, 'petCounter');
  }

  // 買えないときはお金を減らさない。why: 'unknown' | 'full' | 'money'
  function buyPet(s, kindId, name) {
    const kind = G.pets.kindOf(kindId);
    if (!kind) return { ok: false, why: 'unknown' };
    if (s.pets.length >= G.config.petMax) return { ok: false, why: 'full' };
    if (s.player.money < kind.price) return { ok: false, why: 'money' };
    s.player.money -= kind.price;
    return { ok: true, pet: G.pets.create(s, kindId, name) };
  }

  function buyFood(s) {
    if (s.player.money < G.config.foodPrice) return { ok: false, why: 'money' };
    s.player.money -= G.config.foodPrice;
    s.player.food++;
    return { ok: true };
  }

  G.petShop = { nearPetShop, buyPet, buyFood };
})(window.Game = window.Game || {});
</script>
<script>
// ゲーム全体の状態（セーブするのはこれ全部）と、1コマ進める処理
(function (G) {
  G.rng = G.rng || Math.random;
  const VERSION = 5;

  function create() {
    const c = G.config;
    const world = G.world.create(c.mapW, c.mapH);
    world.obj[c.ownBed.y * c.mapW + c.ownBed.x] = { type: 'bed', own: true };
    return {
      version: VERSION, time: 0, nextId: 1,
      world,
      player: G.player.create(),
      residents: [],
      pets: [],
      fridge: 0, unlocked: [],
      shops: {},
      cranes: {}, cranePlay: null,
      gachas: {}, gachaPlay: null, figures: {}, streak: { pet: 0, town: 0, food: 0 }, shelves: {}, capsules: [],
      job: { active: false, counter: null, deliveries: 0, customerId: null, order: null, stack: [] },
    };
  }

  // 人が立っている（これから入る）マス。ここには壁などを置けない（ペットは入れない。置かれたら自分でよける）
  function occupied(s) {
    const set = new Set();
    const add = (x, y) => set.add(G.world.key(Math.round(x), Math.round(y)));
    const p = s.player;
    for (const dx of [-0.3, 0.3]) for (const dy of [-0.3, 0.3]) add(p.x + dx, p.y + dy);
    for (const r of s.residents) {
      add(r.x, r.y);
      if (r.path.length) add(r.path[0].x, r.path[0].y);
      if (r.useFrom) add(r.useFrom.x, r.useFrom.y); // 家具に座っている人が戻るマス
    }
    return set;
  }

  function tick(s, dt) {
    s.time += dt;
    G.shop.reconcile(s);
    G.crane.reconcile(s);
    G.gacha.reconcile(s);
    G.figures.reconcile(s);
    G.residents.update(s, dt);
    G.pets.update(s, dt);
    G.shop.update(s, dt);
    G.crane.update(s, dt);
    G.gacha.update(s, dt);
  }

  // 画面に知らせること（クレーンの結果・ペットのなかよしなど）。セーブしない。main が毎コマ取り出す
  const events = [];
  const emit = (e) => { events.push(e); };
  const drain = () => events.splice(0, events.length);

  G.state = { VERSION, create, occupied, tick, events, emit, drain };
})(window.Game = window.Game || {});
</script>
<script>
// セーブ: ブラウザの中（localStorage）と、ファイルへの書き出し・読み込み
(function (G) {
  function serialize(s) { return JSON.stringify(s); }

  // 古い版のデータを今の版にそろえる
  function migrate(s) {
    if (s && s.version === 1 && s.player) {
      s.pets = [];
      s.player.food = 0;
      s.version = 2;
    }
    if (s && s.version === 2 && s.player) {
      s.player.hand = 0;
      s.fridge = 0;
      s.unlocked = [];
      s.version = 3; // 住人に足す項目は deserialize の residents.restore でうめる
    }
    if (s && s.version === 3 && s.player) {
      s.cranes = {};
      s.version = 4; // 住人の gift・ペットの toyTimer は restore でうめる
    }
    if (s && s.version === 4 && s.player) {
      Object.assign(s, { gachas: {}, figures: {}, streak: { pet: 0, town: 0, food: 0 }, shelves: {}, capsules: [] });
      s.version = 5; // 住人の craneTimer → visitTimer・figures は restore で
    }
    return s;
  }

  // 形がおかしければ例外
  function deserialize(text) {
    const s = migrate(JSON.parse(text));
    const c = G.config;
    const ok = s && s.version === G.state.VERSION && s.world && s.world.w === c.mapW && s.world.h === c.mapH
      && Array.isArray(s.world.floor) && s.world.floor.length === c.mapW * c.mapH
      && Array.isArray(s.world.obj) && s.world.obj.length === c.mapW * c.mapH
      && s.player && typeof s.player.money === 'number' && Array.isArray(s.residents)
      && s.shops && typeof s.shops === 'object' && s.job && typeof s.time === 'number'
      && Array.isArray(s.pets) && typeof s.player.food === 'number'
      && typeof s.player.hand === 'number' && typeof s.fridge === 'number' && Array.isArray(s.unlocked)
      && s.cranes && typeof s.cranes === 'object'
      && s.gachas && typeof s.gachas === 'object' && s.figures && typeof s.figures === 'object'
      && s.streak && typeof s.streak === 'object' && s.shelves && typeof s.shelves === 'object'
      && Array.isArray(s.capsules);
    if (!ok) throw new Error('bad save');
    s.pets = G.pets.restore(s.pets); // 知らない種類は取り除き、歩いている途中などは初めから
    G.furniture.restoreWorld(s); // 知らない家具は取り除く
    G.crane.restore(s); // 台のない記録・知らない景品を取り除く。遊んでいる途中は終わり
    G.figures.restore(s); // 知らないフィギュア・おかしい数・たなのないマスの記録を取り除く
    G.gacha.restore(s); // 台のない記録・通れないマスのカプセルを取り除く。まわしている途中は終わり
    for (const r of s.residents) G.residents.restore(s, r);
    s.job.active = false; // 開き直したらアルバイトは終わっている
    s.job.customerId = null; s.job.order = null; s.job.stack = [];
    return s;
  }

  // 戻り値 { state, status: 'new' | 'loaded' | 'recovered' }
  // recovered: 壊れていたので新しく始めた（壊れたデータは別のキーに残す）
  function load(storage) {
    const key = G.config.saveKey;
    let text = null;
    try { text = storage.getItem(key); } catch (e) { /* 保存が使えない */ }
    if (!text) return { state: G.state.create(), status: 'new' };
    try { return { state: deserialize(text), status: 'loaded' }; }
    catch (e) {
      try { storage.setItem(key + '-broken-' + Date.now(), text); } catch (e2) { /* 残せなくても続ける */ }
      return { state: G.state.create(), status: 'recovered' };
    }
  }

  function save(storage, s) {
    try { storage.setItem(G.config.saveKey, serialize(s)); return true; }
    catch (e) { return false; }
  }

  G.save = { serialize, deserialize, load, save };
})(window.Game = window.Game || {});
</script>
<script>
// 操作: ぷにコン（触ったところにスティック）・マウスのドラッグ・矢印キー。つくるモードはタップで置く・なぞって動かす
(function (G) {
  const RADIUS = 50, DEAD = 0.15;
  const keys = new Set();
  const input = {
    joy: null,   // { ox, oy, cx, cy, id }
    drag: null,  // つくるモードのなぞり
  };

  function init(app) {
    const cv = app.canvas;
    cv.addEventListener('pointerdown', (e) => {
      cv.setPointerCapture(e.pointerId);
      if (app.mode === 'walk') input.joy = { ox: e.clientX, oy: e.clientY, cx: e.clientX, cy: e.clientY, id: e.pointerId };
      else if (app.mode === 'build')
        input.drag = { x: e.clientX, y: e.clientY, cam: { ...app.cam }, moved: false, id: e.pointerId };
    });
    cv.addEventListener('pointermove', (e) => {
      if (input.joy && e.pointerId === input.joy.id) { input.joy.cx = e.clientX; input.joy.cy = e.clientY; }
      const d = input.drag;
      if (d && e.pointerId === d.id) {
        const dx = e.clientX - d.x, dy = e.clientY - d.y;
        if (Math.hypot(dx, dy) > 10) d.moved = true;
